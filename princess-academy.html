        wrap.append(A.box, B.box);
        stage.appendChild(wrap);
        countAll = tapToCount(A.gems.concat(B.gems));
      },
      choices: numberChoices(n, 10, 20, k),
      onHint: () => countAll && countAll(),
      hint: `This frame is full. That's ten! Then count on: ${U.countAloud(11, n)}. Ten and ${W(n - 10)} make ${W(n)}! Tap ${W(n)}.`,
      praise: U.pick([`Yes! Ten and ${W(n - 10)} make ${W(n)}!`, `${W(n)}! One full ten, and ${W(n - 10)} more.`])
    };
  }

  // 12: number path, what's missing?
  function trackQ(c, k) {
    const hiStart = 24 + Math.round(c * 70); // grows from the 20s up toward 100
    const s = U.rand(6, hiStart);
    const decade = Math.floor((s + 2) / 10);
    const len = 5, gap = U.rand(1, len - 1), ans = s + gap;
    const nums = []; for (let i = 0; i < len; i++) nums.push(s + i);
    const read = c < 0.4;
    let blankEl;
    return {
      key: 'track:' + decade,
      prompt: read ? `Count along the path: ${nums.map((x, i) => i === gap ? 'hmmm' : W(x)).join(', ')}. What number is missing?`
        : 'Count along the number path. What number is missing?',
      build(stage) {
        const tr = U.el('div', 'card track');
        nums.forEach((x, i) => {
          const d = U.el('div', 'tsq' + (i === gap ? ' blank' : ''), i === gap ? '?' : String(x));
          if (i === gap) blankEl = d; else U.tag(d, W(x));
          tr.appendChild(d);
        });
        stage.appendChild(tr);
      },
      choices: numberChoices(ans, 1, 109, k),
      onHint: () => blankEl && U.tag(blankEl, W(ans)),
      onRight: () => { if (blankEl) { blankEl.className = 'tsq filled'; blankEl.textContent = String(ans); U.tag(blankEl, W(ans)); } },
      hint: `Let's count: ${U.countAloud(s, s + len - 1)}. ${W(ans)} is missing! Tap ${W(ans)}.`,
      praise: U.pick([`Yes! ${W(ans - 1)}, ${W(ans)}, ${W(ans + 1)}!`, `${W(ans)}! You know your numbers!`])
    };
  }

  // 13: make ten
  function makeTenQ(k) {
    const n = pickKey('ten:', 1, 9), t = U.pick(THINGS), need = 10 - n;
    let countAll;
    return {
      key: 'ten:' + n,
      prompt: `A full frame holds ten ${t.p}. There are ${W(n)}. How many more to fill it up?`,
      build(stage) {
        const f = tenFrame(t, n, true);
        stage.appendChild(f.box);
        countAll = tapToCount(f.empty);
      },
      choices: numberChoices(need, 1, 9, k),
      onHint: () => countAll && countAll(),
      hint: `Count the empty spots: ${U.countAloud(1, need)}. ${W(n)} and ${W(need)} make ten! Tap ${W(need)}.`,
      praise: U.pick([`Yes! ${W(n)} and ${W(need)} make ten!`, `${W(need)} more fills it up! ${W(n)} and ${W(need)} make ten.`])
    };
  }

  // 14: count on from the number in the chest
  function countOnQ(c, k) {
    const a = pickKey('on:', 4, 12 + Math.round(c * 8)), b = U.rand(1, 3 + Math.round(c * 2)), S = a + b;
    const t = U.pick(THINGS);
    let countAll;
    return {
      key: 'on:' + a,
      prompt: `There are ${W(a)} ${t.p} in the treasure chest, and ${W(b)} more here. How many altogether?` + (c < 0.5 ? ` Start at ${W(a)} and count on.` : ''),
      build(stage) {
        const chest = U.tag(U.el('div', 'card chest', `<span class="emoji">🧰</span><span class="give-big">${a}</span>`), W(a));
        const B = gemBox(t, b);
        stage.append(chest, U.el('div', 'plus', '+'), B.box);
        countAll = tapToCount(B.gems, a);
      },
      choices: numberChoices(S, 1, 40, k),
      onHint: () => countAll && countAll(),
      hint: `Start at ${W(a)}, the number in the chest. Then count on: ${U.countAloud(a + 1, S)}. ${W(S)} altogether! Tap ${W(S)}.`,
      praise: U.pick([`Yes! ${W(a)}... ${U.countAloud(a + 1, S)}. ${W(S)}!`, `${W(S)}! You counted on from ${W(a)}!`])
    };
  }

  // 15: adding within 20, the make-ten way
  function add20Q(k) {
    const S = pickKey('add20:', 11, 18);
    const a = U.rand(Math.max(S - 9, 6), 9), b = S - a, fill = 10 - a, rest = b - fill;
    const t = U.pick(THINGS);
    let countAll, A, B;
    return {
      key: 'add20:' + S,
      prompt: `${W(a)} ${t.p} in this frame, and ${W(b)} in that one. How many altogether?`,
      build(stage) {
        const wrap = U.el('div', 'frames');
        A = tenFrame(t, a); B = tenFrame(t, b);
        wrap.append(A.box, U.el('div', 'plus', '+'), B.box);
        stage.appendChild(wrap);
        countAll = tapToCount(A.gems.concat(B.gems));
      },
      choices: numberChoices(S, 10, 20, k),
      // hint: slide gems over to fill the first frame, so she sees ten and some more
      onHint: () => {
        if (!A) return;
        const stay = B.gems.slice(0, b - fill), moved = B.gems.slice(b - fill);
        moved.forEach((g, i) => A.slots[a + i].appendChild(g));
        // number them in the order they now sit: the full ten first, then the rest
        countAll = tapToCount(A.gems.concat(moved, stay));
        countAll();
      },
      hint: `${W(a)} needs ${W(fill)} more to make ten. Let's move ${W(fill)} over. Now there's ten, and ${W(rest)} more: ${W(S)}! Tap ${W(S)}.`,
      praise: U.pick([`Yes! ${W(a)} and ${W(b)} make ${W(S)}!`, `${W(S)}! Ten and ${W(rest)} more!`])
    };
  }

  // 16: count by tens (sticks of ten), then tens and ones
  function tensQ(c, k) {
    const tens = pickKey('tens:', 2, 9);
    const ones = Math.random() < c ? U.rand(1, 9) : 0;
    const n = tens * 10 + ones;
    const t = U.pick(THINGS);
    let countAll;
    const opts = U.shuffle([n - 10, n + 10, n - 1, n + 1, n + 20].filter(x => x >= 10 && x <= 100 && (ones || x % 10 === 0)));
    const set = new Set([n]); for (const x of opts) if (set.size < k) set.add(x);
    return {
      key: 'tens:' + tens,
      prompt: `Each stick has ten ${t.p}. How many ${t.p}? Count the sticks by tens${ones ? ', then count on the loose ones' : ''}.`,
      build(stage) {
        const row = U.el('div', 'card sticks');
        const parts = [];
        for (let i = 0; i < tens; i++) {
          const st = U.el('button', 'stick emoji', Array(11).join(`<span>${t.e}</span>`));
          row.appendChild(st); parts.push({ el: st, v: 10 });
        }
        if (ones) {
          const o = U.el('div', 'ones');
          for (let i = 0; i < ones; i++) { const g = U.el('button', 'one emoji', t.e); o.appendChild(g); parts.push({ el: g, v: 1 }); }
          row.appendChild(o);
        }
        stage.appendChild(row);
        let total = 0;
        const mark = (p, v) => { p.el.dataset.n = v; p.el.classList.add('counted'); U.tag(p.el, W(v)); };
        parts.forEach(p => {
          p.el.onclick = () => {
            if (p.el.classList.contains('counted')) return;
            // tens first, then ones
            if (p.v === 1 && parts.some(q => q.v === 10 && !q.el.classList.contains('counted'))) { PA.audio.say('Count the sticks first!'); return; }
            total += p.v; mark(p, total);
            PA.audio.sfx('tap'); PA.audio.say(W(total));
          };
        });
        countAll = () => { let s = 0; parts.forEach(p => { s += p.v; mark(p, s); }); total = s; };
      },
      choices: Array.from(set).sort((a, b) => a - b).map(x => ({ html: String(x), cls: 'num', correct: x === n, aria: String(x) })),
      onHint: () => countAll && countAll(),
      hint: `Count by tens: ${Array.from({ length: tens }, (_, i) => W((i + 1) * 10)).join('... ')}${ones ? '. Then the loose ones: ' + U.countAloud(tens * 10 + 1, n) : ''}. ${W(n)}! Tap ${W(n)}.`,
      praise: U.pick([`Yes! ${W(n)}!`, ones ? `${W(n)}! ${W(tens)} tens and ${W(ones)} ones!` : `${W(n)}! That's ${W(tens)} tens!`])
    };
  }

  PA.games.push({
    id: 'count', name: 'Gem Counting', icon: '💎', color: '#e6dcff', maxLevel: 16,
    skill: 'Counting, how-many, comparing, adding and taking away, then teens, counting on and tens',
    research: 'Follows the Building Blocks learning trajectories (Clements & Sarama): tap-to-count (one-to-one), "give me N" (cardinality, Wynn), subitizing, ten-frames, comparing, one more/less, part-whole "hiding" problems, adding and taking away. Past ten: teen numbers as "ten and some more" (place-value groundwork), the counting sequence up to 100 on a number path, pairs that make ten, counting on from a number instead of from one, adding to 20 the make-ten way, and counting by tens.',
    levels: ['Count 1-5', 'Give me 1-5', 'Quick look 1-5', 'Count 1-10 (ten-frame)', 'More or fewer?', 'Give me 1-10',
      'One more, one less', 'Hiding gems (parts of a number)', 'Adding to 10', 'Taking away from 10',
      'Teen numbers (ten and some more)', 'Number path: what\'s missing? (to 100)', 'Make ten', 'Counting on from a number',
      'Adding to 20 (make ten)', 'Counting by tens'],
    tryAtHome: [
      'Count the stairs out loud together as you climb them.',
      'At snack time, ask for exactly 4 crackers and count them together.',
      'Hide some buttons under a cup: "There are 6 altogether, I can see 4. How many are hiding?"',
      'Roll a real die and see how fast she can say the number without counting.',
      'Tell little number stories at dinner: "You have 3 peas and I give you 2 more..."',
      'Count past ten together: on the stairs, in the bath, in the car. The teens are the tricky part.',
      'Put 8 grapes in a cup, then add 3 more: "Start at 8 and count on: 9, 10, 11!"',
      'Bundle straws or crayons into tens with a hair tie, then count them: "10, 20, 30, 31, 32".'
    ],
    intro: lvl => ['Let\'s count the princess\'s treasures!', 'Let\'s decorate the crown!', 'Get ready for quick looks!',
      'Let\'s count bigger treasures!', 'Which chest has more?', 'Let\'s decorate the crown with lots of jewels!',
      'Let\'s do fairy magic with numbers!', 'Some gems are hiding! Let\'s find them.', 'Let\'s put treasures together!',
      'Watch out for the hungry dragon!', 'Big numbers! Ten, and some more.', 'Let\'s walk the number path!',
      'Let\'s fill the frames to make ten!', 'Let\'s count on from the treasure chest!', 'Big adding! Let\'s make ten.',
      'Let\'s count by tens!'][lvl - 1],
    next(api, i, lvl) {
      const c = api.c, k = api.nOpts(3, 5);
      switch (lvl) {
        case 1: return countQ(1, 5 + Math.round(c * 2), 'row', k);
        case 2: return giveQ(1, 5, 8);
        case 3: return quickQ(c, k);
        case 4: return countQ(3, 10, Math.random() < c * 0.6 ? 'row' : 'ten', k);
        case 5: return compareQ(c);
        case 6: return giveQ(4, 10 + Math.round(c * 4), 12 + Math.round(c * 4));
        case 7: return moreLessQ(c, k);
        case 8: return hidingQ(c, k);
        case 9: return addQ(c, k);
        case 10: return takeQ(c, k);
        case 11: return teenQ(c, k);
        case 12: return trackQ(c, k);
        case 13: return makeTenQ(k);
        case 14: return countOnQ(c, k);
        case 15: return add20Q(k);
        default: return tensQ(c, k);
      }
    }
  });
})();

</script>
<script>/* js/games/path.js */
'use strict';
// CASTLE PATH: a race to the castle on a straight numbered board, against a friendly unicorn.
// Based on Siegler & Ramani (2008, 2009): a few short sessions of a *linear* number board game, where the child
// says each number as she moves ("five, six"), improved preschoolers' number-line estimates, counting and
// numeral knowledge. Circular boards didn't help, so rows always run left to right like a number chart.
//   1 board 1-10, spinner 1-2, tap each square
//   2 board 1-10, spinner 1-3
//   3 board 1-20, spinner 1-3, star squares ask "what comes next?"
//   4 board 1-20, count on: tap the square you'll land on (counting on instead of counting all)
//   5 board 1-30, real dice 1-6, count on, star squares ask before / after / bigger
window.PA = window.PA || {};
PA.games = PA.games || [];
(function () {
  const U = PA.ui;
  const W = U.NUM_WORDS;

  PA.games.push({
    id: 'path', name: 'Castle Path', icon: '🏰', color: '#fff1c7', maxLevel: 5,
    skill: 'Number order, the number line, counting on',
    research: 'Linear number board games (Siegler & Ramani) build a mental number line: she says each number as she moves along it. Later levels move from counting every square to counting on, and star squares ask what comes before and after.',
    levels: ['Board 1-10, spin 1-2', 'Board 1-10, spin 1-3', 'Board 1-20 with star questions', 'Board 1-20, count on', 'Board 1-30, dice 1-6, count on'],
    tryAtHome: [
      'Play any real board game with numbered squares, and have her say the numbers as she moves.',
      'Make a hopscotch line 1-10 with chalk and say each number as you hop.',
      'Ask "Which is bigger, 6 or 8? What comes after 12?" in the car.'
    ],
    playRound(api) {
      const lvl = api.level;
      const END = lvl <= 2 ? 10 : lvl <= 4 ? 20 : 30;
      const SPIN = lvl === 1 ? [1, 2] : lvl === 5 ? [1, 2, 3, 4, 5, 6] : [1, 2, 3];
      const countOn = lvl >= 4;
      const STARS = lvl >= 3 ? (END === 20 ? [4, 9, 13, 17] : [5, 11, 16, 22, 27]) : [];
      const pos = { me: 0, uni: 0 };
      let steps = 0, good = 0;
      api.hideGuide();

      // ---- board ----
      const wrap = U.el('div', 'board-wrap');
      const board = U.el('div', 'board' + (END === 30 ? ' thirty' : ''));
      const squares = {};
      const startSq = U.el('div', 'sq start-sq', '<span class="n emoji" style="font-size:1.4rem">🚩</span>');
      squares[0] = startSq;
      wrap.append(startSq, board);
      for (let n = 1; n <= END; n++) {
        const s = U.el('button', 'sq' + (n === END ? ' castle' : '') + (STARS.indexOf(n) >= 0 ? ' star' : ''), `<span class="n">${n}</span>`);
        if (n === END) s.insertAdjacentHTML('afterbegin', '<span class="emoji star-ic" style="font-size:1.9rem;opacity:.55">🏰</span>');
        else if (STARS.indexOf(n) >= 0) s.insertAdjacentHTML('afterbegin', '<span class="emoji star-ic">⭐</span>');
        s.dataset.n = n;
        squares[n] = s;
        board.appendChild(s);
      }
      const me = U.el('div', 'tok me', PA.art.princessHead());
      const uni = U.el('div', 'tok uni emoji', '🦄');
      function place() {
        squares[pos.me].appendChild(me);
        squares[pos.uni].appendChild(uni);
        const same = pos.me === pos.uni;
        me.classList.toggle('solo', !same); uni.classList.toggle('solo', !same);
      }
      place();

      const ctl = U.el('div', 'path-ctl');
      const label = U.el('div', 'turn-lbl', '');
      const spinner = U.el('button', 'spinner', '');
      ctl.append(label, spinner);
      api.stage.style.flexDirection = 'column';
      api.stage.style.gap = '2rem';
      api.stage.append(wrap, ctl);

      let expect = null;
      Object.keys(squares).forEach(k => { if (k !== '0') squares[k].onclick = () => { if (expect) expect(Number(k)); }; });

      const face = (v, showNum) => U.pips(v) + (showNum ? `<div class="num-under">${v}</div>` : '');
      async function spin() {
        spinner.classList.remove('spin'); void spinner.offsetWidth; spinner.classList.add('spin');
        PA.audio.sfx('sparkle');
        await U.wait(700);
        const v = U.pick(SPIN);
        spinner.innerHTML = face(v, lvl < 5);
        U.tag(spinner, W[v]); // "You got three!" lights up the spinner
        return v;
      }
      // the spinner glows while it's her turn to tap it
      const waitSpinnerTap = () => new Promise(r => {
        U.go(spinner, true); spinner.removeAttribute('data-say');
        spinner.onclick = () => { spinner.onclick = null; U.go(spinner, false); r(); };
      });
      const progress = () => api.setProgress(Math.max(pos.me, pos.uni) / END);

      function waitSquare(target, wrongMsg) {
        return new Promise(resolve => {
          let wrong = 0;
          const idle = setTimeout(() => { squares[target].classList.add('next'); }, countOn ? 12000 : 7000);
          expect = n => {
            if (!api.alive) return;
            if (n === target) {
              clearTimeout(idle); expect = null;
              squares[target].classList.remove('next');
              resolve(wrong === 0);
            } else {
              wrong++; PA.audio.sfx('wrong');
              if (wrong >= 2 || !countOn) squares[target].classList.add('next');
              api.say(wrongMsg(wrong));
            }
          };
        });
      }

      async function starQuestion() {
        const n = pos.me;
        const kinds = lvl === 3 ? ['after'] : ['after', 'before', 'bigger'];
        const kind = U.pick(kinds);
        let q;
        if (kind === 'bigger') {
          const other = U.pick([n - 3, n - 2, n + 2, n + 4].filter(x => x >= 1 && x <= 30));
          const big = Math.max(n, other);
          q = {
            prompt: `Star square! Which number is bigger: ${W[n]} or ${W[other]}?`,
            choices: U.shuffle([n, other]).map(x => ({ html: String(x), cls: 'num', correct: x === big })),
            hint: `${W[big]} comes later when we count, so ${W[big]} is bigger. Tap ${W[big]}.`,
            praise: `Yes! ${W[big]} is bigger!`
          };
        } else {
          const ans = kind === 'after' ? n + 1 : n - 1;
          const opts = Array.from(new Set([ans, ans + 1, ans - 1, ans + 2].filter(x => x >= 1 && x !== n))).slice(0, 3).sort((a, b) => a - b);
          if (opts.indexOf(ans) < 0) opts[0] = ans;
          q = {
            prompt: `Star square! What number comes ${kind} ${W[n]}?`,
            choices: opts.map(x => ({ html: String(x), cls: 'num', correct: x === ans })),
            hint: kind === 'after' ? `${W[n]}... ${W[ans]}! ${W[ans]} comes after ${W[n]}. Tap ${W[ans]}.` : `${W[ans]}... ${W[n]}! ${W[ans]} comes before ${W[n]}. Tap ${W[ans]}.`,
            praise: `Yes! ${W[ans]} comes ${kind} ${W[n]}!`
          };
        }
        const prev = '';
        const ok = await api.overlayChoice(q);
        api.setPrompt(prev);
        steps++; if (ok) good++;
      }

      return (async function () {
        await api.say(countOn ? 'Race the unicorn to the castle! This time, find the square where you will land.' : 'Race the unicorn to the castle! Say the numbers with me as you move.');
        while (api.alive) {
          // --- her turn ---
          label.textContent = 'Your turn!';
          spinner.innerHTML = '<span class="face">?</span>';
          api.prompt(lvl === 5 ? 'Your turn! Tap the dice.' : 'Your turn! Tap the spinner.');
          await waitSpinnerTap();
          if (!api.alive) return null;
          const v = await spin();
          if (!api.alive) return null;
          const toGo = Math.min(v, END - pos.me);
          const target = pos.me + toGo;
          if (countOn) {
            const from = pos.me;
            api.setPrompt(`You're on ${from ? W[from] : 'the start'}, and you got ${W[v]}. Where will you land? Count on and tap the square.`);
            await api.say(`You got ${W[v]}! You're on ${from ? W[from] : 'the start'}. Count on ${W[v]}. Where will you land?`);
            const first = await waitSquare(target, w => w < 2
              ? `Let's count on from ${from ? W[from] : 'the start'}: ${U.countAloud(from + 1, target)}. Try again!`
              : `Count on: ${U.countAloud(from + 1, target)}. Tap the shiny square, ${W[target]}.`);
            if (!api.alive) return null;
            steps++; if (first) good++;
            for (let k = from + 1; k <= target && api.alive; k++) { pos.me = k; place(); PA.audio.sfx('step'); await api.say(W[k]); }
          } else {
            api.setPrompt(`You got ${W[v]}! Move ${W[v]}. Tap the next square.`);
            await api.say(`You got ${W[v]}! Move ${W[v]}${v > 1 ? ' squares' : ' square'}.`);
            for (let k = 0; k < toGo && api.alive; k++) {
              const first = await waitSquare(pos.me + 1, () => `You're on ${pos.me ? W[pos.me] : 'the start'}. What comes next? Tap the shiny square.`);
              if (!api.alive) return null;
              steps++; if (first) good++;
              pos.me++; place(); PA.audio.sfx('step');
              await api.say(W[pos.me]);
            }
          }
          progress();
          if (pos.me >= END) {
            PA.audio.sfx('fanfare'); api.cheer();
            await api.say('You made it to the castle! Hooray!');
            break;
          }
          if (STARS.indexOf(pos.me) >= 0) { await starQuestion(); if (!api.alive) return null; }
          // --- unicorn's turn ---
          label.textContent = 'Unicorn\'s turn';
          api.setPrompt('');
          spinner.onclick = null;
          await api.say('Unicorn\'s turn!');
          if (!api.alive) return null;
          const u = await spin();
          const uGo = Math.min(u, END - pos.uni);
          await api.say(`Unicorn got ${W[u]}.`);
          for (let k = 0; k < uGo && api.alive; k++) {
            pos.uni++; place(); PA.audio.sfx('step');
            await api.say(W[pos.uni]);
            await U.wait(150);
          }
          progress();
          if (pos.uni >= END) {
            api.cheer();
            await api.say('Unicorn reached the castle first! What a good race. You counted so well!');
            break;
          }
        }
        if (!api.alive) return null;
        return { correct: good, total: Math.max(steps, 1) };
      })();
    }
  });
})();

</script>
<script>/* js/games/sounds.js */
'use strict';
// LETTERS: from hearing sounds to reading and spelling little words. Phonemic awareness and letter-sound
// knowledge are the strongest early predictors of reading (National Early Literacy Panel, 2008), and systematic
// phonics (letters taught a few at a time, then blended into words) is the best-supported way to teach reading
// (National Reading Panel, 2000). Spelling words with letter tiles strengthens reading too (Ehri).
//   1 same first sound (listening only): "Which starts like SUN?"
//   2 letter -> picture: "This is S, like in sun. Which picture starts with S?"
//   3 picture -> letter: "Dog. Which letter does dog start with?"
//   4 big and little letters: "Find little d", with look-alikes (b d p, m n) as the tricky choices
//   5 which word says "cat"? (match a spoken word to print)
//   6 spell it: put the letters of "cat" in order
//   7 read it yourself: the word is shown but not spoken; tap the picture it names
// Letters arrive a few at a time in a systematic-phonics order (s a t p first). Words starting with blends
// (st, tr, cr...) are left out of the first-sound levels because their first sound is much harder to hear.
window.PA = window.PA || {};
PA.games = PA.games || [];
(function () {
  const U = PA.ui;
  const L = {
    s: [['☀️', 'sun'], ['🧦', 'sock'], ['🦭', 'seal'], ['🥪', 'sandwich']],
    a: [['🍎', 'apple'], ['🐜', 'ant'], ['🚑', 'ambulance']],
    t: [['🐯', 'tiger'], ['⛺', 'tent'], ['🐢', 'turtle'], ['🦷', 'tooth'], ['🌮', 'taco']],
    p: [['🐷', 'pig'], ['🍕', 'pizza'], ['🐧', 'penguin'], ['🎃', 'pumpkin'], ['🐼', 'panda']],
    n: [['👃', 'nose'], ['📿', 'necklace'], ['🥅', 'net']],
    m: [['🌙', 'moon'], ['🐭', 'mouse'], ['🐵', 'monkey'], ['🥛', 'milk'], ['🍄', 'mushroom'], ['🧜‍♀️', 'mermaid']],
    d: [['🐶', 'dog'], ['🦆', 'duck'], ['🍩', 'doughnut'], ['🐬', 'dolphin'], ['🦌', 'deer']],
    g: [['🐐', 'goat'], ['🎁', 'gift'], ['🎸', 'guitar'], ['👻', 'ghost'], ['🦍', 'gorilla']],
    o: [['🐙', 'octopus'], ['🦦', 'otter'], ['🐂', 'ox']],
    c: [['🐱', 'cat'], ['🎂', 'cake'], ['🚗', 'car'], ['🐮', 'cow'], ['🥕', 'carrot'], ['🍪', 'cookie'], ['🏰', 'castle']],
    e: [['🥚', 'egg'], ['🐘', 'elephant'], ['🧝', 'elf']],
    u: [['☂️', 'umbrella'], ['⬆️', 'up']],
    r: [['🐰', 'rabbit'], ['🌈', 'rainbow'], ['💍', 'ring'], ['🤖', 'robot'], ['🌹', 'rose'], ['🚀', 'rocket']],
    h: [['🐴', 'horse'], ['🎩', 'hat'], ['❤️', 'heart'], ['🏠', 'house'], ['🦛', 'hippo'], ['🍔', 'hamburger']],
    b: [['🐝', 'bee'], ['🍌', 'banana'], ['🐻', 'bear'], ['🦋', 'butterfly'], ['🚌', 'bus'], ['🔔', 'bell']],
    f: [['🐟', 'fish'], ['🦊', 'fox'], ['🔥', 'fire'], ['🦶', 'foot'], ['🧚', 'fairy']],
    l: [['🦁', 'lion'], ['🍋', 'lemon'], ['🍃', 'leaf'], ['🍭', 'lollipop'], ['🐞', 'ladybug']],
    w: [['🐳', 'whale'], ['🍉', 'watermelon'], ['🐺', 'wolf'], ['🕸️', 'web']],
    v: [['🎻', 'violin'], ['🌋', 'volcano'], ['🚐', 'van']],
    y: [['🪀', 'yo-yo'], ['🧶', 'yarn']]
  };
  const ORDER = ['s', 'a', 't', 'p', 'n', 'm', 'd', 'g', 'o', 'c', 'e', 'u', 'r', 'h', 'b', 'f', 'l', 'w', 'v', 'y'];
  const START = 4;
  // look-alike letters for the big/little level
  const LOOKALIKE = { b: ['d', 'p'], d: ['b', 'p'], p: ['b', 'd'], m: ['n', 'w'], n: ['m', 'h'], w: ['m', 'v'], h: ['n', 'b'], u: ['n', 'v'], v: ['w', 'y'], a: ['o', 'e'], o: ['a', 'c'], e: ['c', 'a'], c: ['o', 'e'], f: ['t', 'l'], t: ['f', 'l'], l: ['t', 'f'], g: ['p', 'y'], y: ['g', 'v'], r: ['n', 'h'], s: ['c', 'e'] };
  // little words (consonant-vowel-consonant) with pictures
  const WORDS = [['🐱', 'cat'], ['🎩', 'hat'], ['🦇', 'bat'], ['🐀', 'rat'], ['🗺️', 'map'], ['🧢', 'cap'], ['🚐', 'van'],
    ['👜', 'bag'], ['🍳', 'pan'], ['🐶', 'dog'], ['🪵', 'log'], ['🐔', 'hen'], ['🛏️', 'bed'], ['🕸️', 'web'], ['🖊️', 'pen'],
    ['🥅', 'net'], ['🔟', 'ten'], ['🚌', 'bus'], ['☀️', 'sun'], ['🥤', 'cup'], ['🐛', 'bug'], ['🐷', 'pig']];
  PA.sounds = { ORDER, L };

  function unlocked() {
    const g = PA.store.game('sounds');
    let n = g.extra.unlocked || START;
    const solid = ORDER.slice(0, n).every(ch => {
      const r = g.items['ltr:' + ch]; return r && r[0] >= 3 && PA.store.itemScore('sounds', 'ltr:' + ch) >= 0.75;
    });
    if (solid && n < ORDER.length) { n++; g.extra.unlocked = n; g.extra.newest = ORDER[n - 1]; PA.store.save(); }
    return n;
  }
  PA.sounds.unlocked = () => PA.store.game('sounds').extra.unlocked || START;

  function distractorLetters(target, n, pool) {
    const others = U.shuffle(pool.filter(x => x !== target));
    const extra = U.shuffle(ORDER.filter(x => x !== target && pool.indexOf(x) < 0));
    return others.concat(extra).slice(0, n);
  }
  const pic = ([e, w]) => ({ html: `<span class="emoji">${e}</span>`, aria: w });
  const spell = w => w.split('').join(', ');
  // words that differ from w in one place make the best "tricky" choices
  function nearWords(w, n) {
    const score = x => x[1].split('').filter((c, i) => c === w[i]).length;
    const others = U.shuffle(WORDS.filter(x => x[1] !== w)).sort((a, b) => score(b) - score(a));
    return others.slice(0, n);
  }

  function letterLevel(api, i, lvl) {
    const n = unlocked();
    const pool = ORDER.slice(0, n);
    const g = PA.store.game('sounds');
    const ch = (g.extra.newest && pool.indexOf(g.extra.newest) >= 0 && i % 3 === 0) ? g.extra.newest
      : PA.store.pick('sounds', pool, 1, x => 'ltr:' + x)[0];
    const key = 'ltr:' + ch, up = ch.toUpperCase();
    const words = U.shuffle(L[ch]);

    if (lvl === 4) {
      const look = (LOOKALIKE[ch] || []).slice();
      const opts = U.shuffle([ch].concat(look.concat(distractorLetters(ch, 2, pool)).filter((x, k, a) => x !== ch && a.indexOf(x) === k).slice(0, 2)));
      return {
        key: 'case:' + ch,
        prompt: `This is big ${up}. Find little ${ch}.`,
        build(stage) { stage.appendChild(U.tag(U.el('div', 'card prompt-card letter', up), ch)); },
        choices: opts.map(x => ({ html: x, cls: 'letter', correct: x === ch, aria: 'letter ' + x })),
        retry: `Big ${up}. Find little ${ch}, like in ${words[0][1]}.`,
        hint: `This is little ${ch}. Big ${up}, little ${ch}. Tap it.`,
        praise: U.pick([`Yes! Big ${up} and little ${ch}!`, `You found little ${ch}!`])
      };
    }
    if (lvl === 3) {
      const target = words[0];
      const opts = U.shuffle([ch].concat(distractorLetters(ch, 2, pool)));
      return {
        key,
        prompt: `${target[1]}. Which letter does ${target[1]} start with?`,
        build(stage) { stage.appendChild(U.tag(U.el('div', 'card prompt-card', `<span class="emoji">${target[0]}</span>`), target[1])); },
        choices: opts.map(x => ({ html: x, cls: 'letter', correct: x === ch, aria: 'letter ' + x })),
        retry: `Listen: ${target[1]}.`,
        hint: `${target[1]} starts with ${up}. Tap ${up}.`,
        praise: U.pick([`Yes! ${target[1]} starts with ${up}!`, `You heard it! ${up} for ${target[1]}!`])
      };
    }
    const keyWord = words[0], answer = words[1] || words[0];
    const others = distractorLetters(ch, 2, pool).map(x => U.pick(L[x]));
    const opts = U.shuffle([answer].concat(others));
    const names = opts.map(o => o[1]);
    if (lvl === 1) {
      return {
        key,
        prompt: `${keyWord[1]}. Which one starts with the same sound as ${keyWord[1]}? ${U.listWords(names)}?`,
        build(stage) { stage.appendChild(U.tag(U.el('div', 'card prompt-card', `<span class="emoji">${keyWord[0]}</span>`), keyWord[1])); },
        choices: opts.map(o => Object.assign(pic(o), { correct: o === answer })),
        retry: `Listen: ${keyWord[1]}... ${U.listWords(names)}.`,
        hint: `${keyWord[1]}... ${answer[1]}. They start the same way! Tap the ${answer[1]}.`,
        praise: U.pick([`Yes! ${keyWord[1]} and ${answer[1]} start the same!`, `You heard it! ${keyWord[1]}, ${answer[1]}!`])
      };
    }
    return {
      key,
      prompt: `This is the letter ${up}, like in ${keyWord[1]}. Which picture starts with ${up}? ${U.listWords(names)}?`,
      build(stage) {
        stage.appendChild(U.tag(U.el('div', 'card prompt-card letter', `${up}${ch}`), ch));
        stage.appendChild(U.tag(U.el('div', 'card prompt-card', `<span class="emoji" style="font-size:4.4rem">${keyWord[0]}</span><span class="lbl">${keyWord[1]}</span>`), keyWord[1]));
      },
      choices: opts.map(o => Object.assign(pic(o), { correct: o === answer })),
      retry: `${up}, like in ${keyWord[1]}. ${U.listWords(names)}.`,
      hint: `${answer[1]} starts with ${up}, just like ${keyWord[1]}. Tap the ${answer[1]}.`,
      praise: U.pick([`Yes! ${answer[1]} starts with ${up}!`, `${up} for ${answer[1]}! Great listening!`])
    };
  }

  function wordLevel(api, i, lvl) {
    const item = PA.store.pick('sounds', WORDS, 1, x => 'word:' + x[1])[0];
    const [e, w] = item;
    const key = 'word:' + w;
    if (lvl === 5) {
      const opts = U.shuffle([item].concat(nearWords(w, 2)));
      return {
        key,
        prompt: `Which word says ${w}?`,
        build(stage) { stage.appendChild(U.tag(U.el('div', 'card prompt-card', `<span class="emoji">${e}</span>`), w)); },
        choices: opts.map(o => ({ html: o[1], cls: 'word', correct: o === item, aria: o[1] })),
        retry: `Look at the first letter. ${w}.`,
        hint: `${spell(w)}. That spells ${w}! Tap it.`,
        praise: U.pick([`Yes! ${spell(w)}, ${w}!`, `You read it! ${w}!`])
      };
    }
    if (lvl === 7) {
      const opts = U.shuffle([item].concat(nearWords(w, 2)));
      return {
        key: 'read:' + w,
        prompt: 'Read the word. Which picture is it?',
        build(stage) { stage.appendChild(U.tag(U.el('div', 'card prompt-card word', w), w)); },
        choices: opts.map(o => ({ html: `<span class="emoji">${o[0]}</span>`, correct: o === item, aria: o[1] })),
        retry: `Say each letter's sound, then push them together.`,
        hint: `${spell(w)}... ${w}! Tap the ${w}.`,
        praise: U.pick([`Yes! That says ${w}! You read it all by yourself!`, `${w}! Wonderful reading!`])
      };
    }
    // level 6: spell it
    return {
      key: 'spell:' + w,
      run: api => new Promise(resolve => {
        const letters = w.split('');
        const extra = U.shuffle(ORDER.filter(x => letters.indexOf(x) < 0)).slice(0, 2);
        const tiles = U.shuffle(letters.concat(extra));
        api.stage.style.flexDirection = 'column';
        const top = U.el('div', 'row');
        top.appendChild(U.tag(U.el('div', 'card prompt-card', `<span class="emoji" style="font-size:5rem">${e}</span>`), w));
        const slots = U.el('div', 'slots');
        const slotEls = letters.map(() => { const s = U.el('div', 'slot'); slots.appendChild(s); return s; });
        top.appendChild(slots);
        const row = U.el('div', 'tiles-row');
        api.stage.append(top, row);
        let at = 0, misses = 0;
        const prompt = `Spell ${w}. Tap the letters in order: ${w}.`;
        api.prompt(prompt);
        const tileEls = tiles.map(ch => {
          const b = U.el('button', 'card choice ltile', ch);
          b.onclick = async () => {
            if (!api.alive || at >= letters.length || b.classList.contains('used')) return;
            if (ch === letters[at]) {
              b.classList.add('used'); slotEls[at].textContent = ch; slotEls[at].classList.add('filled');
              slotEls.forEach(s => s.classList.remove('next'));
              PA.audio.sfx('step'); at++;
              if (at === letters.length) {
                PA.audio.sfx('right'); api.cheer();
                await api.say(U.pick([`${spell(w)}. ${w}! You spelled it!`, `Yes! ${spell(w)} spells ${w}!`]));
                resolve(misses === 0);
              } else api.say(ch);
            } else {
              misses++; PA.audio.sfx('wrong');
              b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
              setTimeout(() => b.classList.remove('wrong'), 600);
              if (misses >= 2) {
                slotEls[at].classList.add('next');
                tileEls.forEach(t => { if (!t.classList.contains('used') && t.textContent === letters[at]) t.classList.add('hint'); });
                api.say(`${w}. The next letter is ${letters[at]}. Tap ${letters[at]}.`);
              } else api.say(`Listen: ${w}. ${at === 0 ? 'What sound comes first?' : 'What comes next?'}`);
            }
          };
          row.appendChild(b);
          return b;
        });
      })
    };
  }

  PA.games.push({
    id: 'sounds', name: 'Letters', icon: '🔤', color: '#ffd6ea', maxLevel: 7,
    skill: 'First sounds, letters, then reading and spelling little words',
    research: 'Phonemic awareness and letter-sound knowledge are the strongest early predictors of reading (National Early Literacy Panel). Letters come in a systematic-phonics order a few at a time, then blend into little words to read and spell (National Reading Panel; Ehri).',
    levels: ['Same first sound (listening)', 'Letter to picture', 'Picture to letter', 'Big and little letters', 'Which word says it?', 'Spell the word', 'Read it yourself'],
    tryAtHome: [
      'Play "I spy something that starts with sss..." around the house, saying the sound, not the letter name.',
      'Point out the first letter of her name on signs and boxes.',
      'Say the sound a letter makes (s says "sss"), not just its name, when you read together.',
      'Write a little word like "cat" on paper and help her say each sound, then push them together.'
    ],
    intro: lvl => ['Let\'s listen for first sounds!', 'Let\'s play with letters!', 'Let\'s find the letters!', 'Let\'s match big and little letters!',
      'Let\'s find words!', 'Let\'s spell words!', 'Let\'s read words all by ourselves!'][lvl - 1],
    next(api, i, lvl) { return lvl <= 4 ? letterLevel(api, i, lvl) : wordLevel(api, i, lvl); }
  });
})();

</script>
<script>/* js/games/rhyme.js */
'use strict';
// RHYMES & CLAPS: phonological awareness, the "hearing the sounds in words" skill that comes before phonics.
// Rhyme awareness predicts later reading (Bradley & Bryant, 1983), and children usually manage rhymes and
// syllables (word parts) before single sounds (Anthony & Lonigan's developmental sequence).
//   1 which one rhymes? (2 pictures)       2 which one rhymes? (3 pictures)
//   3 drum the syllables: 1-2 beat words    4 which one does NOT rhyme?
//   5 drum the syllables: up to 4 beats     6 rhyme memory: find the rhyming pairs (6 cards)
//   7 rhyme memory with 8 cards
window.PA = window.PA || {};
PA.games = PA.games || [];
(function () {
  const U = PA.ui;
  const PAIRS = [
    [['🐱', 'cat'], ['🎩', 'hat']], [['🐝', 'bee'], ['🔑', 'key']], [['🎂', 'cake'], ['🐍', 'snake']],
    [['🌙', 'moon'], ['🥄', 'spoon']], [['⭐', 'star'], ['🚗', 'car']], [['🐭', 'mouse'], ['🏠', 'house']],
    [['🐻', 'bear'], ['🍐', 'pear']], [['🐐', 'goat'], ['⛵', 'boat']], [['🦊', 'fox'], ['📦', 'box']],
    [['👑', 'crown'], ['🤡', 'clown']], [['🧦', 'sock'], ['⏰', 'clock']], [['🐶', 'dog'], ['🐸', 'frog']],
    [['🔔', 'bell'], ['🐚', 'shell']], [['🌹', 'rose'], ['👃', 'nose']], [['👔', 'tie'], ['🥧', 'pie']],
    [['🦴', 'bone'], ['📱', 'phone']], [['🪁', 'kite'], ['💡', 'light']], [['🛏️', 'bed'], ['🍞', 'bread']]
  ];
  // word parts, spelled so the voice says them clearly one at a time
  const BEATS = [
    ['☀️', 'sun', ['sun']], ['🐱', 'cat', ['cat']], ['🐸', 'frog', ['frog']], ['👑', 'crown', ['crown']], ['🐝', 'bee', ['bee']], ['⭐', 'star', ['star']],
    ['🍎', 'apple', ['ap', 'pull']], ['🐰', 'rabbit', ['rab', 'bit']], ['🍕', 'pizza', ['peet', 'za']], ['🐵', 'monkey', ['mun', 'key']],
    ['🌈', 'rainbow', ['rain', 'bow']], ['🧁', 'cupcake', ['cup', 'cake']], ['👸', 'princess', ['prin', 'sess']], ['🐼', 'panda', ['pan', 'da']],
    ['🦋', 'butterfly', ['butt', 'er', 'fly']], ['🍌', 'banana', ['ba', 'na', 'na']], ['🦕', 'dinosaur', ['dye', 'no', 'sore']],
    ['🦄', 'unicorn', ['you', 'nee', 'corn']], ['🐙', 'octopus', ['ock', 'toe', 'puss']], ['🍓', 'strawberry', ['straw', 'bear', 'ee']],
    ['🍉', 'watermelon', ['wah', 'ter', 'mel', 'on']], ['🐛', 'caterpillar', ['cat', 'er', 'pill', 'ar']], ['🐊', 'alligator', ['al', 'lee', 'gay', 'tor']]
  ];

  function pickQ(lvl) {
    const idx = PAIRS.map((_, i) => i);
    const pi = PA.store.pick('rhyme', idx, 1, i => 'pair:' + i)[0];
    const flip = Math.random() < 0.5;
    const pair = PAIRS[pi];
    const target = flip ? pair[1] : pair[0], answer = flip ? pair[0] : pair[1];
    const nOpts = lvl + 1;
    const others = U.shuffle(idx.filter(i => i !== pi)).slice(0, nOpts - 1).map(i => U.pick(PAIRS[i]));
    const opts = U.shuffle([answer].concat(others));
    const names = opts.map(o => o[1]);
    return {
      key: 'pair:' + pi,
      prompt: `${target[1]}. Which one rhymes with ${target[1]}? ${U.listWords(names)}?`,
      build(stage) { stage.appendChild(U.tag(U.el('div', 'card prompt-card', `<span class="emoji">${target[0]}</span>`), target[1])); },
      choices: opts.map(o => ({ html: `<span class="emoji">${o[0]}</span>`, correct: o === answer, aria: o[1] })),
      retry: `Listen: ${target[1]}... ${U.listWords(names)}.`,
      hint: `${target[1]}... ${answer[1]}. They sound the same at the end! Tap the ${answer[1]}.`,
      praise: U.pick([`Yes! ${target[1]}, ${answer[1]}! They rhyme!`, `${target[1]} and ${answer[1]}! Great rhyming!`])
    };
  }

  function oddQ(n) {
    const idx = PAIRS.map((_, i) => i);
    const pi = PA.store.pick('rhyme', idx, 1, i => 'odd:' + i)[0];
    const pair = PAIRS[pi];
    const odd = U.pick(PAIRS[U.pick(idx.filter(i => i !== pi))]);
    const opts = U.shuffle(pair.concat([odd]));
    const names = opts.map(o => o[1]);
    return {
      key: 'odd:' + pi,
      prompt: `Which one does NOT rhyme? ${U.listWords(names)}?`,
      choices: opts.map(o => ({ html: `<span class="emoji">${o[0]}</span>`, correct: o === odd, aria: o[1] })),
      retry: `Listen to the ends: ${U.listWords(names)}.`,
      hint: `${pair[0][1]} and ${pair[1][1]} rhyme. ${odd[1]} doesn't! Tap the ${odd[1]}.`,
      praise: `Yes! ${pair[0][1]} and ${pair[1][1]} rhyme, and ${odd[1]} is the odd one out!`
    };
  }

  function beatsQ(maxBeats) {
    const pool = BEATS.filter(b => b[2].length <= maxBeats);
    const item = PA.store.pick('rhyme', pool, 1, b => 'beat:' + b[1])[0];
    const [e, w, parts] = item;
    const n = parts.length;
    return {
      key: 'beat:' + w,
      run: api => new Promise(resolve => {
        api.stage.style.flexDirection = 'column';
        api.stage.appendChild(U.tag(U.el('div', 'card prompt-card', `<span class="emoji">${e}</span>`), w));
        const dots = U.el('div', 'clap-dots');
        api.stage.appendChild(dots);
        const drum = U.el('button', 'card drum emoji', '🥁');
        const reset = U.el('button', 'btn white small', '<span class="emoji">🔄</span>');
        const done = U.el('button', 'btn mint', '<span class="emoji">✅</span> Done');
        api.choices.style.alignItems = 'center';
        api.choices.append(reset, drum, done);
        let taps = 0, misses = 0, busy = false;
        drum.onclick = () => {
          if (busy) return;
          taps++; dots.appendChild(U.el('span'));
          U.go(done, true);
          PA.audio.sfx('drum');
          drum.classList.remove('hit'); void drum.offsetWidth; drum.classList.add('hit');
          setTimeout(() => drum.classList.remove('hit'), 120);
        };
        const clear = () => { taps = 0; dots.innerHTML = ''; U.go(done, false); };
        reset.onclick = () => { if (!busy) { PA.audio.sfx('tap'); clear(); } };
        api.prompt(`${w}! Tap the drum once for each part of the word: ${w}. Then tap done.`);
        done.onclick = async () => {
          if (busy) return;
          if (taps === n) {
            busy = true; U.go(done, false); PA.audio.sfx('right'); api.cheer();
            await api.say(`Yes! ${w} has ${U.NUM_WORDS[n]} ${n === 1 ? 'part' : 'parts'}!`);
            return resolve(misses === 0);
          }
          misses++; PA.audio.sfx('wrong');
          busy = true; clear();
          if (misses < 2) {
            await api.say(`Let's listen again: ${w}. Tap once for each part.`);
            busy = false;
          } else {
            await api.say(`Let's drum it together.`);
            for (const p of parts) {
              if (!api.alive) return;
              dots.appendChild(U.el('span')); PA.audio.sfx('drum');
              drum.classList.add('hit');
              await api.say(p);
              drum.classList.remove('hit');
              await U.wait(150);
            }
            await api.say(`${w} has ${U.NUM_WORDS[n]} ${n === 1 ? 'part' : 'parts'}!`);
            resolve(false);
          }
        };
      })
    };
  }

  function memoryQ(pairsN) {
    return {
      key: 'memory:' + pairsN,
      size: pairsN === 3 ? 3 : 4,
      run: api => new Promise(resolve => {
        const chosen = U.shuffle(PAIRS.map((_, i) => i)).slice(0, pairsN);
        const cards = U.shuffle([].concat.apply([], chosen.map(pi => [[PAIRS[pi][0], pi], [PAIRS[pi][1], pi]])));
        const grid = U.el('div', 'memory');
        grid.style.setProperty('--cols', pairsN === 3 ? 3 : 4);
        grid.style.setProperty('--pcols', pairsN === 3 ? 3 : 4);
        api.stage.appendChild(grid);
        let open = [], found = 0, misses = 0, busy = false;
        cards.forEach(([item, pi]) => {
          const c = U.el('button', 'mcard', '<span class="back emoji">👑</span>');
          c.onclick = async () => {
            if (busy || !api.alive || c.classList.contains('up')) return;
            c.classList.add('up'); c.innerHTML = `<span class="emoji">${item[0]}</span>`;
            PA.audio.sfx('tap');
            open.push([c, item, pi]);
            if (open.length < 2) { api.say(item[1]); return; }
            busy = true;
            const [a, b] = open; open = [];
            if (a[2] === b[2]) {
              a[0].classList.add('matched'); b[0].classList.add('matched');
              PA.audio.sfx('right'); found++;
              await api.say(`${a[1][1]}, ${b[1][1]}. They rhyme!`);
              busy = false;
              if (found === pairsN) {
                api.cheer(); PA.audio.sfx('sparkle');
                await api.say('You found all the rhyming pairs!');
                resolve(misses <= pairsN + 1);
              }
            } else {
              misses++;
              await api.say(`${a[1][1]}... ${b[1][1]}. Those don't rhyme.`);
              await U.wait(400);
              [a[0], b[0]].forEach(x => { x.classList.remove('up'); x.innerHTML = '<span class="back emoji">👑</span>'; });
              busy = false;
            }
          };
          grid.appendChild(c);
        });
        api.prompt('Find the rhyming pairs! Tap two cards. If they rhyme, they stay up.');
      })
    };
  }

  PA.games.push({
    id: 'rhyme', name: 'Rhyme Time', icon: '🎵', color: '#d6f3ff', maxLevel: 7,
    skill: 'Hearing rhymes and word parts (syllables)',
    research: 'Rhyme and syllable awareness are the early steps of phonological awareness, which predicts later reading (Bradley & Bryant; Anthony & Lonigan). Drumming each word part makes it physical, and the memory game adds working memory.',
    levels: ['Rhymes: pick from 2', 'Rhymes: pick from 3', 'Drum the parts (1-2)', 'Which does NOT rhyme?', 'Drum the parts (1-4)', 'Rhyme memory (6 cards)', 'Rhyme memory (8 cards)'],
    tryAtHome: [
      'Read rhyming books and pause before the rhyming word so she can fill it in.',
      'Make up silly rhymes in the car: cat, hat, bat... zat!',
      'Clap the parts of family names together: Ma-ry, Grand-ma, Pen-el-o-pe.'
    ],
    intro: lvl => ({ 3: 'Let\'s drum the parts of words!', 5: 'Let\'s drum some long words!', 6: 'Let\'s play rhyme memory!', 7: 'Let\'s play a bigger rhyme memory!' }[lvl]
      || 'Let\'s find words that rhyme! Rhyming words sound the same at the end.'),
    next(api, i, lvl) {
      switch (lvl) {
        case 1: return pickQ(1);
        case 2: return pickQ(2);
        case 3: return beatsQ(2);
        case 4: return oddQ(3);
        case 5: return beatsQ(4);
        case 6: return memoryQ(3);
        default: return memoryQ(4);
      }
    }
  });
})();

</script>
<script>/* js/games/pattern.js */
'use strict';
// MAGIC PATTERNS: finish and build the princess's necklaces. Repeating-pattern skill in preschool predicts later
// maths (Rittle-Johnson et al., 2017). The strongest pattern tasks ask children to make the same pattern with
// different things ("abstracting" the pattern), which shows they've found the rule, not just matched colours.
// Saying the pattern aloud helps find the part that repeats, so prompts read it out.
//   1 AB   2 AAB / ABB   3 ABC   4 AABB, or a gap in the middle
//   5 copy the pattern with new beads (abstraction)   6 growing patterns: 1, 2, 3... what comes next?
window.PA = window.PA || {};
PA.games = PA.games || [];
(function () {
  const U = PA.ui;
  const BEADS = [
    ['❤️', 'red heart'], ['💙', 'blue heart'], ['⭐', 'star'], ['🌸', 'flower'], ['🐚', 'shell'],
    ['🦋', 'butterfly'], ['🍓', 'strawberry'], ['💎', 'gem'], ['🌙', 'moon'], ['💛', 'yellow heart']
  ];
  const UNITS = { 1: ['AB'], 2: ['AAB', 'ABB'], 3: ['ABC'], 4: ['AABB', 'ABC-mid', 'AAB-mid'] };
  const say = seq => seq.map(b => b[1]).join(', ');

  function extendQ(lvl) {
    const type = U.pick(UNITS[lvl]);
    const unit = type.split('-')[0];
    const mid = type.indexOf('-mid') > 0;
    const letters = Array.from(new Set(unit.split('')));
    const chosen = U.shuffle(BEADS).slice(0, letters.length + 1);
    const map = {}; letters.forEach((l, i) => { map[l] = chosen[i]; });
    const spare = chosen[letters.length];
    const reps = unit.length === 4 ? 2 : 3;
    const seq = []; for (let r = 0; r < reps; r++) for (const l of unit) seq.push(map[l]);
    let blank = seq.length - 1;
    if (mid) blank = unit.length + U.rand(0, unit.length - 1);
    const answer = seq[blank];
    const others = Array.from(new Set(letters.map(l => map[l]).concat([spare]))).filter(b => b !== answer);
    const opts = [answer].concat(U.shuffle(others).slice(0, 2));
    const spoken = seq.map((b, i) => i === blank ? 'hmmm' : b[1]);
    let blankEl;
    return {
      key: 'pat:' + type,
      prompt: mid ? `${spoken.join(', ')}. What goes in the empty spot?` : `${spoken.slice(0, -1).join(', ')}... What comes next?`,
      build(stage) {
        const neck = U.el('div', 'card necklace');
        // each bead lights up in turn as the voice reads the necklace (the gap lights on "hmmm")
        seq.forEach((b, i) => {
          const d = U.el('div', i === blank ? 'bead blank' : 'bead emoji', i === blank ? '?' : b[0]);
          if (i === blank) blankEl = d;
          neck.appendChild(d);
        });
        const tagNeck = () => Array.prototype.forEach.call(neck.children, (d, i) => U.tag(d, d === blankEl && !blankEl.classList.contains('filled') ? 'hmmm' : seq[i][1], true));
        tagNeck();
        neck._retag = tagNeck;
        stage.appendChild(neck);
      },
      choices: U.shuffle(opts).map(o => ({ html: `<span class="emoji">${o[0]}</span>`, correct: o === answer, aria: o[1] })),
      flashChoices: false,
      retry: 'Say it with me: ' + spoken.join(', ') + '.',
      hint: `Let's say it together: ${say(seq)}. It's the ${answer[1]}! Tap it.`,
      onHint() { if (blankEl) U.tag(blankEl, answer[1], true); },
      onRight() { if (blankEl) { blankEl.className = 'bead emoji filled'; blankEl.textContent = answer[0]; U.tag(blankEl, answer[1], true); } },
      praise: U.pick(['You found the pattern! ', 'Yes! ', 'Beautiful necklace! ']) + say(seq) + '!'
    };
  }

  // 5: build the same pattern with different beads
  function copyQ() {
    const unit = U.pick(['AB', 'AAB', 'ABB', 'ABC']);
    const letters = Array.from(new Set(unit.split('')));
    const picks = U.shuffle(BEADS);
    const model = {}, mine = [];
    letters.forEach((l, i) => { model[l] = picks[i]; });
    for (let i = 0; i < letters.length; i++) mine.push(picks[letters.length + i]);
    const len = unit.length === 2 ? 6 : unit.length * 2;
    const seqL = []; while (seqL.length < len) seqL.push(unit[seqL.length % unit.length]);
    return {
      key: 'copy:' + unit,
      size: 2,
      run: api => new Promise(resolve => {
        api.stage.style.flexDirection = 'column';
        const top = U.el('div', 'card necklace');
        seqL.forEach(l => top.appendChild(U.tag(U.el('div', 'bead emoji', model[l][0]), model[l][1], true)));
        const mineRow = U.el('div', 'card necklace');
        const slots = seqL.map(() => { const d = U.el('div', 'bead blank', ''); mineRow.appendChild(d); return d; });
        const pal = U.el('div', 'palette');
        api.stage.append(top, mineRow);
        const reset = U.el('button', 'btn white small', '<span class="emoji">🔄</span>');
        api.choices.style.alignItems = 'center';
        api.choices.append(pal, reset);
        let filled = [], misses = 0;
        const mark = () => slots.forEach((s, i) => s.classList.toggle('next', i === filled.length));
        mark();
        const clear = () => { filled = []; slots.forEach(s => { s.className = 'bead blank'; s.textContent = ''; }); mark(); };
        reset.onclick = () => { PA.audio.sfx('tap'); clear(); };
        const check = async () => {
          // same pattern = same letters map to the same bead, different letters to different beads
          const map = {}, used = {};
          let ok = true;
          seqL.forEach((l, i) => {
            const b = filled[i][1];
            if (map[l] === undefined) { if (used[b]) ok = false; map[l] = b; used[b] = true; } else if (map[l] !== b) ok = false;
          });
          if (ok) {
            PA.audio.sfx('right'); api.cheer();
            await api.say(`Same pattern! ${filled.map(b => b[1]).join(', ')}! You made the pattern with new beads!`);
            return resolve(misses === 0);
          }
          misses++; PA.audio.sfx('wrong');
          if (misses < 2) {
            await api.say(`Hmm, look at the princess's necklace again: ${seqL.map(l => model[l][1]).join(', ')}. Make yours the same way, with your beads.`);
            clear();
          } else {
            await api.say('Let\'s do it together.');
            clear();
            for (let i = 0; i < len && api.alive; i++) {
              const b = mine[letters.indexOf(seqL[i])];
              filled.push(b); slots[i].className = 'bead emoji filled'; slots[i].textContent = b[0];
              U.tag(slots[i], b[1], true);
              PA.audio.sfx('step');
              await api.say(b[1]);
            }
            mark();
            resolve(false);
          }
        };
        mine.forEach(b => {
          const btn = U.el('button', 'bead emoji', b[0]);
          btn.setAttribute('aria-label', b[1]);
          btn.onclick = () => {
            if (filled.length >= len) return;
            const s = slots[filled.length];
            filled.push(b); s.className = 'bead emoji filled'; s.textContent = b[0];
            PA.audio.sfx('step'); mark();
            if (filled.length === len) check();
          };
          pal.appendChild(btn);
        });
        api.prompt(`Look at the princess's necklace: ${seqL.map(l => model[l][1]).join(', ')}. Make the same pattern with your new beads!`);
      })
    };
  }

  // 6: growing pattern
  function growQ() {
    const step = Math.random() < 0.7 ? 1 : 2;
    const start = U.rand(1, 2);
    const b = U.pick(BEADS);
    const terms = [start, start + step, start + 2 * step];
    const ans = start + 3 * step;
    const grp = n => { let h = ''; for (let i = 0; i < n; i++) h += b[0]; return `<div class="group emoji">${h}</div>`; };
    const opts = U.shuffle(Array.from(new Set([ans, ans - 1, ans + 1, ans + step]))).slice(0, 3);
    if (opts.indexOf(ans) < 0) opts[0] = ans;
    const W = U.NUM_WORDS;
    return {
      key: 'grow:' + step,
      prompt: `This pattern grows! ${terms.map(n => W[n]).join(', ')}... What comes next?`,
      build(stage) {
        terms.forEach(n => stage.appendChild(U.tag(U.el('div', 'card group-card', grp(n)), W[n], true)));
        stage.appendChild(U.el('div', 'card group-card bead blank', '?'));
      },
      choices: opts.sort((x, y) => x - y).map(n => ({ html: grp(n), cls: 'wide', correct: n === ans, aria: n + ' ' + b[1] })),
      retry: `Count each group: ${terms.map(n => W[n]).join(', ')}.`,
      hint: `It grows by ${W[step]} each time: ${terms.map(n => W[n]).join(', ')}, ${W[ans]}! Tap ${W[ans]}.`,
      praise: `Yes! ${terms.map(n => W[n]).join(', ')}, ${W[ans]}! It grows by ${W[step]}!`
    };
  }

  PA.games.push({
    id: 'pattern', name: 'Magic Patterns', icon: '📿', color: '#ffe9d6', maxLevel: 6,
    skill: 'Repeating and growing patterns (early algebra)',
    research: 'Spotting, extending and re-making patterns with different objects predicts later maths (Rittle-Johnson et al.). Saying the pattern aloud helps children find the part that repeats; growing patterns connect patterns to counting.',
    levels: ['AB patterns', 'AAB / ABB', 'ABC', 'AABB and gaps in the middle', 'Make it with new beads', 'Growing patterns'],
    tryAtHome: [
      'Make a pattern with spoons and forks, then ask her to make the same pattern with socks.',
      'Clap-clap-stomp! Make sound patterns and take turns copying.',
      'Thread pasta or beads into a pattern necklace.'
    ],
    intro: lvl => lvl === 5 ? 'Let\'s make necklaces just like the princess\'s!' : lvl === 6 ? 'Some patterns grow! Let\'s look.' : 'Let\'s make magic necklaces! Find what comes next.',
    next(api, i, lvl) { return lvl <= 4 ? extendQ(lvl) : lvl === 5 ? copyQ() : growQ(); }
  });
})();

</script>
<script>/* js/games/shapes.js */
'use strict';
// SHAPES: Clements & Sarama's research shows children build narrow shape ideas ("a triangle points up") when they
// only see textbook examples. So targets come in many sizes and turns, near-misses get feedback that names the
// rule ("triangles have three straight sides"), and later levels count corners and build pictures from shapes
// (the shape-composition trajectory in Building Blocks).
//   1 hunt: standard shapes        2 hunt: turned and stretched shapes     3 hunt: with near-misses
//   4 count the corners (tap each corner)   5 build a picture from shapes   6 hunt: pentagons and hexagons too
window.PA = window.PA || {};
PA.games = PA.games || [];
(function () {
  const U = PA.ui;
  const W = U.NUM_WORDS;
  const COLORS = ['#ff8fc8', '#a77bff', '#5fb8ff', '#ffcc33', '#41cf9b', '#ff8a5c'];
  const RULE = {
    triangle: 'Triangles have three straight sides and three corners.',
    square: 'Squares have four straight sides, all the same length, and square corners.',
    rectangle: 'Rectangles have four straight sides and square corners. Two sides are long and two are short.',
    circle: 'Circles are perfectly round, with no corners.',
    pentagon: 'Pentagons have five straight sides and five corners.',
    hexagon: 'Hexagons have six straight sides and six corners.'
  };
  const PLURAL = { triangle: 'triangles', square: 'squares', rectangle: 'rectangles', circle: 'circles', pentagon: 'pentagons', hexagon: 'hexagons' };

  const pts = p => p.map(q => q.map(v => +v.toFixed(1)).join(',')).join(' ');
  const poly = p => `<polygon points="${pts(p)}"/>`;
  const regular = (n, r, rot) => Array.from({ length: n }, (_, i) => {
    const a = (rot || -90) * Math.PI / 180 + i * 2 * Math.PI / n;
    return [50 + r * Math.cos(a), 50 + r * Math.sin(a)];
  });
  const TRI = [[[50, 12], [90, 80], [10, 80]], [[15, 15], [15, 85], [85, 85]], [[10, 75], [90, 85], [35, 15]], [[50, 4], [64, 96], [36, 96]], [[4, 68], [96, 68], [30, 36]]];
  const SHAPES = {
    triangle: () => poly(U.pick(TRI)),
    square: () => { const h = U.rand(22, 38); return `<rect x="${50 - h}" y="${50 - h}" width="${2 * h}" height="${2 * h}"/>`; },
    rectangle: () => { const w = U.rand(80, 96), h = U.rand(28, 46); return `<rect x="${50 - w / 2}" y="${50 - h / 2}" width="${w}" height="${h}"/>`; },
    circle: () => `<circle cx="50" cy="50" r="${U.rand(26, 44)}"/>`,
    pentagon: () => poly(regular(5, 44)),
    hexagon: () => poly(regular(6, 44, 0)),
    oval: () => '<ellipse cx="50" cy="50" rx="46" ry="24"/>',
    star: () => poly([[50, 5], [61, 38], [96, 38], [68, 59], [79, 93], [50, 72], [21, 93], [32, 59], [4, 38], [39, 38]]),
    heart: () => '<path d="M50 88 C10 62 4 32 27 22 C40 17 48 25 50 33 C52 25 60 17 73 22 C96 32 90 62 50 88 Z"/>',
    diamond: () => poly([[50, 4], [80, 50], [50, 96], [20, 50]]),
    slanted: () => poly([[28, 26], [96, 26], [72, 74], [4, 74]]),
    curvy: () => '<path d="M50 12 L90 76 Q50 104 10 76 Z"/>',
    open: () => '<path d="M44 22 L10 80 L90 80 L56 22" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>',
    heptagon: () => poly(regular(7, 44))
  };
  const NEAR = {
    triangle: [['curvy', 'That one has a curvy side. Triangles have three straight sides.'], ['open', 'That one has a gap. A triangle is closed all the way around.']],
    square: [['diamond', 'That one is squished, its corners aren\'t square corners.'], ['rectangle', 'That one is long. A square\'s sides are all the same length.']],
    rectangle: [['slanted', 'That one leans over. Rectangles have square corners.']],
    circle: [['oval', 'That one is stretched. It\'s an oval. Circles are perfectly round.']],
    pentagon: [['hexagon', 'That one has six sides. It\'s a hexagon. Pentagons have five.']],
    hexagon: [['pentagon', 'That one has five sides. It\'s a pentagon. Hexagons have six.'], ['heptagon', 'Count the sides: that one has seven. Hexagons have six.']]
  };
  const NAME = { triangle: 'triangle', square: 'square', rectangle: 'rectangle', circle: 'circle', oval: 'oval', star: 'star', heart: 'heart', diamond: 'diamond', slanted: 'slanted shape', curvy: 'curvy shape', open: 'open shape', pentagon: 'pentagon', hexagon: 'hexagon', heptagon: 'seven-sided shape' };

  function svgFor(kind, rot, scale) {
    const col = U.pick(COLORS);
    return `<svg viewBox="0 0 100 100"><g transform="rotate(${rot} 50 50) translate(50 50) scale(${scale || 1}) translate(-50 -50)" fill="${col}" stroke="${PA.art.shade(col, -0.25)}" stroke-width="4" stroke-linejoin="round">${SHAPES[kind]()}</g></svg>`;
  }

  // ---------- hunts (1, 2, 3, 6) ----------
  function huntQ(lvl) {
    const kinds = lvl === 6 ? ['triangle', 'square', 'rectangle', 'circle', 'pentagon', 'hexagon'] : ['triangle', 'square', 'rectangle', 'circle'];
    const target = PA.store.pick('shapes', kinds, 1, k => 'shape:' + k)[0];
    return {
      key: 'shape:' + target,
      run: api => new Promise(resolve => {
        const nTargets = lvl === 1 ? 3 : 4;
        const total = lvl === 1 ? 8 : 11;
        const varied = lvl >= 2;
        const items = [];
        for (let i = 0; i < nTargets; i++) items.push({ kind: target, target: true, svg: svgFor(target, varied ? U.pick([0, 15, 30, 45, 90, 135, 180, 210, 300]) : 0, varied ? U.pick([0.7, 0.85, 1]) : 1) });
        const basic = (lvl === 6 ? ['triangle', 'square', 'rectangle', 'circle', 'pentagon', 'hexagon', 'star'] : ['triangle', 'square', 'rectangle', 'circle', 'star', 'heart'])
          .filter(k => k !== target && !(target === 'rectangle' && k === 'square'));
        if (lvl >= 3) NEAR[target].forEach(([k, why]) => items.push({ kind: k, why, svg: svgFor(k, U.pick([0, 20, 90, 160]), 1) }));
        while (items.length < total) { const k = U.pick(basic); items.push({ kind: k, svg: svgFor(k, varied ? U.pick([0, 30, 90]) : 0, 1) }); }

        const field = U.el('div', 'shape-field');
        const portrait = window.innerHeight > window.innerWidth;
        const cols = portrait ? 4 : 6, rows = portrait ? 4 : 3;
        const cells = U.shuffle(Array.from({ length: cols * rows }, (_, i) => i)).slice(0, items.length);
        let found = 0, misses = 0;
        const count = U.el('div', 'found-count', '');
        const showCount = () => { count.innerHTML = `<span class="emoji">⭐</span> ${found} / ${nTargets}`; };
        showCount();
        const nodes = [];
        U.shuffle(items).forEach((it, i) => {
          const c = cells[i];
          const b = U.el('button', 'shp', it.svg);
          b.style.width = (100 / cols) + '%'; b.style.height = (100 / rows) + '%';
          b.style.left = (c % cols) * 100 / cols + '%';
          b.style.top = Math.floor(c / cols) * 100 / rows + '%';
          b.setAttribute('aria-label', NAME[it.kind]);
          nodes.push([b, it]);
          b.onclick = async () => {
            if (!api.alive || b.classList.contains('found')) return;
            if (it.target) {
              b.classList.remove('hint'); b.classList.add('found'); found++; showCount();
              PA.audio.sfx('right');
              if (found === nTargets) {
                api.cheer(); PA.audio.sfx('sparkle');
                await api.say(U.pick([`You found all the ${PLURAL[target]}! Even the tricky ones!`, `All the ${PLURAL[target]}! You looked so carefully!`]));
                resolve(misses === 0);
              } else PA.audio.say(U.pick(['Yes!', 'That\'s one!', 'Good eye!', 'Found it!']));
            } else {
              misses++; PA.audio.sfx('wrong');
              b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope');
              api.say(it.why || `That's a ${NAME[it.kind]}. ${RULE[target]}`);
              if (misses >= 2) nodes.forEach(([n, x]) => { if (x.target && !n.classList.contains('found')) n.classList.add('hint'); });
            }
          };
          field.appendChild(b);
        });
        api.hideGuide();
        api.stage.style.flexDirection = 'column';
        api.stage.style.width = '100%';
        api.stage.append(count, field);
        api.prompt(`Tap all the ${PLURAL[target]}! ${RULE[target]}`);
      })
    };
  }

  // ---------- 4: count the corners ----------
  const CORNER_SHAPES = [
    ['triangle', TRI[0]], ['triangle', TRI[2]], ['triangle', TRI[4]],
    ['square', [[20, 20], [80, 20], [80, 80], [20, 80]]], ['rectangle', [[6, 28], [94, 28], [94, 72], [6, 72]]],
    ['shape', [[15, 20], [85, 30], [75, 85], [20, 70]]], ['pentagon', regular(5, 44)], ['hexagon', regular(6, 44, 0)],
    ['shape', [[50, 8], [92, 40], [75, 92], [22, 85], [8, 40]]], ['shape', [[10, 30], [50, 8], [90, 30], [90, 80], [10, 80]]]
  ];
  function cornersQ() {
    const pick = PA.store.pick('shapes', CORNER_SHAPES.map((_, i) => i), 1, i => 'corners:' + i)[0];
    const [nm, p] = CORNER_SHAPES[pick];
    const n = p.length;
    const col = U.pick(COLORS);
    let dots = [], numberAll;
    const opts = Array.from(new Set([n, n - 1, n + 1, n + 2].filter(x => x >= 3 && x <= 7))).slice(0, 3);
    if (opts.indexOf(n) < 0) opts[0] = n;
    return {
      key: 'corners:' + pick,
      prompt: 'How many corners? Tap each corner to count.',
      build(stage) {
        const box = U.el('div', 'card corner-shape');
        const sv = `<svg viewBox="-8 -8 116 116"><polygon points="${pts(p)}" fill="${col}" stroke="${PA.art.shade(col, -0.25)}" stroke-width="3" stroke-linejoin="round"/>
          ${p.map((q, i) => `<g class="corner" data-i="${i}"><circle cx="${q[0]}" cy="${q[1]}" r="9" fill="#fff" stroke="#8a5cf6" stroke-width="2.5"/><text x="${q[0]}" y="${q[1] + 4}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="sans-serif"></text></g>`).join('')}</svg>`;
        box.innerHTML = sv;
        stage.appendChild(box);
        let k = 0;
        dots = Array.from(box.querySelectorAll('.corner'));
        const mark = (g, num) => { g.querySelector('circle').setAttribute('fill', '#8a5cf6'); g.querySelector('text').textContent = num; g.dataset.done = '1'; U.tag(g, W[num]); };
        dots.forEach(g => g.addEventListener('click', () => {
          if (g.dataset.done) return;
          k++; mark(g, k); PA.audio.sfx('tap'); PA.audio.say(W[k]);
        }));
        numberAll = () => dots.forEach((g, i) => mark(g, i + 1));
      },
      choices: opts.sort((a, b) => a - b).map(x => ({ html: String(x), cls: 'num', correct: x === n, aria: String(x) })),
      onHint: () => numberAll && numberAll(),
      hint: `Let's count the corners: ${U.countAloud(1, n)}. ${W[n]} corners! Tap ${W[n]}.`,
      praise: nm === 'shape' ? `Yes! ${W[n]} corners!` : `Yes! ${W[n]} corners! It's a ${nm}.`
    };
  }

  // ---------- 5: build a picture ----------
  const PICTURES = [
    { name: 'castle', slots: [
      ['rectangle', '<rect x="50" y="80" width="100" height="70"/>'], ['rectangle', '<rect x="15" y="60" width="35" height="90"/>'],
      ['rectangle', '<rect x="150" y="60" width="35" height="90"/>'], ['triangle', '<polygon points="15,60 50,60 32.5,22"/>'],
      ['triangle', '<polygon points="150,60 185,60 167.5,22"/>'], ['triangle', '<polygon points="50,80 150,80 100,42"/>'],
      ['circle', '<circle cx="100" cy="103" r="11"/>'], ['square', '<rect x="87" y="124" width="26" height="26"/>']] },
    { name: 'crown', slots: [
      ['rectangle', '<rect x="30" y="105" width="140" height="35"/>'], ['triangle', '<polygon points="30,105 76,105 53,45"/>'],
      ['triangle', '<polygon points="77,105 123,105 100,28"/>'], ['triangle', '<polygon points="124,105 170,105 147,45"/>'],
      ['circle', '<circle cx="100" cy="122" r="10"/>'], ['square', '<rect x="46" y="114" width="16" height="16"/>'], ['square', '<rect x="138" y="114" width="16" height="16"/>']] },
    { name: 'carriage', slots: [
      ['circle', '<circle cx="100" cy="82" r="44"/>'], ['rectangle', '<rect x="38" y="114" width="124" height="16"/>'],
      ['circle', '<circle cx="62" cy="140" r="17"/>'], ['circle', '<circle cx="138" cy="140" r="17"/>'],
      ['square', '<rect x="85" y="62" width="30" height="30"/>'], ['triangle', '<polygon points="86,40 114,40 100,14"/>']] },
    { name: 'rocket', slots: [
      ['rectangle', '<rect x="80" y="50" width="40" height="80"/>'], ['triangle', '<polygon points="80,50 120,50 100,10"/>'],
      ['triangle', '<polygon points="80,100 80,140 55,140"/>'], ['triangle', '<polygon points="120,100 120,140 145,140"/>'],
      ['circle', '<circle cx="100" cy="75" r="11"/>'], ['square', '<rect x="90" y="130" width="20" height="20"/>']] }
  ];
  const KIND_COL = { rectangle: '#a77bff', triangle: '#ff8fc8', circle: '#ffcc33', square: '#5fb8ff' };
  const ICON = {
    circle: '<circle cx="50" cy="50" r="38"/>', triangle: '<polygon points="50,10 90,85 10,85"/>',
    square: '<rect x="15" y="15" width="70" height="70"/>', rectangle: '<rect x="4" y="28" width="92" height="44"/>'
  };
  const icon = k => `<svg viewBox="0 0 100 100"><g fill="${KIND_COL[k]}" stroke="${PA.art.shade(KIND_COL[k], -0.25)}" stroke-width="4">${ICON[k]}</g></svg>`;

  function buildQ() {
    const pic = PA.store.pick('shapes', PICTURES, 1, p => 'build:' + p.name)[0];
    return {
      key: 'build:' + pic.name,
      size: 3,
      run: api => new Promise(resolve => {
        api.hideGuide();
        const box = U.el('div', 'card build');
        box.innerHTML = `<svg viewBox="0 0 200 160">${pic.slots.map((s, i) => `<g class="slot" data-i="${i}" fill="rgba(255,255,255,.6)" stroke="#b9a6d0" stroke-width="2" stroke-dasharray="5 4">${s[1]}</g>`).join('')}</svg>`;
        api.stage.appendChild(box);
        const slotEls = Array.from(box.querySelectorAll('.slot'));
        let at = 0, misses = 0;
        const show = () => {
          slotEls.forEach((g, i) => {
            if (i === at) { g.setAttribute('stroke', '#ffc93c'); g.setAttribute('stroke-width', '4'); g.setAttribute('stroke-dasharray', ''); g.setAttribute('fill', '#fff7d6'); }
          });
        };
        const ask = () => {
          show();
          const kind = pic.slots[at][0];
          const others = U.shuffle(Object.keys(ICON).filter(k => k !== kind && !(kind === 'rectangle' && k === 'square') && !(kind === 'square' && k === 'rectangle'))).slice(0, 2);
          const opts = U.shuffle([kind].concat(others));
          api.choices.innerHTML = '';
          let tries = 0;
          opts.forEach(k => {
            const b = U.el('button', 'card choice shape-ic', icon(k));
            b.setAttribute('aria-label', k);
            b.onclick = async () => {
              if (!api.alive) return;
              if (k === kind) {
                const g = slotEls[at];
                g.setAttribute('fill', KIND_COL[kind]); g.setAttribute('stroke', PA.art.shade(KIND_COL[kind], -0.25)); g.setAttribute('stroke-width', '2');
                PA.audio.sfx('right');
                at++;
                if (at === pic.slots.length) {
                  api.choices.innerHTML = '';
                  api.cheer(); PA.audio.sfx('fanfare');
                  await api.say(`You built a ${pic.name}! Look at all those shapes!`);
                  return resolve(misses <= 1);
                }
                api.say(U.pick([`A ${kind}!`, `Yes, a ${kind}!`, 'It fits!']));
                ask();
              } else {
                tries++; misses++; PA.audio.sfx('wrong');
                b.classList.add('wrong');
                if (tries >= 2) {
                  Array.from(api.choices.children).forEach(x => { if (x.getAttribute('aria-label') === kind) x.classList.add('hint'); });
                  api.say(`This spot needs a ${kind}. ${RULE[kind]}`);
                } else api.say(`Hmm, that won't fit. Look at the shiny outline. What shape is it?`);
              }
            };
            api.choices.appendChild(b);
          });
        };
        api.prompt(`Let's build a ${pic.name}! Which shape fits the shiny spot?`);
        ask();
      })
    };
  }

  PA.games.push({
    id: 'shapes', name: 'Shapes', icon: '🔺', color: '#d5f5e8', maxLevel: 6,
    skill: 'Shapes, sides and corners, building with shapes',
    research: 'Seeing shapes in many sizes and turns next to near-misses builds real understanding instead of "triangles point up"; counting corners and building pictures from shapes follow the shape and composition trajectories of Building Blocks (Clements & Sarama).',
    levels: ['Hunt: standard shapes', 'Hunt: turned and stretched', 'Hunt: tricky near-misses', 'Count the corners', 'Build a picture', 'Hunt: pentagons and hexagons'],
    tryAtHome: [
      'Go on a shape hunt in the kitchen: is the plate a circle? Is the door a rectangle?',
      'Tilt a triangle cracker upside-down and ask, "Is it still a triangle?"',
      'Build a castle from blocks and name the shapes you used.',
      'Count the corners on a book, a sandwich, a sign.'
    ],
    intro: lvl => lvl === 4 ? 'Let\'s count corners!' : lvl === 5 ? 'Let\'s build pictures with shapes!' : 'Let\'s go on a shape hunt!',
    next(api, i, lvl) { return lvl === 4 ? cornersQ() : lvl === 5 ? buildQ() : huntQ(lvl); }
  });
})();
