  function beatsQ(maxBeats) {
    const pool = BEATS.filter(b => b[2].length <= maxBeats);
    const item = PA.store.pick('rhyme', pool, 1, b => 'beat:' + b[1])[0];
    const [e, w, parts] = item;
    const n = parts.length;
    return {
      key: 'beat:' + w,
      run: api => new Promise(resolve => {
        api.stage.style.flexDirection = 'column';
        api.stage.appendChild(U.tag(U.el('div', 'card prompt-card', `<span class="emoji">${e}</span>`), w));
        const dots = U.el('div', 'clap-dots');
        api.stage.appendChild(dots);
        const drum = U.el('button', 'card drum emoji', '🥁');
        const reset = U.el('button', 'btn white small', '<span class="emoji">🔄</span>');
        const done = U.el('button', 'btn mint', '<span class="emoji">✅</span> Done');
        api.choices.style.alignItems = 'center';
        api.choices.append(reset, drum, done);
        let taps = 0, misses = 0, busy = false;
        drum.onclick = () => {
          if (busy) return;
          taps++; dots.appendChild(U.el('span'));
          U.go(done, true);
          PA.audio.sfx('drum');
          drum.classList.remove('hit'); void drum.offsetWidth; drum.classList.add('hit');
          setTimeout(() => drum.classList.remove('hit'), 120);
        };
        const clear = () => { taps = 0; dots.innerHTML = ''; U.go(done, false); };
        reset.onclick = () => { if (!busy) { PA.audio.sfx('tap'); clear(); } };
        api.prompt(`${w}! Tap the drum once for each part of the word: ${w}. Then tap done.`);
        done.onclick = async () => {
          if (busy) return;
          if (taps === n) {
            busy = true; U.go(done, false); PA.audio.sfx('right'); api.cheer();
            await api.say(`Yes! ${w} has ${U.NUM_WORDS[n]} ${n === 1 ? 'part' : 'parts'}!`);
            return resolve(misses === 0);
          }
          misses++; PA.audio.sfx('wrong');
          busy = true; clear();
          if (misses < 2) {
            await api.say(`Let's listen again: ${w}. Tap once for each part.`);
            busy = false;
          } else {
            await api.say(`Let's drum it together.`);
            for (const p of parts) {
              if (!api.alive) return;
              dots.appendChild(U.el('span')); PA.audio.sfx('drum');
              drum.classList.add('hit');
              await api.say(p);
              drum.classList.remove('hit');
              await U.wait(150);
            }
            await api.say(`${w} has ${U.NUM_WORDS[n]} ${n === 1 ? 'part' : 'parts'}!`);
            resolve(false);
          }
        };
      })
    };
  }

  function memoryQ(pairsN) {
    return {
      key: 'memory:' + pairsN,
      size: pairsN === 3 ? 3 : 4,
      run: api => new Promise(resolve => {
        const chosen = U.shuffle(PAIRS.map((_, i) => i)).slice(0, pairsN);
        const cards = U.shuffle([].concat.apply([], chosen.map(pi => [[PAIRS[pi][0], pi], [PAIRS[pi][1], pi]])));
        const grid = U.el('div', 'memory');
        grid.style.setProperty('--cols', pairsN === 3 ? 3 : 4);
        grid.style.setProperty('--pcols', pairsN === 3 ? 3 : 4);
        api.stage.appendChild(grid);
        let open = [], found = 0, misses = 0, busy = false;
        cards.forEach(([item, pi]) => {
          const c = U.el('button', 'mcard', '<span class="back emoji">👑</span>');
          c.onclick = async () => {
            if (busy || !api.alive || c.classList.contains('up')) return;
            c.classList.add('up'); c.innerHTML = `<span class="emoji">${item[0]}</span>`;
            PA.audio.sfx('tap');
            open.push([c, item, pi]);
            if (open.length < 2) { api.say(item[1]); return; }
            busy = true;
            const [a, b] = open; open = [];
            if (a[2] === b[2]) {
              a[0].classList.add('matched'); b[0].classList.add('matched');
              PA.audio.sfx('right'); found++;
              await api.say(`${a[1][1]}, ${b[1][1]}. They rhyme!`);
              busy = false;
              if (found === pairsN) {
                api.cheer(); PA.audio.sfx('sparkle');
                await api.say('You found all the rhyming pairs!');
                resolve(misses <= pairsN + 1);
              }
            } else {
              misses++;
              await api.say(`${a[1][1]}... ${b[1][1]}. Those don't rhyme.`);
              await U.wait(400);
              [a[0], b[0]].forEach(x => { x.classList.remove('up'); x.innerHTML = '<span class="back emoji">👑</span>'; });
              busy = false;
            }
          };
          grid.appendChild(c);
        });
        api.prompt('Find the rhyming pairs! Tap two cards. If they rhyme, they stay up.');
      })
    };
  }

  PA.games.push({
    id: 'rhyme', name: 'Rhyme Time', icon: '🎵', color: '#d6f3ff', maxLevel: 7,
    skill: 'Hearing rhymes and word parts (syllables)',
    research: 'Rhyme and syllable awareness are the early steps of phonological awareness, which predicts later reading (Bradley & Bryant; Anthony & Lonigan). Drumming each word part makes it physical, and the memory game adds working memory.',
    levels: ['Rhymes: pick from 2', 'Rhymes: pick from 3', 'Drum the parts (1-2)', 'Which does NOT rhyme?', 'Drum the parts (1-4)', 'Rhyme memory (6 cards)', 'Rhyme memory (8 cards)'],
    tryAtHome: [
      'Read rhyming books and pause before the rhyming word so she can fill it in.',
      'Make up silly rhymes in the car: cat, hat, bat... zat!',
      'Clap the parts of family names together: Ma-ry, Grand-ma, Pen-el-o-pe.'
    ],
    intro: lvl => ({ 3: 'Let\'s drum the parts of words!', 5: 'Let\'s drum some long words!', 6: 'Let\'s play rhyme memory!', 7: 'Let\'s play a bigger rhyme memory!' }[lvl]
      || 'Let\'s find words that rhyme! Rhyming words sound the same at the end.'),
    next(api, i, lvl) {
      switch (lvl) {
        case 1: return pickQ(1);
        case 2: return pickQ(2);
        case 3: return beatsQ(2);
        case 4: return oddQ(3);
        case 5: return beatsQ(4);
        case 6: return memoryQ(3);
        default: return memoryQ(4);
      }
    }
  });
})();

</script>
<script>/* js/games/pattern.js */
'use strict';
// MAGIC PATTERNS: finish and build the princess's necklaces. Repeating-pattern skill in preschool predicts later
// maths (Rittle-Johnson et al., 2017). The strongest pattern tasks ask children to make the same pattern with
// different things ("abstracting" the pattern), which shows they've found the rule, not just matched colours.
// Saying the pattern aloud helps find the part that repeats, so prompts read it out.
//   1 AB   2 AAB / ABB   3 ABC   4 AABB, or a gap in the middle
//   5 copy the pattern with new beads (abstraction)   6 growing patterns: 1, 2, 3... what comes next?
window.PA = window.PA || {};
PA.games = PA.games || [];
(function () {
  const U = PA.ui;
  const BEADS = [
    ['❤️', 'red heart'], ['💙', 'blue heart'], ['⭐', 'star'], ['🌸', 'flower'], ['🐚', 'shell'],
    ['🦋', 'butterfly'], ['🍓', 'strawberry'], ['💎', 'gem'], ['🌙', 'moon'], ['💛', 'yellow heart']
  ];
  const UNITS = { 1: ['AB'], 2: ['AAB', 'ABB'], 3: ['ABC'], 4: ['AABB', 'ABC-mid', 'AAB-mid'] };
  const say = seq => seq.map(b => b[1]).join(', ');

  function extendQ(lvl) {
    const type = U.pick(UNITS[lvl]);
    const unit = type.split('-')[0];
    const mid = type.indexOf('-mid') > 0;
    const letters = Array.from(new Set(unit.split('')));
    const chosen = U.shuffle(BEADS).slice(0, letters.length + 1);
    const map = {}; letters.forEach((l, i) => { map[l] = chosen[i]; });
    const spare = chosen[letters.length];
    const reps = unit.length === 4 ? 2 : 3;
    const seq = []; for (let r = 0; r < reps; r++) for (const l of unit) seq.push(map[l]);
    let blank = seq.length - 1;
    if (mid) blank = unit.length + U.rand(0, unit.length - 1);
    const answer = seq[blank];
    const others = Array.from(new Set(letters.map(l => map[l]).concat([spare]))).filter(b => b !== answer);
    const opts = [answer].concat(U.shuffle(others).slice(0, 2));
    const spoken = seq.map((b, i) => i === blank ? 'hmmm' : b[1]);
    let blankEl;
    return {
      key: 'pat:' + type,
      prompt: mid ? `${spoken.join(', ')}. What goes in the empty spot?` : `${spoken.slice(0, -1).join(', ')}... What comes next?`,
      build(stage) {
        const neck = U.el('div', 'card necklace');
        // each bead lights up in turn as the voice reads the necklace (the gap lights on "hmmm")
        seq.forEach((b, i) => {
          const d = U.el('div', i === blank ? 'bead blank' : 'bead emoji', i === blank ? '?' : b[0]);
          if (i === blank) blankEl = d;
          neck.appendChild(d);
        });
        const tagNeck = () => Array.prototype.forEach.call(neck.children, (d, i) => U.tag(d, d === blankEl && !blankEl.classList.contains('filled') ? 'hmmm' : seq[i][1], true));
        tagNeck();
        neck._retag = tagNeck;
        stage.appendChild(neck);
      },
      choices: U.shuffle(opts).map(o => ({ html: `<span class="emoji">${o[0]}</span>`, correct: o === answer, aria: o[1] })),
      flashChoices: false,
      retry: 'Say it with me: ' + spoken.join(', ') + '.',
      hint: `Let's say it together: ${say(seq)}. It's the ${answer[1]}! Tap it.`,
      onHint() { if (blankEl) U.tag(blankEl, answer[1], true); },
      onRight() { if (blankEl) { blankEl.className = 'bead emoji filled'; blankEl.textContent = answer[0]; U.tag(blankEl, answer[1], true); } },
      praise: U.pick(['You found the pattern! ', 'Yes! ', 'Beautiful necklace! ']) + say(seq) + '!'
    };
  }

  // 5: build the same pattern with different beads
  function copyQ() {
    const unit = U.pick(['AB', 'AAB', 'ABB', 'ABC']);
    const letters = Array.from(new Set(unit.split('')));
    const picks = U.shuffle(BEADS);
    const model = {}, mine = [];
    letters.forEach((l, i) => { model[l] = picks[i]; });
    for (let i = 0; i < letters.length; i++) mine.push(picks[letters.length + i]);
    const len = unit.length === 2 ? 6 : unit.length * 2;
    const seqL = []; while (seqL.length < len) seqL.push(unit[seqL.length % unit.length]);
    return {
      key: 'copy:' + unit,
      size: 2,
      run: api => new Promise(resolve => {
        api.stage.style.flexDirection = 'column';
        const top = U.el('div', 'card necklace');
        seqL.forEach(l => top.appendChild(U.tag(U.el('div', 'bead emoji', model[l][0]), model[l][1], true)));
        const mineRow = U.el('div', 'card necklace');
        const slots = seqL.map(() => { const d = U.el('div', 'bead blank', ''); mineRow.appendChild(d); return d; });
        const pal = U.el('div', 'palette');
        api.stage.append(top, mineRow);
        const reset = U.el('button', 'btn white small', '<span class="emoji">🔄</span>');
        api.choices.style.alignItems = 'center';
        api.choices.append(pal, reset);
        let filled = [], misses = 0;
        const mark = () => slots.forEach((s, i) => s.classList.toggle('next', i === filled.length));
        mark();
        const clear = () => { filled = []; slots.forEach(s => { s.className = 'bead blank'; s.textContent = ''; }); mark(); };
        reset.onclick = () => { PA.audio.sfx('tap'); clear(); };
        const check = async () => {
          // same pattern = same letters map to the same bead, different letters to different beads
          const map = {}, used = {};
          let ok = true;
          seqL.forEach((l, i) => {
            const b = filled[i][1];
            if (map[l] === undefined) { if (used[b]) ok = false; map[l] = b; used[b] = true; } else if (map[l] !== b) ok = false;
          });
          if (ok) {
            PA.audio.sfx('right'); api.cheer();
            await api.say(`Same pattern! ${filled.map(b => b[1]).join(', ')}! You made the pattern with new beads!`);
            return resolve(misses === 0);
          }
          misses++; PA.audio.sfx('wrong');
          if (misses < 2) {
            await api.say(`Hmm, look at the princess's necklace again: ${seqL.map(l => model[l][1]).join(', ')}. Make yours the same way, with your beads.`);
            clear();
          } else {
            await api.say('Let\'s do it together.');
            clear();
            for (let i = 0; i < len && api.alive; i++) {
              const b = mine[letters.indexOf(seqL[i])];
              filled.push(b); slots[i].className = 'bead emoji filled'; slots[i].textContent = b[0];
              U.tag(slots[i], b[1], true);
              PA.audio.sfx('step');
              await api.say(b[1]);
            }
            mark();
            resolve(false);
          }
        };
        mine.forEach(b => {
          const btn = U.el('button', 'bead emoji', b[0]);
          btn.setAttribute('aria-label', b[1]);
          btn.onclick = () => {
            if (filled.length >= len) return;
            const s = slots[filled.length];
            filled.push(b); s.className = 'bead emoji filled'; s.textContent = b[0];
            PA.audio.sfx('step'); mark();
            if (filled.length === len) check();
          };
          pal.appendChild(btn);
        });
        api.prompt(`Look at the princess's necklace: ${seqL.map(l => model[l][1]).join(', ')}. Make the same pattern with your new beads!`);
      })
    };
  }

  // 6: growing pattern
  function growQ() {
    const step = Math.random() < 0.7 ? 1 : 2;
    const start = U.rand(1, 2);
    const b = U.pick(BEADS);
    const terms = [start, start + step, start + 2 * step];
    const ans = start + 3 * step;
    const grp = n => { let h = ''; for (let i = 0; i < n; i++) h += b[0]; return `<div class="group emoji">${h}</div>`; };
    const opts = U.shuffle(Array.from(new Set([ans, ans - 1, ans + 1, ans + step]))).slice(0, 3);
    if (opts.indexOf(ans) < 0) opts[0] = ans;
    const W = U.NUM_WORDS;
    return {
      key: 'grow:' + step,
      prompt: `This pattern grows! ${terms.map(n => W[n]).join(', ')}... What comes next?`,
      build(stage) {
        terms.forEach(n => stage.appendChild(U.tag(U.el('div', 'card group-card', grp(n)), W[n], true)));
        stage.appendChild(U.el('div', 'card group-card bead blank', '?'));
      },
      choices: opts.sort((x, y) => x - y).map(n => ({ html: grp(n), cls: 'wide', correct: n === ans, aria: n + ' ' + b[1] })),
      retry: `Count each group: ${terms.map(n => W[n]).join(', ')}.`,
      hint: `It grows by ${W[step]} each time: ${terms.map(n => W[n]).join(', ')}, ${W[ans]}! Tap ${W[ans]}.`,
      praise: `Yes! ${terms.map(n => W[n]).join(', ')}, ${W[ans]}! It grows by ${W[step]}!`
    };
  }

  PA.games.push({
    id: 'pattern', name: 'Magic Patterns', icon: '📿', color: '#ffe9d6', maxLevel: 6,
    skill: 'Repeating and growing patterns (early algebra)',
    research: 'Spotting, extending and re-making patterns with different objects predicts later maths (Rittle-Johnson et al.). Saying the pattern aloud helps children find the part that repeats; growing patterns connect patterns to counting.',
    levels: ['AB patterns', 'AAB / ABB', 'ABC', 'AABB and gaps in the middle', 'Make it with new beads', 'Growing patterns'],
    tryAtHome: [
      'Make a pattern with spoons and forks, then ask her to make the same pattern with socks.',
      'Clap-clap-stomp! Make sound patterns and take turns copying.',
      'Thread pasta or beads into a pattern necklace.'
    ],
    intro: lvl => lvl === 5 ? 'Let\'s make necklaces just like the princess\'s!' : lvl === 6 ? 'Some patterns grow! Let\'s look.' : 'Let\'s make magic necklaces! Find what comes next.',
    next(api, i, lvl) { return lvl <= 4 ? extendQ(lvl) : lvl === 5 ? copyQ() : growQ(); }
  });
})();

</script>
<script>/* js/games/shapes.js */
'use strict';
// SHAPES: Clements & Sarama's research shows children build narrow shape ideas ("a triangle points up") when they
// only see textbook examples. So targets come in many sizes and turns, near-misses get feedback that names the
// rule ("triangles have three straight sides"), and later levels count corners and build pictures from shapes
// (the shape-composition trajectory in Building Blocks).
//   1 hunt: standard shapes        2 hunt: turned and stretched shapes     3 hunt: with near-misses
//   4 count the corners (tap each corner)   5 build a picture from shapes   6 hunt: pentagons and hexagons too
window.PA = window.PA || {};
PA.games = PA.games || [];
(function () {
  const U = PA.ui;
  const W = U.NUM_WORDS;
  const COLORS = ['#ff8fc8', '#a77bff', '#5fb8ff', '#ffcc33', '#41cf9b', '#ff8a5c'];
  const RULE = {
    triangle: 'Triangles have three straight sides and three corners.',
    square: 'Squares have four straight sides, all the same length, and square corners.',
    rectangle: 'Rectangles have four straight sides and square corners. Two sides are long and two are short.',
    circle: 'Circles are perfectly round, with no corners.',
    pentagon: 'Pentagons have five straight sides and five corners.',
    hexagon: 'Hexagons have six straight sides and six corners.'
  };
  const PLURAL = { triangle: 'triangles', square: 'squares', rectangle: 'rectangles', circle: 'circles', pentagon: 'pentagons', hexagon: 'hexagons' };

  const pts = p => p.map(q => q.map(v => +v.toFixed(1)).join(',')).join(' ');
  const poly = p => `<polygon points="${pts(p)}"/>`;
  const regular = (n, r, rot) => Array.from({ length: n }, (_, i) => {
    const a = (rot || -90) * Math.PI / 180 + i * 2 * Math.PI / n;
    return [50 + r * Math.cos(a), 50 + r * Math.sin(a)];
  });
  const TRI = [[[50, 12], [90, 80], [10, 80]], [[15, 15], [15, 85], [85, 85]], [[10, 75], [90, 85], [35, 15]], [[50, 4], [64, 96], [36, 96]], [[4, 68], [96, 68], [30, 36]]];
  const SHAPES = {
    triangle: () => poly(U.pick(TRI)),
    square: () => { const h = U.rand(22, 38); return `<rect x="${50 - h}" y="${50 - h}" width="${2 * h}" height="${2 * h}"/>`; },
    rectangle: () => { const w = U.rand(80, 96), h = U.rand(28, 46); return `<rect x="${50 - w / 2}" y="${50 - h / 2}" width="${w}" height="${h}"/>`; },
    circle: () => `<circle cx="50" cy="50" r="${U.rand(26, 44)}"/>`,
    pentagon: () => poly(regular(5, 44)),
    hexagon: () => poly(regular(6, 44, 0)),
    oval: () => '<ellipse cx="50" cy="50" rx="46" ry="24"/>',
    star: () => poly([[50, 5], [61, 38], [96, 38], [68, 59], [79, 93], [50, 72], [21, 93], [32, 59], [4, 38], [39, 38]]),
    heart: () => '<path d="M50 88 C10 62 4 32 27 22 C40 17 48 25 50 33 C52 25 60 17 73 22 C96 32 90 62 50 88 Z"/>',
    diamond: () => poly([[50, 4], [80, 50], [50, 96], [20, 50]]),
    slanted: () => poly([[28, 26], [96, 26], [72, 74], [4, 74]]),
    curvy: () => '<path d="M50 12 L90 76 Q50 104 10 76 Z"/>',
    open: () => '<path d="M44 22 L10 80 L90 80 L56 22" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>',
    heptagon: () => poly(regular(7, 44))
  };
  const NEAR = {
    triangle: [['curvy', 'That one has a curvy side. Triangles have three straight sides.'], ['open', 'That one has a gap. A triangle is closed all the way around.']],
    square: [['diamond', 'That one is squished, its corners aren\'t square corners.'], ['rectangle', 'That one is long. A square\'s sides are all the same length.']],
    rectangle: [['slanted', 'That one leans over. Rectangles have square corners.']],
    circle: [['oval', 'That one is stretched. It\'s an oval. Circles are perfectly round.']],
    pentagon: [['hexagon', 'That one has six sides. It\'s a hexagon. Pentagons have five.']],
    hexagon: [['pentagon', 'That one has five sides. It\'s a pentagon. Hexagons have six.'], ['heptagon', 'Count the sides: that one has seven. Hexagons have six.']]
  };
  const NAME = { triangle: 'triangle', square: 'square', rectangle: 'rectangle', circle: 'circle', oval: 'oval', star: 'star', heart: 'heart', diamond: 'diamond', slanted: 'slanted shape', curvy: 'curvy shape', open: 'open shape', pentagon: 'pentagon', hexagon: 'hexagon', heptagon: 'seven-sided shape' };

  function svgFor(kind, rot, scale) {
    const col = U.pick(COLORS);
    return `<svg viewBox="0 0 100 100"><g transform="rotate(${rot} 50 50) translate(50 50) scale(${scale || 1}) translate(-50 -50)" fill="${col}" stroke="${PA.art.shade(col, -0.25)}" stroke-width="4" stroke-linejoin="round">${SHAPES[kind]()}</g></svg>`;
  }

  // ---------- hunts (1, 2, 3, 6) ----------
  function huntQ(lvl) {
    const kinds = lvl === 6 ? ['triangle', 'square', 'rectangle', 'circle', 'pentagon', 'hexagon'] : ['triangle', 'square', 'rectangle', 'circle'];
    const target = PA.store.pick('shapes', kinds, 1, k => 'shape:' + k)[0];
    return {
      key: 'shape:' + target,
      run: api => new Promise(resolve => {
        const nTargets = lvl === 1 ? 3 : 4;
        const total = lvl === 1 ? 8 : 11;
        const varied = lvl >= 2;
        const items = [];
        for (let i = 0; i < nTargets; i++) items.push({ kind: target, target: true, svg: svgFor(target, varied ? U.pick([0, 15, 30, 45, 90, 135, 180, 210, 300]) : 0, varied ? U.pick([0.7, 0.85, 1]) : 1) });
        const basic = (lvl === 6 ? ['triangle', 'square', 'rectangle', 'circle', 'pentagon', 'hexagon', 'star'] : ['triangle', 'square', 'rectangle', 'circle', 'star', 'heart'])
          .filter(k => k !== target && !(target === 'rectangle' && k === 'square'));
        if (lvl >= 3) NEAR[target].forEach(([k, why]) => items.push({ kind: k, why, svg: svgFor(k, U.pick([0, 20, 90, 160]), 1) }));
        while (items.length < total) { const k = U.pick(basic); items.push({ kind: k, svg: svgFor(k, varied ? U.pick([0, 30, 90]) : 0, 1) }); }

        const field = U.el('div', 'shape-field');
        const portrait = window.innerHeight > window.innerWidth;
        const cols = portrait ? 4 : 6, rows = portrait ? 4 : 3;
        const cells = U.shuffle(Array.from({ length: cols * rows }, (_, i) => i)).slice(0, items.length);
        let found = 0, misses = 0;
        const count = U.el('div', 'found-count', '');
        const showCount = () => { count.innerHTML = `<span class="emoji">⭐</span> ${found} / ${nTargets}`; };
        showCount();
        const nodes = [];
        U.shuffle(items).forEach((it, i) => {
          const c = cells[i];
          const b = U.el('button', 'shp', it.svg);
          b.style.width = (100 / cols) + '%'; b.style.height = (100 / rows) + '%';
          b.style.left = (c % cols) * 100 / cols + '%';
          b.style.top = Math.floor(c / cols) * 100 / rows + '%';
          b.setAttribute('aria-label', NAME[it.kind]);
          nodes.push([b, it]);
          b.onclick = async () => {
            if (!api.alive || b.classList.contains('found')) return;
            if (it.target) {
              b.classList.remove('hint'); b.classList.add('found'); found++; showCount();
              PA.audio.sfx('right');
              if (found === nTargets) {
                api.cheer(); PA.audio.sfx('sparkle');
                await api.say(U.pick([`You found all the ${PLURAL[target]}! Even the tricky ones!`, `All the ${PLURAL[target]}! You looked so carefully!`]));
                resolve(misses === 0);
              } else PA.audio.say(U.pick(['Yes!', 'That\'s one!', 'Good eye!', 'Found it!']));
            } else {
              misses++; PA.audio.sfx('wrong');
              b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope');
              api.say(it.why || `That's a ${NAME[it.kind]}. ${RULE[target]}`);
              if (misses >= 2) nodes.forEach(([n, x]) => { if (x.target && !n.classList.contains('found')) n.classList.add('hint'); });
            }
          };
          field.appendChild(b);
        });
        api.hideGuide();
        api.stage.style.flexDirection = 'column';
        api.stage.style.width = '100%';
        api.stage.append(count, field);
        api.prompt(`Tap all the ${PLURAL[target]}! ${RULE[target]}`);
      })
    };
  }

  // ---------- 4: count the corners ----------
  const CORNER_SHAPES = [
    ['triangle', TRI[0]], ['triangle', TRI[2]], ['triangle', TRI[4]],
    ['square', [[20, 20], [80, 20], [80, 80], [20, 80]]], ['rectangle', [[6, 28], [94, 28], [94, 72], [6, 72]]],
    ['shape', [[15, 20], [85, 30], [75, 85], [20, 70]]], ['pentagon', regular(5, 44)], ['hexagon', regular(6, 44, 0)],
    ['shape', [[50, 8], [92, 40], [75, 92], [22, 85], [8, 40]]], ['shape', [[10, 30], [50, 8], [90, 30], [90, 80], [10, 80]]]
  ];
  function cornersQ() {
    const pick = PA.store.pick('shapes', CORNER_SHAPES.map((_, i) => i), 1, i => 'corners:' + i)[0];
    const [nm, p] = CORNER_SHAPES[pick];
    const n = p.length;
    const col = U.pick(COLORS);
    let dots = [], numberAll;
    const opts = Array.from(new Set([n, n - 1, n + 1, n + 2].filter(x => x >= 3 && x <= 7))).slice(0, 3);
    if (opts.indexOf(n) < 0) opts[0] = n;
    return {
      key: 'corners:' + pick,
      prompt: 'How many corners? Tap each corner to count.',
      build(stage) {
        const box = U.el('div', 'card corner-shape');
        const sv = `<svg viewBox="-8 -8 116 116"><polygon points="${pts(p)}" fill="${col}" stroke="${PA.art.shade(col, -0.25)}" stroke-width="3" stroke-linejoin="round"/>
          ${p.map((q, i) => `<g class="corner" data-i="${i}"><circle cx="${q[0]}" cy="${q[1]}" r="9" fill="#fff" stroke="#8a5cf6" stroke-width="2.5"/><text x="${q[0]}" y="${q[1] + 4}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="sans-serif"></text></g>`).join('')}</svg>`;
        box.innerHTML = sv;
        stage.appendChild(box);
        let k = 0;
        dots = Array.from(box.querySelectorAll('.corner'));
        const mark = (g, num) => { g.querySelector('circle').setAttribute('fill', '#8a5cf6'); g.querySelector('text').textContent = num; g.dataset.done = '1'; U.tag(g, W[num]); };
        dots.forEach(g => g.addEventListener('click', () => {
          if (g.dataset.done) return;
          k++; mark(g, k); PA.audio.sfx('tap'); PA.audio.say(W[k]);
        }));
        numberAll = () => dots.forEach((g, i) => mark(g, i + 1));
      },
      choices: opts.sort((a, b) => a - b).map(x => ({ html: String(x), cls: 'num', correct: x === n, aria: String(x) })),
      onHint: () => numberAll && numberAll(),
      hint: `Let's count the corners: ${U.countAloud(1, n)}. ${W[n]} corners! Tap ${W[n]}.`,
      praise: nm === 'shape' ? `Yes! ${W[n]} corners!` : `Yes! ${W[n]} corners! It's a ${nm}.`
    };
  }

  // ---------- 5: build a picture ----------
  const PICTURES = [
    { name: 'castle', slots: [
      ['rectangle', '<rect x="50" y="80" width="100" height="70"/>'], ['rectangle', '<rect x="15" y="60" width="35" height="90"/>'],
      ['rectangle', '<rect x="150" y="60" width="35" height="90"/>'], ['triangle', '<polygon points="15,60 50,60 32.5,22"/>'],
      ['triangle', '<polygon points="150,60 185,60 167.5,22"/>'], ['triangle', '<polygon points="50,80 150,80 100,42"/>'],
      ['circle', '<circle cx="100" cy="103" r="11"/>'], ['square', '<rect x="87" y="124" width="26" height="26"/>']] },
    { name: 'crown', slots: [
      ['rectangle', '<rect x="30" y="105" width="140" height="35"/>'], ['triangle', '<polygon points="30,105 76,105 53,45"/>'],
      ['triangle', '<polygon points="77,105 123,105 100,28"/>'], ['triangle', '<polygon points="124,105 170,105 147,45"/>'],
      ['circle', '<circle cx="100" cy="122" r="10"/>'], ['square', '<rect x="46" y="114" width="16" height="16"/>'], ['square', '<rect x="138" y="114" width="16" height="16"/>']] },
    { name: 'carriage', slots: [
      ['circle', '<circle cx="100" cy="82" r="44"/>'], ['rectangle', '<rect x="38" y="114" width="124" height="16"/>'],
      ['circle', '<circle cx="62" cy="140" r="17"/>'], ['circle', '<circle cx="138" cy="140" r="17"/>'],
      ['square', '<rect x="85" y="62" width="30" height="30"/>'], ['triangle', '<polygon points="86,40 114,40 100,14"/>']] },
    { name: 'rocket', slots: [
      ['rectangle', '<rect x="80" y="50" width="40" height="80"/>'], ['triangle', '<polygon points="80,50 120,50 100,10"/>'],
      ['triangle', '<polygon points="80,100 80,140 55,140"/>'], ['triangle', '<polygon points="120,100 120,140 145,140"/>'],
      ['circle', '<circle cx="100" cy="75" r="11"/>'], ['square', '<rect x="90" y="130" width="20" height="20"/>']] }
  ];
  const KIND_COL = { rectangle: '#a77bff', triangle: '#ff8fc8', circle: '#ffcc33', square: '#5fb8ff' };
  const ICON = {
    circle: '<circle cx="50" cy="50" r="38"/>', triangle: '<polygon points="50,10 90,85 10,85"/>',
    square: '<rect x="15" y="15" width="70" height="70"/>', rectangle: '<rect x="4" y="28" width="92" height="44"/>'
  };
  const icon = k => `<svg viewBox="0 0 100 100"><g fill="${KIND_COL[k]}" stroke="${PA.art.shade(KIND_COL[k], -0.25)}" stroke-width="4">${ICON[k]}</g></svg>`;

  function buildQ() {
    const pic = PA.store.pick('shapes', PICTURES, 1, p => 'build:' + p.name)[0];
    return {
      key: 'build:' + pic.name,
      size: 3,
      run: api => new Promise(resolve => {
        api.hideGuide();
        const box = U.el('div', 'card build');
        box.innerHTML = `<svg viewBox="0 0 200 160">${pic.slots.map((s, i) => `<g class="slot" data-i="${i}" fill="rgba(255,255,255,.6)" stroke="#b9a6d0" stroke-width="2" stroke-dasharray="5 4">${s[1]}</g>`).join('')}</svg>`;
        api.stage.appendChild(box);
        const slotEls = Array.from(box.querySelectorAll('.slot'));
        let at = 0, misses = 0;
        const show = () => {
          slotEls.forEach((g, i) => {
            if (i === at) { g.setAttribute('stroke', '#ffc93c'); g.setAttribute('stroke-width', '4'); g.setAttribute('stroke-dasharray', ''); g.setAttribute('fill', '#fff7d6'); }
          });
        };
        const ask = () => {
          show();
          const kind = pic.slots[at][0];
          const others = U.shuffle(Object.keys(ICON).filter(k => k !== kind && !(kind === 'rectangle' && k === 'square') && !(kind === 'square' && k === 'rectangle'))).slice(0, 2);
          const opts = U.shuffle([kind].concat(others));
          api.choices.innerHTML = '';
          let tries = 0;
          opts.forEach(k => {
            const b = U.el('button', 'card choice shape-ic', icon(k));
            b.setAttribute('aria-label', k);
            b.onclick = async () => {
              if (!api.alive) return;
              if (k === kind) {
                const g = slotEls[at];
                g.setAttribute('fill', KIND_COL[kind]); g.setAttribute('stroke', PA.art.shade(KIND_COL[kind], -0.25)); g.setAttribute('stroke-width', '2');
                PA.audio.sfx('right');
                at++;
                if (at === pic.slots.length) {
                  api.choices.innerHTML = '';
                  api.cheer(); PA.audio.sfx('fanfare');
                  await api.say(`You built a ${pic.name}! Look at all those shapes!`);
                  return resolve(misses <= 1);
                }
                api.say(U.pick([`A ${kind}!`, `Yes, a ${kind}!`, 'It fits!']));
                ask();
              } else {
                tries++; misses++; PA.audio.sfx('wrong');
                b.classList.add('wrong');
                if (tries >= 2) {
                  Array.from(api.choices.children).forEach(x => { if (x.getAttribute('aria-label') === kind) x.classList.add('hint'); });
                  api.say(`This spot needs a ${kind}. ${RULE[kind]}`);
                } else api.say(`Hmm, that won't fit. Look at the shiny outline. What shape is it?`);
              }
            };
            api.choices.appendChild(b);
          });
        };
        api.prompt(`Let's build a ${pic.name}! Which shape fits the shiny spot?`);
        ask();
      })
    };
  }

  PA.games.push({
    id: 'shapes', name: 'Shapes', icon: '🔺', color: '#d5f5e8', maxLevel: 6,
    skill: 'Shapes, sides and corners, building with shapes',
    research: 'Seeing shapes in many sizes and turns next to near-misses builds real understanding instead of "triangles point up"; counting corners and building pictures from shapes follow the shape and composition trajectories of Building Blocks (Clements & Sarama).',
    levels: ['Hunt: standard shapes', 'Hunt: turned and stretched', 'Hunt: tricky near-misses', 'Count the corners', 'Build a picture', 'Hunt: pentagons and hexagons'],
    tryAtHome: [
      'Go on a shape hunt in the kitchen: is the plate a circle? Is the door a rectangle?',
      'Tilt a triangle cracker upside-down and ask, "Is it still a triangle?"',
      'Build a castle from blocks and name the shapes you used.',
      'Count the corners on a book, a sandwich, a sign.'
    ],
    intro: lvl => lvl === 4 ? 'Let\'s count corners!' : lvl === 5 ? 'Let\'s build pictures with shapes!' : 'Let\'s go on a shape hunt!',
    next(api, i, lvl) { return lvl === 4 ? cornersQ() : lvl === 5 ? buildQ() : huntQ(lvl); }
  });
})();

</script>
<script>/* js/games/colours.js */
'use strict';
// MERMAID COLOURS: a silly shark is chasing the mermaid. Every right answer helps her swim towards the beach;
// a wrong tap lets the shark creep a little closer, but it never catches her (no losing, as in every game here).
// At the end of the round she reaches the land and turns into a princess with legs.
// The ladder follows early-years art and science: name colours, sort things by colour (sorting by one attribute
// is also an early maths skill), then cause and effect with paint: two colours make a new one, mix it yourself,
// lighter with white and brown from all three, and the order of the rainbow.
//   1 find the colour          2 colour homes (put each sea friend in the matching home)
//   3 what do two colours make?   4 mix it yourself (tap two paints)   5 mixing homes (which two make it?)
//   6 lighter with white, and brown      7 rainbow order: which colour is missing?
window.PA = window.PA || {};
PA.games = PA.games || [];
(function () {
  const U = PA.ui, S = PA.store;
  const C = {
    red: '#e8383d', orange: '#ff8a1c', yellow: '#ffd21f', green: '#38b54a', blue: '#2f7fe8', purple: '#8e4fd6',
    pink: '#ff8fc8', brown: '#8b5a2b', black: '#2d2a32', white: '#ffffff', grey: '#9a9aa6', 'light blue': '#a6dcff'
  };
  const BASIC = ['red', 'orange', 'yellow', 'green', 'blue', 'purple'];
  const RAINBOW = BASIC;
  const PRIMARY = ['red', 'yellow', 'blue'];
  const MIX = { 'red+yellow': 'orange', 'blue+red': 'purple', 'blue+yellow': 'green', 'red+white': 'pink', 'blue+white': 'light blue', 'black+white': 'grey' };
  const mixOf = (a, b) => a === b ? a : MIX[[a, b].sort().join('+')] || null;
  const PAIRS = [['red', 'yellow', 'orange'], ['blue', 'yellow', 'green'], ['red', 'blue', 'purple']];
  const KINDS = ['fish', 'shell', 'star', 'pearl'];
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const dark = col => col === 'white' ? '#bdb6cc' : PA.art.shade(C[col], -0.3);

  // ---------- pictures ----------
  function thing(kind, col) {
    const s = `fill="${C[col]}" stroke="${dark(col)}" stroke-width="4" stroke-linejoin="round"`;
    let b;
    if (kind === 'fish') b = `<path d="M12 50 Q40 14 70 38 L90 22 L86 50 L90 78 L70 62 Q40 86 12 50 Z" ${s}/><circle cx="32" cy="44" r="6" fill="#fff"/><circle cx="33" cy="45" r="3" fill="#241626"/>`;
    else if (kind === 'shell') b = `<path d="M50 86 L16 40 Q50 2 84 40 Z" ${s}/><path d="M50 84 L33 30 M50 84 L50 20 M50 84 L67 30" stroke="${dark(col)}" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect x="39" y="80" width="22" height="12" rx="5" ${s}/>`;
    else if (kind === 'star') b = `<path d="${PA.art.starPath(50, 54, 44, 19)}" ${s}/><circle cx="42" cy="50" r="3.5" fill="${dark(col)}"/><circle cx="58" cy="50" r="3.5" fill="${dark(col)}"/><path d="M43 60 Q50 66 57 60" stroke="${dark(col)}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    else b = `<circle cx="50" cy="50" r="38" ${s}/><circle cx="37" cy="36" r="9" fill="#fff" opacity=".75"/>`;
    return `<svg viewBox="0 0 100 100" aria-hidden="true">${b}</svg>`;
  }
  const drop = col => `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 Q80 44 80 62 A30 30 0 0 1 20 62 Q20 44 50 6 Z" fill="${C[col] || '#cfc7da'}" stroke="${col ? dark(col) : '#a99fbd'}" stroke-width="4" stroke-linejoin="round"/><ellipse cx="38" cy="58" rx="6" ry="10" fill="#fff" opacity=".55"/></svg>`;
  const pot = col => `<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="22" y="12" width="56" height="12" rx="5" fill="#d9cfe8"/><path d="M18 28 L82 28 L76 90 Q50 96 24 90 Z" fill="#fff" stroke="#cbbfdd" stroke-width="3"/><path d="M21 44 L79 44 L76 90 Q50 96 24 90 Z" fill="${C[col]}" stroke="${dark(col)}" stroke-width="3"/></svg>`;
  const caveHome = col => `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M6 94 L6 52 A44 44 0 0 1 94 52 L94 94 Z" fill="${C[col]}" stroke="${dark(col)}" stroke-width="4" stroke-linejoin="round"/><path d="M28 94 L28 62 A22 22 0 0 1 72 62 L72 94 Z" fill="#103b5c" opacity=".3"/></svg>`;

  // ---------- the chase ----------
  const GAP = 9;
  function scene(api) {
    if (api.sea) return api.sea;
    const el = U.el('div', 'sea');
    el.innerHTML = '<div class="waves"></div><div class="beach"><span class="emoji palm">🌴</span><span class="emoji hut">🏰</span></div>' +
      '<span class="emoji bub b1">○</span><span class="emoji bub b2">○</span><span class="emoji bub b3">○</span>';
    const mer = U.el('div', 'mer', PA.art.mermaid());
    const shark = U.el('div', 'shark', PA.art.shark());
    U.tag(mer, 'mermaid'); U.tag(shark, 'shark');
    el.append(shark, mer);
    const sea = api.sea = { el, mer, shark, n: 0, gap: GAP };
    sea.place = () => {
      const x = 14 + 56 * Math.min(1, sea.n / (api.roundLen || 10));
      mer.style.left = x + '%';
      shark.style.left = (x - 16 - sea.gap) + '%';
    };
    sea.ahead = () => {
      sea.n++; sea.gap = GAP; sea.place();
      mer.classList.remove('swim'); void mer.offsetWidth; mer.classList.add('swim');
    };
    sea.closer = () => {
      sea.gap = Math.max(0, sea.gap - 4.5); sea.place();
      shark.classList.remove('snap'); void shark.offsetWidth; shark.classList.add('snap');
    };
    sea.place();
    return sea;
  }
  // every question: the chase on top, the question underneath
  function sq(api, q) {
    const sea = scene(api), build = q.build;
    q.build = (stage, a) => {
      stage.style.flexDirection = 'column';
      stage.appendChild(sea.el);
      if (build) build(stage, a);
    };
    const onRight = q.onRight;
    q.onRight = () => { sea.ahead(); if (onRight) onRight(); };
    const onHint = q.onHint;
    q.onHint = () => { sea.closer(); if (onHint) onHint(); };
    q.wrong = () => { sea.closer(); return Math.random() < 0.35 ? 'Swim, mermaid! Try again!' : null; };
    return q;
  }
  const equation = (cols, ans) => {
    const row = U.el('div', 'card mixrow');
    cols.forEach((col, i) => {
      if (i) row.appendChild(U.el('div', 'plus', '+'));
      row.appendChild(U.tag(U.el('div', 'paint', drop(col)), col));
    });
    row.appendChild(U.el('div', 'plus', '='));
    const q = U.el('div', 'paint ask', drop(null) + '<b>?</b>');
    row.appendChild(q);
    row.fill = () => { q.innerHTML = drop(ans); q.classList.add('filled'); };
    return row;
  };

  // 1: find the colour
  function findQ(api) {
    const pool = BASIC.concat(api.c > 0.35 ? ['pink', 'brown'] : []).concat(api.c > 0.7 ? ['black', 'white'] : []);
    const col = S.pick('colours', pool, 1, x => 'find:' + x)[0];
    const others = U.shuffle(pool.filter(x => x !== col)).slice(0, api.nOpts(3, 5) - 1);
    const opts = U.shuffle([col].concat(others));
    const mixed = api.c > 0.3; // different sea friends, so she has to look at the colour, not the shape
    const kind = U.pick(KINDS);
    return sq(api, {
      key: 'find:' + col,
      prompt: mixed ? `Find something ${col}!` : `Find the ${col} ${kind}!`,
      choices: opts.map(o => ({ html: thing(mixed ? U.pick(KINDS) : kind, o), cls: 'sea-choice', correct: o === col, aria: o })),
      hint: `This one is ${col}. Tap it.`,
      praise: U.pick([`Yes! That's ${col}!`, `${cap(col)}! Swim, mermaid, swim!`, `You found ${col}!`])
    });
  }

  // 3: what do two colours make?
  function mixQ(api) {
    const pi = S.pick('colours', [0, 1, 2], 1, k => 'mix:' + PAIRS[k][2])[0];
    let [a, b, ans] = PAIRS[pi];
    if (Math.random() < 0.5) { const t = a; a = b; b = t; }
    let opts = ['orange', 'green', 'purple'];
    if (api.nOpts(3, 4) > 3) opts.push(U.pick(PRIMARY));
    opts = U.shuffle(opts);
    let row;
    return sq(api, {
      key: 'mix:' + ans,
      prompt: `${cap(a)} and ${b} make... which colour?`,
      build(stage) { row = equation([a, b], ans); stage.appendChild(row); },
      onRight: () => row.fill(),
      choices: opts.map(o => ({ html: drop(o), cls: 'paint-choice', correct: o === ans, aria: o })),
      hint: `${cap(a)} and ${b} make ${ans}. Tap ${ans}.`,
      praise: `Yes! ${cap(a)} and ${b} make ${ans}!`
    });
  }

  // 6: lighter with white, and brown from all three
  const LIGHT = [
    { cols: ['red', 'white'], ans: 'pink', dis: ['purple', 'orange'] },
    { cols: ['blue', 'white'], ans: 'light blue', dis: ['green', 'purple'] },
    { cols: ['black', 'white'], ans: 'grey', dis: ['brown', 'blue'] },
    { cols: ['red', 'yellow', 'blue'], ans: 'brown', dis: ['green', 'orange', 'purple'] }
  ];
  function lightQ(api) {
    const li = S.pick('colours', LIGHT.map((_, k) => k), 1, k => 'light:' + LIGHT[k].ans)[0];
    const L = LIGHT[li];
    const opts = U.shuffle([L.ans].concat(U.shuffle(L.dis).slice(0, api.nOpts(2, 3))));
    const said = L.cols.length === 2 ? `${cap(L.cols[0])} and ${L.cols[1]}` : 'Red and yellow and blue, all mixed together,';
    let row;
    return sq(api, {
      key: 'light:' + L.ans,
      prompt: `${said} make... which colour?`,
      build(stage) { row = equation(L.cols, L.ans); stage.appendChild(row); },
      onRight: () => row.fill(),
      choices: opts.map(o => ({ html: drop(o), cls: 'paint-choice', correct: o === L.ans, aria: o })),
      hint: `${said} make ${L.ans}. Tap ${L.ans}.`,
      praise: L.ans === 'brown' ? 'Yes! When you mix lots of colours, you get brown!' : `Yes! ${cap(L.cols[0])} and white make ${L.ans}. White makes colours lighter!`
    });
  }

  // 7: rainbow order
  function rainbowQ(api) {
    const miss = S.pick('colours', RAINBOW, 1, x => 'rainbow:' + x)[0];
    const mi = RAINBOW.indexOf(miss);
    const pool = RAINBOW.filter(x => x !== miss).concat(['pink', 'brown']);
    const opts = U.shuffle([miss].concat(U.shuffle(pool).slice(0, api.nOpts(2, 4))));
    const said = RAINBOW.join(', ');
    let gap;
    return sq(api, {
      key: 'rainbow:' + miss,
      prompt: api.c > 0.5 ? 'Which colour is missing from the rainbow?' : `A rainbow goes ${RAINBOW.map(x => x === miss ? 'hmm' : x).join(', ')}. Which colour is missing?`,
      build(stage) {
        const card = U.el('div', 'card rainbow');
        let svg = '<svg viewBox="0 0 240 128" aria-hidden="true">';
        RAINBOW.forEach((col, i) => {
          const r = 108 - i * 15;
          svg += `<path data-i="${i}" d="M${120 - r} 122 A${r} ${r} 0 0 1 ${120 + r} 122" fill="none" stroke="${i === mi ? '#b9a6d6' : C[col]}" stroke-width="${i === mi ? 5 : 14}" ${i === mi ? 'stroke-dasharray="7 6" stroke-linecap="round"' : ''}/>`;
        });
        svg += '</svg>';
        card.innerHTML = svg;
        card.querySelectorAll('path').forEach(p => { const i = +p.getAttribute('data-i'); if (i !== mi) U.tag(p, RAINBOW[i]); });
        gap = card.querySelector(`path[data-i="${mi}"]`);
        stage.appendChild(card);
      },
      onRight: () => { gap.setAttribute('stroke', C[miss]); gap.setAttribute('stroke-width', '14'); gap.removeAttribute('stroke-dasharray'); U.tag(gap, miss); },
      choices: opts.map(o => ({ html: drop(o), cls: 'paint-choice', correct: o === miss, aria: o })),
      flashChoices: false,
      retry: 'Say the rainbow colours with me, and look for the gap.',
      hint: `${said}. ${cap(miss)} is missing. Tap ${miss}.`,
      praise: `Yes! ${said}! The rainbow is finished!`
    });
  }

  // ---------- drag (or tap, then tap) things into homes ----------
  // items: [{html, key, name}], homes: [{html, key}]. Resolves true when everything went home with no mistakes.
  function placeQ(api, o) {
    return api2 => new Promise(resolve => {
      const sea = scene(api2);
      api2.stage.style.flexDirection = 'column';
      api2.stage.appendChild(sea.el);
      const homesRow = U.el('div', 'homes'), itemsRow = U.el('div', 'loose');
      api2.stage.appendChild(homesRow);
      api2.choices.appendChild(itemsRow);
      let misses = 0, left = o.items.length, sel = null, busy = false;
      const homes = o.homes.map(h => {
        const el = U.el('div', 'sea-home', h.html); el._h = h;
        homesRow.appendChild(el);
        el.onclick = () => { if (sel) putIn(sel, el); };
        return el;
      });
      const items = o.items.map(it => {
        const el = U.el('div', 'card sea-item', it.html); el._it = it;
        el.setAttribute('role', 'button'); el.setAttribute('aria-label', it.name);
        itemsRow.appendChild(el);
        drag(el);
        return el;
      });
      api2.prompt(o.prompt);
      const select = el => {
        items.forEach(x => x.classList.toggle('sel', x === el));
        sel = el;
        if (el) { PA.audio.sfx('tap'); api2.say(o.onPick(el._it)); }
      };
      function hintFor(el) {
        homes.forEach(h => h.classList.toggle('hint', !!el && !h._full && h._h.key === el._it.key));
      }
      async function putIn(el, home) {
        if (busy || !api2.alive || el._done) return;
        if (!home || home._full) { select(el); return; }
        if (home._h.key === el._it.key) {
          busy = true;
          el._done = true; home._full = true; select(null); hintFor(null);
          el.classList.add('placed'); el.classList.remove('hint');
          home.appendChild(el);
          PA.audio.sfx('right'); api2.cheer();
          left--;
          await api2.say(o.onRight(el._it));
          busy = false;
          if (!left) { sea.ahead(); await api2.say(o.done || U.praise()); resolve(misses === 0); }
        } else {
          misses++; PA.audio.sfx('wrong'); sea.closer();
          el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
          select(el);
          if (misses >= 2) { hintFor(el); el.classList.add('hint'); }
          api2.say(o.onWrong(el._it, home._h));
        }
      }
      function drag(el) {
        let id = null, sx = 0, sy = 0, moved = false, sc = 1;
        el.addEventListener('pointerdown', e => {
          if (el._done || !api2.alive || busy) return;
          e.preventDefault();
          id = e.pointerId; sx = e.clientX; sy = e.clientY; moved = false;
          sc = (el.getBoundingClientRect().width / el.offsetWidth) || 1;
          try { el.setPointerCapture(id); } catch (er) { }
        });
        el.addEventListener('pointermove', e => {
          if (e.pointerId !== id) return;
          const dx = e.clientX - sx, dy = e.clientY - sy;
          if (!moved && Math.abs(dx) + Math.abs(dy) > 12) { moved = true; el.classList.add('dragging'); if (sel !== el) select(el); }
          if (moved) el.style.transform = `translate(${dx / sc}px, ${dy / sc}px) scale(1.1)`;
        });
        const end = (e, cancel) => {
          if (e.pointerId !== id) return;
          id = null;
          if (!moved) { if (!cancel) select(sel === el ? null : el); return; }
          el.style.visibility = 'hidden';
          const t = cancel ? null : document.elementFromPoint(e.clientX, e.clientY);
          el.style.visibility = '';
          el.classList.remove('dragging'); el.style.transform = '';
          const home = t && t.closest ? t.closest('.sea-home') : null;
          if (home) putIn(el, home);
        };
        el.addEventListener('pointerup', e => end(e, false));
        el.addEventListener('pointercancel', e => end(e, true));
      }
    });
  }

  // 2: colour homes
  function homeQ(api) {
    const pool = BASIC.concat(api.c > 0.5 ? ['pink', 'brown'] : []);
    const cols = S.pick('colours', pool, api.nOpts(3, 5), x => 'home:' + x);
    const items = U.shuffle(cols.map(col => ({ html: thing(U.pick(KINDS), col), key: col, name: col })));
    return {
      key: 'home:' + cols.length,
      run: placeQ(api, {
        prompt: 'Help the sea friends hide from the shark! Drag each one into the home that is the same colour.',
        items, homes: U.shuffle(cols).map(col => ({ html: caveHome(col), key: col })),
        onPick: it => cap(it.name) + '!',
        onRight: it => U.pick([`${cap(it.name)} home!`, `Safe in the ${it.name} home!`]),
        onWrong: it => `That one is ${it.name}. Find the ${it.name} home.`,
        done: 'Everyone is safe! Swim, mermaid, swim!'
      })
    };
  }
  // 5: mixing homes: put each colour on the two paints that make it
  function mixHomeQ(api) {
    const pairs = U.shuffle(PAIRS);
    const pairHtml = p => `<div class="pairhome">${drop(p[0])}<b>+</b>${drop(p[1])}</div>`;
    return {
      key: 'mixhome',
      run: placeQ(api, {
        prompt: 'Mixing magic! Drag each sea friend onto the two colours that mix to make it.',
        items: U.shuffle(pairs.map(p => ({ html: thing(U.pick(KINDS), p[2]), key: p[2], name: p[2], p }))),
        homes: pairs.map(p => ({ html: pairHtml(p), key: p[2] })),
        onPick: it => cap(it.name) + '!',
        onRight: it => `${cap(it.p[0])} and ${it.p[1]} make ${it.name}!`,
        onWrong: it => `${cap(it.name)} is made from ${it.p[0]} and ${it.p[1]}. Find ${it.p[0]} and ${it.p[1]}.`,
        done: 'Mixing magic! Swim, mermaid, swim!'
      })
    };
  }

  // 4: mix it yourself
  function makeQ(api) {
    const pi = S.pick('colours', [0, 1, 2], 1, k => 'make:' + PAIRS[k][2])[0];
    const [x, y, target] = PAIRS[pi];
    const pots = PRIMARY.concat(api.c > 0.5 ? ['white'] : []);
    return {
      key: 'make:' + target,
      run: api2 => new Promise(resolve => {
        const sea = scene(api2);
        api2.stage.style.flexDirection = 'column';
        api2.stage.appendChild(sea.el);
        const row = U.el('div', 'row');
        const goal = U.tag(U.el('div', 'card goal', thing('fish', 'white')), 'fish');
        const bowl = U.el('div', 'card bowl', drop(null));
        row.append(goal, U.el('div', 'plus', '→'), bowl);
        api2.stage.appendChild(row);
        let first = null, misses = 0, busy = false;
        const prompt = `Paint the fish ${target}! Tap two paints to mix ${target}.`;
        api2.prompt(prompt);
        const btns = pots.map(col => {
          const b = U.el('button', 'card choice potc', pot(col));
          b.setAttribute('aria-label', col);
          U.tag(b, col);
          b.onclick = async () => {
            if (busy || !api2.alive) return;
            PA.audio.sfx('tap');
            if (!first) { first = col; bowl.innerHTML = drop(col); b.classList.add('picked'); api2.say(cap(col) + '...'); return; }
            busy = true;
            const a = first, res = mixOf(a, col);
            first = null;
            bowl.innerHTML = drop(res || 'brown');
            bowl.classList.remove('pop'); void bowl.offsetWidth; bowl.classList.add('pop');
            if (res === target) {
              btns.forEach(z => z.classList.remove('picked', 'hint'));
              goal.innerHTML = thing('fish', target);
              PA.audio.sfx('right'); api2.cheer(); sea.ahead();
              await api2.say(`${cap(a)} and ${col} make ${target}! You painted the fish ${target}!`);
              return resolve(misses === 0);
            }
            misses++; PA.audio.sfx('wrong'); sea.closer();
            const what = a === col ? `That's just ${a}.` : res ? `${cap(a)} and ${col} make ${res}.` : `${cap(a)} and ${col} make a muddy colour.`;
            if (misses >= 2) {
              await api2.say(`${what} ${cap(target)} is made from ${x} and ${y}. Tap ${x}, then ${y}.`);
              btns.forEach(z => z.classList.toggle('hint', z.getAttribute('aria-label') === x || z.getAttribute('aria-label') === y));
            } else await api2.say(`${what} We need ${target}. Try again!`);
            bowl.innerHTML = drop(null);
            btns.forEach(z => z.classList.remove('picked'));
            busy = false;
          };
          api2.choices.appendChild(b);
          return b;
        });
      })
    };
  }

  PA.games.push({
    id: 'colours', name: 'Mermaid Colours', icon: '🧜‍♀️', color: '#d4f3ff', maxLevel: 7,
    skill: 'Naming colours, sorting by colour, mixing paint, the rainbow',
    research: 'Naming colours, then sorting things by one attribute (an early maths and logic skill), then hands-on cause and effect with paint: two primary colours make a new one, white makes colours lighter, and the rainbow always comes in the same order. This is the usual order in early-years art and science.',
    levels: ['Find the colour', 'Colour homes', 'What do two colours make?', 'Mix it yourself', 'Mixing homes', 'Lighter colours and brown', 'Rainbow order'],
    tryAtHome: [
      'Mix paints (or food colouring in water) together: what do red and yellow make?',
      'Go on a colour hunt: find five red things in the house.',
      'Sort the washing, the toys or the crayons into colour piles.',
      'Squash two colours of play dough together and see what colour you get.'
    ],
    intro(lvl, api) {
      const sea = scene(api);
      api.stage.style.flexDirection = 'column';
      api.stage.appendChild(sea.el);
      return 'Oh no! A silly shark is chasing the mermaid! Answer the colour questions to help her swim to the beach. ' +
        ['Let\'s find colours!', 'Let\'s help the sea friends get home!', 'Let\'s mix colours!', 'Let\'s mix paint!',
          'Let\'s do mixing magic!', 'Let\'s make lighter colours!', 'Let\'s make a rainbow!'][lvl - 1];
    },
    next(api, i, lvl) {
      if (lvl === 1) return findQ(api);
      if (lvl === 2) return i % 2 ? findQ(api) : homeQ(api);
      if (lvl === 3) return mixQ(api);
      if (lvl === 4) return i % 2 ? mixQ(api) : makeQ(api);
      if (lvl === 5) return i % 2 ? makeQ(api) : mixHomeQ(api);
      if (lvl === 6) return i % 3 === 2 ? mixQ(api) : lightQ(api);
      return i % 3 === 2 ? lightQ(api) : rainbowQ(api);
    },
    // she reaches the land and turns into a princess
    async outro(api) {
      const sea = scene(api);
      api.hideGuide();
      api.stage.style.flexDirection = 'column';
      sea.el.classList.add('big');
      api.stage.appendChild(sea.el);
      await U.wait(60);
      sea.mer.style.left = '74%';
      sea.shark.classList.add('away');
      sea.shark.style.left = '-40%';
      await api.say('You did it! The mermaid swam all the way to the beach! Bye bye, silly shark!');
      if (!api.alive) return;
      const magic = U.el('div', 'magic emoji', '✨');
      sea.mer.appendChild(magic);
      PA.audio.sfx('sparkle');
      await U.wait(900);
      sea.mer.classList.add('human');
      sea.mer.innerHTML = PA.art.princess(Object.assign({}, S.state.profile, { dressColor: U.THEMES.colours.dress }), 'wow');
      PA.audio.sfx('sparkle');
      await api.say('Sparkle, sparkle! Her tail turned into legs! Now she is a princess on the land!');
      await U.wait(500);
    }
  });
})();

</script>
<script>/* js/games/feelings.js */
'use strict';
// FEELINGS: emotion knowledge and simple social problem-solving. Preschool emotion knowledge predicts later
// social skills and school success (Denham and colleagues), and programmes like PATHS and Al's Pals teach it in
// this order: name feelings, read them from situations, link them to causes, then choose a good way to handle them.
// Some answers end with a prompt to talk with a grown-up, because talking it over together is where much of the
// learning happens.
//   1 which face looks <feeling>?      2 a short story: how does she feel?
//   3 why does she feel that way?      4 what's a good thing to do?      5 more feeling words
window.PA = window.PA || {};
PA.games = PA.games || [];
(function () {
  const U = PA.ui;
  const FACES = { happy: '😀', sad: '😢', angry: '😠', scared: '😨', surprised: '😮' };
  const MORE = { tired: '😴', worried: '😟', silly: '🤪', yucky: '🤢' };
  const ALL = Object.assign({}, FACES, MORE);
  // feelings that can honestly overlap are never offered together
  const CLOSE = { surprised: ['happy', 'scared'], happy: ['surprised', 'silly'], scared: ['surprised', 'worried'], angry: [], sad: ['worried', 'tired'], worried: ['scared', 'sad'], tired: ['sad'], silly: ['happy'], yucky: [] };
  const STORIES = [
    ['happy', 'The princess got a birthday present she wanted.'], ['happy', 'Her best friend came over to play.'],
    ['happy', 'She found her lost kitten!'], ['sad', 'Her balloon floated far away.'],
    ['sad', 'Her ice cream fell on the ground.'], ['sad', 'Her friend had to move far away.'],
    ['angry', 'Someone knocked down her tower on purpose.'], ['angry', 'Someone grabbed her toy without asking.'],
    ['scared', 'She heard loud thunder in the night.'], ['scared', 'A big dog barked at her.'],
    ['surprised', 'A frog jumped out of her teacup!'], ['surprised', 'She opened the door and it was snowing!']
  ];
  const MORE_STORIES = [
    ['tired', 'The princess danced all day and stayed up very late.'], ['tired', 'She walked all the way up the tallest tower.'],
    ['worried', 'She can\'t find her mom in the busy shop.'], ['worried', 'Tomorrow is her first day at a new school.'],
    ['silly', 'She put a pancake on her head like a hat!'], ['silly', 'She is wearing her shoes on her hands!'],
    ['yucky', 'She smelled some very stinky old socks.'], ['yucky', 'She stepped in squishy mud with bare feet.']
  ];
  const CAUSES = [
    ['🎁', 'got a present', 'happy'], ['🐶', 'got a new puppy', 'happy'], ['🎈', 'her balloon flew away', 'sad'],
    ['🍦', 'her ice cream fell down', 'sad'], ['⛈️', 'heard loud thunder', 'scared'], ['👻', 'saw a scary shadow', 'scared'],
    ['🧸', 'someone took her toy', 'angry'], ['🧱', 'someone knocked over her tower', 'angry'], ['🐸', 'a frog jumped out', 'surprised']
  ];
  const ACTIONS = [
    { s: 'Someone grabbed the princess\'s toy. She feels angry.', good: ['🗣️', 'Say, please give it back'], bad: [['👊', 'Hit him'], ['🧸', 'Grab it back hard']] },
    { s: 'Her balloon floated away. She feels sad.', good: ['🤗', 'Ask for a hug'], bad: [['🦶', 'Kick the wall'], ['😤', 'Yell at everyone']] },
    { s: 'There is loud thunder at night. She feels scared.', good: ['🙋‍♀️', 'Tell a grown-up'], bad: [['🏃‍♀️', 'Run outside'], ['🙊', 'Keep it a secret']] },
    { s: 'Her puzzle is really tricky. She feels angry.', good: ['🌬️', 'Take a big breath and try again'], bad: [['💥', 'Throw the puzzle'], ['😭', 'Give up forever']] },
    { s: 'Her friend is crying. Her friend feels sad.', good: ['🫂', 'Give her a hug'], bad: [['😂', 'Laugh at her'], ['🚶‍♀️', 'Walk away']] },
    { s: 'Someone pushed in front of her in line. She feels angry.', good: ['🗣️', 'Say, it\'s my turn please'], bad: [['👊', 'Push them back'], ['😤', 'Shout at them']] },
    { s: 'She knocked over her friend\'s tower by accident. Her friend feels sad.', good: ['🙏', 'Say sorry and help fix it'], bad: [['🏃‍♀️', 'Run away'], ['🤷‍♀️', 'Say it wasn\'t me']] },
    { s: 'She wants a turn on the swing, but her friend is on it.', good: ['⏳', 'Ask, can I have a turn next?'], bad: [['👐', 'Pull her off'], ['😤', 'Stomp and shout']] }
  ];
  const TALK = {
    happy: 'Tell your grown-up something that makes you happy!',
    sad: 'What helps you feel better when you are sad? Tell your grown-up.',
    angry: 'When we feel angry, we can take a big breath. Try one now: in... and out.',
    scared: 'What can you do when you feel scared? You can hold a grown-up\'s hand.',
    surprised: 'Make your best surprised face for your grown-up!',
    tired: 'What helps you rest when you feel tired?',
    worried: 'When you feel worried, you can tell a grown-up. Who can you tell?',
    silly: 'Make your silliest face for your grown-up!',
    yucky: 'What is the yuckiest thing you can think of? Tell your grown-up!'
  };

  function faceOpts(answer, pool) {
    const others = U.shuffle(pool.filter(f => f !== answer && CLOSE[answer].indexOf(f) < 0)).slice(0, 2);
    return U.shuffle([answer].concat(others)).map(f => ({ html: `<span class="emoji">${ALL[f]}</span>`, correct: f === answer, aria: f }));
  }
  const princessCard = () => U.tag(U.el('div', 'card prompt-card', '<div style="width:7rem;height:8.4rem">' + PA.art.princess(null, 'happy') + '</div>'), 'princess');

  function facesQ(pool) {
    const f = PA.store.pick('feelings', pool, 1, x => 'face:' + x)[0];
    return {
      key: 'face:' + f,
      prompt: `Which face looks ${f}?`,
      choices: faceOpts(f, pool),
      hint: `This face looks ${f}. Tap it.`,
      praise: U.pick([`Yes! That face looks ${f}.`, `That's right, ${f}!`])
    };
  }
  function storyQ(list, pool, i) {
    const si = PA.store.pick('feelings', list.map((_, k) => k), 1, k => 'story:' + list[k][1])[0];
    const [f, story] = list[si];
    const talk = i % 4 === 2;
    return {
      key: 'story:' + story,
      prompt: `${story} How does she feel?`,
      build(stage) { stage.appendChild(princessCard()); },
      choices: faceOpts(f, pool),
      hint: `${story} I think she feels ${f}. Tap the ${f} face.`,
      praise: `Yes, she feels ${f}. ` + (talk ? TALK[f] : U.pick(['You understood her feelings.', 'Good thinking!']))
    };
  }
  function causeQ() {
    const pool = CAUSES.map((_, k) => k);
    const ci = PA.store.pick('feelings', pool, 1, k => 'cause:' + k)[0];
    const right = CAUSES[ci];
    const others = U.shuffle(CAUSES.filter(c => c[2] !== right[2] && CLOSE[right[2]].indexOf(c[2]) < 0)).slice(0, 2);
    const opts = U.shuffle([right].concat(others));
    return {
      key: 'cause:' + ci,
      prompt: `The princess feels ${right[2]}. What happened? Did she... ${U.listWords(opts.map(o => o[1]))}?`,
      build(stage) { stage.appendChild(U.tag(U.el('div', 'card prompt-card', `<span class="emoji">${FACES[right[2]]}</span><span class="lbl">${right[2]}</span>`), right[2])); },
      choices: opts.map(o => ({ html: `<span class="emoji">${o[0]}</span><span class="lbl">${o[1]}</span>`, cls: 'act', correct: o === right, aria: o[1] })),
      retry: `She feels ${right[2]}. Which one would make you feel ${right[2]}?`,
      hint: `She ${right[1]}. That would make her feel ${right[2]}. Tap it.`,
      praise: `Yes! She ${right[1]}, so she feels ${right[2]}.`
    };
  }
  function actionQ(i) {
    const ai = PA.store.pick('feelings', ACTIONS.map((_, k) => k), 1, k => 'act:' + k)[0];
    const a = ACTIONS[ai];
    const opts = U.shuffle([a.good].concat(a.bad));
    return {
      key: 'act:' + ai,
      prompt: `${a.s} What's a good thing to do? ${U.listWords(opts.map(o => o[1]))}?`,
      build(stage) { stage.appendChild(princessCard()); },
      choices: opts.map(o => ({ html: `<span class="emoji">${o[0]}</span><span class="lbl">${o[1]}</span>`, cls: 'act', correct: o === a.good, aria: o[1] })),
      retry: 'Which one is kind and safe?',
      hint: `${a.good[1]}. That's kind and safe. Tap it.`,
      praise: `Yes! ${a.good[1]}. That's a kind and safe choice.` + (i % 3 === 1 ? ' Can you think of another good idea? Tell your grown-up!' : '')
    };
  }

  PA.games.push({
    id: 'feelings', name: 'Feelings', icon: '💖', color: '#ffe0e6', maxLevel: 5,
    skill: 'Naming feelings, their causes, and kind choices',
    research: 'Recognising emotions, linking them to causes and choosing calm, kind actions follows the sequence used in PATHS-style social-emotional programmes; preschool emotion knowledge predicts later social skills and school success (Denham). Talking it over together is the key part.',
    levels: ['Faces', 'Stories', 'Why does she feel that way?', 'What\'s a good thing to do?', 'More feeling words'],
    tryAtHome: [
      'Name feelings during the day: "You look frustrated. The puzzle is tricky!"',
      'When reading, ask "How do you think she feels? Why? What could she do?"',
      'Make faces in a mirror together: happy, sad, surprised, worried.',
      'Practise "smell the flower, blow out the candle" breathing when calm, so it\'s ready when upset.'
    ],
    intro: lvl => ['Let\'s learn about feelings!', 'Let\'s listen to stories about the princess!', 'Why does the princess feel that way?',
      'Let\'s help the princess make good choices!', 'Let\'s learn some new feeling words!'][lvl - 1],
    next(api, i, lvl) {
      const base = Object.keys(FACES), all = Object.keys(ALL);
      if (lvl === 1) return facesQ(base);
      if (lvl === 2) return storyQ(STORIES, base, i);
      if (lvl === 3) return causeQ();
      if (lvl === 4) return actionQ(i);
      return Math.random() < 0.4 ? facesQ(Object.keys(MORE).concat(['happy', 'sad', 'angry'])) : storyQ(MORE_STORIES.concat(STORIES), all, i);
    }
  });
})();

</script>
<script>/* js/app.js */
'use strict';
// Screens outside the games: start, castle (home), princess maker, sticker book, grown-up gate and grown-up area.
window.PA = window.PA || {};
(function () {
  const U = PA.ui, S = PA.store, A = PA.audio;
  const app = PA.app = {};
  const st = S.state;
  const applySettings = () => { A.rate = st.settings.rate; A.sfxOn = st.settings.sfx; A.setVoice(st.settings.voice); };
  applySettings();

  // ---------- start ----------
  app.start = function () {
    const s = U.el('div', 'screen start');
    s.innerHTML = `<h1>Princess Academy</h1><div class="sub">Learning games for little princesses</div>
      <div class="princess-big">${PA.art.princess(null, 'happy')}</div>`;
    const go = U.go(U.el('button', 'btn', '<span class="emoji">▶️</span> Play'));
    s.appendChild(go);
    go.onclick = () => {
      A.unlock(); A.sfx('sparkle');
      if (!st.profile.made) app.maker(true); else app.home(true);
    };
    U.show(s);
  };

  // ---------- castle ----------
  app.home = function (greet) {
    if (S.timeUp()) return U.rest();
    const s = U.el('div', 'screen');
    const top = U.el('div', 'home-top');
    top.innerHTML = '<div class="title"><span class="emoji">👑</span> Princess Academy</div>';
    const book = U.el('button', 'icon-btn', '<span class="emoji">📖</span>'); book.setAttribute('aria-label', 'Sticker book');
    const dress = U.el('button', 'icon-btn', '<span class="emoji">👗</span>'); dress.setAttribute('aria-label', 'Change my princess');
    const grown = U.el('button', 'icon-btn ghost', '<span class="emoji">⚙️</span>'); grown.setAttribute('aria-label', 'Grown-ups');
    top.append(book, dress, grown);
    const body = U.el('div', 'home-body');
    const n = (st.profile.name || '').trim();
    const pr = U.el('div', 'home-princess', `<div class="hello">Hi${n ? ' ' + n : ''}!</div>${PA.art.princess(null, 'happy')}`);
    const tiles = U.el('div', 'tiles');
    PA.games.forEach(g => {
      const rec = S.game(g.id);
      const t = U.el('button', 'tile');
      const th = U.THEMES[g.id];
      t.innerHTML = `<div class="ico emoji" style="background:${th ? th.bg : g.color}">${g.icon}</div>${th ? `<span class="tale emoji">${th.prop}</span>` : ''}<div class="name">${g.name}</div>
        <div class="lvl"><i style="width:${Math.round(100 * Math.min(rec.level, g.maxLevel) / g.maxLevel)}%"></i></div>`;
      t.setAttribute('aria-label', g.name);
      t.onclick = () => { A.sfx('tap'); if (S.timeUp()) U.rest(); else U.runGame(g); };
      tiles.appendChild(t);
    });
    body.append(pr, tiles);
    s.append(top, body);
    U.show(s);
    book.onclick = () => { A.sfx('tap'); app.stickers(); };
    dress.onclick = () => { A.sfx('tap'); app.maker(false); };
    grown.onclick = () => { A.sfx('tap'); app.gate(app.parent, app.home); };
    pr.onclick = () => A.say(`Hi${n ? ' ' + n : ''}! Pick a game to play.`);
    if (greet) A.say(`Hi${n ? ' ' + n : ''}! Welcome to the castle. Pick a game to play!`);
  };

  // ---------- princess maker ----------
  app.maker = function (first) {
    const p = st.profile;
    const s = U.el('div', 'screen');
    const top = U.el('div', 'topbar');
    const back = U.el('button', 'icon-btn', '<span class="emoji">🏰</span>');
    const done = U.go(U.el('button', 'btn mint small', '<span class="emoji">✅</span> Done'));
    top.append(back, U.el('div', 'game-title', 'Make your princess'), U.el('div', 'spacer'), done);
    const wrap = U.el('div', 'maker');
    const preview = U.el('div', '', PA.art.princess(p, 'happy'));
    const opts = U.el('div', 'opts');
    // one button per thing she can colour; its colours appear underneath (a "none" swatch for the extras)
    const ITEMS = [['👗', 'dress', PA.art.DRESS, 'her dress'], ['💇‍♀️', 'hair', PA.art.HAIR, 'her hair'], ['✋', 'skin', PA.art.SKIN, 'her skin'],
      ['👑', 'crown', PA.art.CROWN, 'her crown'], ['👀', 'eyes', PA.art.EYES, 'her eyes'], ['🎀', 'bow', PA.art.BOW, 'a hair bow'],
      ['📿', 'neck', PA.art.NECK, 'a necklace'], ['🪄', 'wand', PA.art.WAND, 'a magic wand']];
    const tabs = U.el('div', 'item-tabs'), swatches = U.el('div', 'opt-row');
    let cur = 0;
    const showItem = (n, speak) => {
      cur = n;
      const [, key, colors, what] = ITEMS[n];
      tabs.querySelectorAll('.item-tab').forEach((t, i) => t.classList.toggle('on', i === n));
      swatches.innerHTML = '';
      colors.forEach((c, i) => {
        const sw = U.el('button', 'swatch' + ((p[key] || 0) === i ? ' on' : '') + (c ? '' : ' none'), c ? '' : '✕');
        if (c) sw.style.background = c;
        sw.setAttribute('aria-label', c ? 'colour ' + (i + 1) : 'none');
        sw.onclick = () => {
          p[key] = i; S.save(); A.sfx('tap');
          swatches.querySelectorAll('.swatch').forEach(x => x.classList.remove('on')); sw.classList.add('on');
          preview.innerHTML = PA.art.princess(p, 'wow');
          if (Math.random() < 0.35) A.say(c ? U.pick(['Pretty!', 'Beautiful!', 'Ooh, lovely!']) : 'No ' + what.replace(/^(her|a) /, '') + '.');
        };
        swatches.appendChild(sw);
      });
      if (speak) A.say(`Pick a color for ${what}!`);
    };
    ITEMS.forEach(([icon, key], i) => {
      const t = U.el('button', 'item-tab emoji', icon);
      t.setAttribute('aria-label', key);
      U.tag(t, key);
      t.onclick = () => { A.sfx('tap'); showItem(i, true); };
      tabs.appendChild(t);
    });
    showItem(0, false);
    opts.append(tabs, swatches);
    wrap.append(preview, opts);
    s.append(top, wrap);
    U.show(s);
    const finish = () => { p.made = true; S.save(); A.sfx('sparkle'); app.home(true); };
    done.onclick = finish;
    back.onclick = finish;
    A.say(first ? 'Hello! Let\'s make your princess. Tap a button on top, like the dress or the crown, then pick a color. When you are done, tap the green button.'
      : 'Change your princess! Tap a button on top, then pick a color.');
  };

  // ---------- sticker book ----------
  app.stickers = function () {
    const s = U.el('div', 'screen scroll');
    const top = U.el('div', 'topbar');
    const back = U.el('button', 'icon-btn', '<span class="emoji">🏰</span>');
    top.append(back, U.el('div', 'game-title', 'My sticker book'));
    const grid = U.el('div', 'sticker-book');
    const list = st.stickers.slice().reverse();
    const slots = Math.max(12, Math.ceil((list.length + 1) / 6) * 6);
    for (let i = 0; i < slots; i++) grid.appendChild(U.el('div', 'st emoji' + (i < list.length ? '' : ' empty'), list[i] || ''));
    s.append(top, grid);
    U.show(s);
    back.onclick = () => app.home();
    const k = list.length;
    A.say(k ? `You have ${k} sticker${k === 1 ? '' : 's'}! Play a game to earn more.` : 'Play a game to earn your first sticker!');
  };

  // ---------- grown-up gate (a number written in words: easy for adults, not for pre-readers) ----------
  const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
  app.gate = function (onPass, onCancel) {
    const tens = U.rand(2, 9), ones = U.rand(1, 9), target = String(tens * 10 + ones);
    const s = U.el('div', 'screen');
    const g = U.el('div', 'gate');
    g.innerHTML = `<div class="mid-msg">Grown-ups only</div><div class="q">Type the number<br>${TENS[tens]}-${U.NUM_WORDS[ones]}</div>`;
    const entry = U.el('div', 'entry', '&nbsp;');
    const pad = U.el('div', 'keypad');
    let typed = '';
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '✕', '0', '⌫'];
    keys.forEach(k => {
      const b = U.el('button', '', k);
      b.onclick = () => {
        if (k === '✕') return (onCancel || app.home)();
        if (k === '⌫') typed = typed.slice(0, -1); else if (typed.length < 2) typed += k;
        entry.textContent = typed || ' ';
        if (typed.length === 2) {
          if (typed === target) onPass(); else setTimeout(() => app.gate(onPass, onCancel), 400);
        }
      };
      pad.appendChild(b);
    });
    g.append(entry, pad);
    s.appendChild(g);
    U.show(s);
  };

  // ---------- grown-up area ----------
  app.parent = function () {
    const s = U.el('div', 'screen scroll');
    const p = U.el('div', 'parent');
    const top = U.el('div', 'topbar');
    const back = U.el('button', 'icon-btn', '<span class="emoji">🏰</span>');
    top.append(back, U.el('div', 'game-title', 'Grown-ups'));
    p.appendChild(top);

    // settings
    const set = U.el('div', 'panel');
    set.innerHTML = `<h3>Settings</h3>
      <label>Child's name (said out loud) <input type="text" id="pName" maxlength="20" autocomplete="off" autocorrect="off" spellcheck="false"></label>
      <label>Play time per day <select id="pLimit"><option value="0">No limit</option><option value="10">10 minutes</option><option value="15">15 minutes</option><option value="20">20 minutes</option><option value="30">30 minutes</option><option value="45">45 minutes</option></select></label>
      <label>Questions per round <select id="pLen"><option value="5">5 (short)</option><option value="10">10</option><option value="15">15 (long)</option></select></label>
      <label>Voice <span><select id="pVoice"></select> <button type="button" class="chip" id="pTest">▶ Test</button></span></label>
      <div class="muted" id="pVoiceTip"></div>
      <label>Voice speed <select id="pRate"><option value="0.8">Slow</option><option value="0.9">Normal</option><option value="1">Faster</option></select></label>
      <label>Sound effects <select id="pSfx"><option value="1">On</option><option value="0">Off</option></select></label>
      <div class="muted" id="pToday"></div>`;
    p.appendChild(set);
    const $ = id => set.querySelector('#' + id);
    $('pName').value = st.profile.name || '';
    $('pLimit').value = String(st.settings.limitMin);
    $('pRate').value = String(st.settings.rate);
    $('pLen').value = String(st.settings.roundLen || 10);
    $('pLen').onchange = e => { st.settings.roundLen = Number(e.target.value); S.save(); };
    $('pSfx').value = st.settings.sfx ? '1' : '0';
    $('pName').oninput = e => { st.profile.name = e.target.value.slice(0, 20); S.save(); };
    $('pLimit').onchange = e => { st.settings.limitMin = Number(e.target.value); S.save(); };
    $('pRate').onchange = e => { st.settings.rate = Number(e.target.value); S.save(); applySettings(); A.say('This is how fast I will talk.'); };
    // voices: best-sounding first; Enhanced / Premium / Natural voices are much smoother than the built-in compact ones
    const fillVoices = () => {
      const sel = $('pVoice'), list = A.voices(), cur = A.currentVoice();
      const nice = v => /premium|enhanced|natural|neural|online/i.test(v.name + ' ' + v.voiceURI);
      const esc = x => String(x).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
      const label = v => v.name.replace(/ *\(.*\)/, '') + ' (' + A.accent(v) + ')' + (nice(v) && !A.isIOS ? ' ★' : '');
      sel.innerHTML = '<option value="">Automatic' + (cur ? ': ' + esc(label(cur)) : '') + '</option>' +
        list.map(v => '<option value="' + esc(A.voiceKey(v)) + '">' + esc(label(v)) + '</option>').join('');
      sel.value = list.some(v => A.voiceKey(v) === st.settings.voice) ? st.settings.voice : '';
      const now = A.currentVoice();
      $('pVoiceTip').innerHTML = (now ? 'Speaking with: <b>' + esc(label(now)) + '</b>. ' : 'No voice found yet. ') + (A.isIOS
        ? 'On iPad and iPhone, web pages can only use one voice per accent, so only those are listed (for American English it is always Samantha; downloaded voices like Ava can\'t be used by web pages). For a smoother Samantha, try downloading <b>Samantha (Enhanced)</b>: Settings, Accessibility, Spoken Content, Voices, English.'
        : list.some(nice) ? 'Voices marked ★ are the smooth, natural ones.'
        : 'For a more natural voice, install an Enhanced or Natural English voice in this device\'s speech settings; it is picked automatically.');
    };
    fillVoices(); A.onVoices = fillVoices;
    const SAMPLE = "Hello! Let's count the princess's jewels: one, two, three. Which one rhymes with cat? Hat, sun, or dog?";
    $('pVoice').onchange = e => { st.settings.voice = e.target.value; S.save(); applySettings(); fillVoices(); A.say(SAMPLE); };
    $('pTest').onclick = () => A.say(SAMPLE);
    $('pSfx').onchange = e => { st.settings.sfx = e.target.value === '1'; S.save(); applySettings(); };
    const today = new Date(st.play.windowStart).toDateString() === new Date().toDateString();
    const mins = today ? Math.round(st.play.ms / 60000) : 0;
    $('pToday').textContent = `Played today: about ${mins} minute${mins === 1 ? '' : 's'}. The limit is checked at the end of each round, so a game is never cut off mid-question.`;

    // progress
    const prog = U.el('div', 'panel');
    let rows = '';
    PA.games.forEach(g => {
      const r = S.game(g.id);
      const recent = r.recent.slice(-5);
      const avg = recent.length ? Math.round(recent.reduce((a, x) => a + x, 0) / recent.length) : null;
      const lv = Math.min(r.level, g.maxLevel);
      const ramp = Math.round(S.challenge(g.id) * 100);
      const opts = g.levels.map((name, i) => `<option value="${i + 1}"${i + 1 === lv ? ' selected' : ''}>${i + 1}. ${name}</option>`).join('');
      rows += `<tr><td><span class="emoji">${g.icon}</span> <b>${g.name}</b><div class="muted">${g.skill}</div></td>
        <td>Level ${lv} of ${g.maxLevel}<div class="muted">${g.levels[lv - 1]}</div>${lv < g.maxLevel ? `<div class="muted">Next: ${g.levels[lv]}</div>` : ''}
          <label class="muted lvl-set">Jump to <select data-g="${g.id}">${opts}</select></label></td>
        <td class="hide-sm">${r.rounds}<div class="muted">+${ramp}% harder${ramp ? ` <a href="#" data-ramp="${g.id}">reset</a>` : ''}</div></td>
        <td>${avg == null ? '<span class="muted">not played</span>' : `<div class="bar"><i style="width:${avg}%"></i></div><span class="muted">${avg}% first try</span>`}</td></tr>`;
    });
    const un = PA.sounds.unlocked();
    const chips = PA.sounds.ORDER.map((ch, i) => {
      const key = 'ltr:' + ch, rec = S.game('sounds').items[key];
      const ok = rec && rec[0] >= 3 && S.itemScore('sounds', key) >= 0.75;
      return `<span class="chip ${i < un ? (ok ? 'ok' : 'learning') : ''}">${ch}</span>`;
    }).join('');
    prog.innerHTML = `<h3>Progress</h3>
      <table><tr><th>Game</th><th>Level</th><th class="hide-sm">Rounds</th><th>Last 5 rounds</th></tr>${rows}</table>
      <h3>Letters</h3><div class="chips">${chips}</div>
      <div class="muted">Green: solid. Yellow: learning now. Grey: not yet. A new letter unlocks when all the current ones are solid.</div>
      <p class="muted">Levels go up after two strong rounds (80%+ right on the first try) or one perfect round, and down after a hard round, which keeps her near the "just right" challenge. Use <b>Jump to</b> if she already knows a level (for example, she counts to 10 well: jump Gem Counting to level 11).</p>
