<style>
/* Princess Academy. Built for an iPad mini 4 (Safari / iPadOS 15): no :has, no dvh, no dialog element.
   Everything is sized in rem. app.js sets the root font size from the screen size, so the whole app scales to fit
   any phone or tablet, upright or sideways (1rem = 16px on an iPad held sideways). */
:root {
  --pink: #ff6fae;
  --pink-soft: #ffd6ea;
  --purple: #8a5cf6;
  --purple-soft: #e6dcff;
  --gold: #ffc93c;
  --mint: #5fd3a8;
  --ink: #4a2b5e;
  --ink-soft: #7b6690;
  --card: #ffffff;
  --shadow: 0 .375rem 0 rgba(90, 40, 120, .16), 0 .625rem 1.5rem rgba(90, 40, 120, .14);
  --ui-font: 'Baloo 2', 'Chalkboard SE', 'Avenir Next Rounded', 'Comic Sans MS', system-ui, sans-serif;
  --letter-font: 'Andika', 'Avenir Next', 'Century Gothic', system-ui, sans-serif;
  --emoji-font: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; }
html, body {
  margin: 0; height: 100%; overflow: hidden; position: fixed; width: 100%;
  background: #ffe3f1; color: var(--ink); font-family: var(--ui-font);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation; overscroll-behavior: none; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
input, select { font: inherit; }

#app { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
.screen {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, #ffd1ea 0%, #e3d4ff 55%, #c9ecff 100%);
  padding: max(.75rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(.75rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
  animation: fadeIn .25s ease-out;
}
.screen.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------- common bits ---------- */
.emoji { font-family: var(--emoji-font); line-height: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .6rem;
  min-height: 4.5rem; padding: 0 1.9rem; border-radius: 2.5rem;
  background: var(--pink); color: #fff; font-size: 1.9rem; font-weight: 800;
  box-shadow: 0 .375rem 0 #d94b8c, 0 .6rem 1.25rem rgba(217, 75, 140, .3);
  transition: transform .08s;
}
.btn:active { transform: translateY(.25rem); box-shadow: 0 .125rem 0 #d94b8c; }
.btn.purple { background: var(--purple); box-shadow: 0 .375rem 0 #6a3fd1, 0 .6rem 1.25rem rgba(106, 63, 209, .3); }
.btn.mint { background: var(--mint); box-shadow: 0 .375rem 0 #34a57c, 0 .6rem 1.25rem rgba(52, 165, 124, .3); }
.btn.white { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
.btn.small { min-height: 3.4rem; font-size: 1.4rem; padding: 0 1.4rem; }
.icon-btn {
  width: 4.25rem; height: 4.25rem; border-radius: 50%; flex: none;
  background: #fff; box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center; font-size: 2.25rem;
}
.icon-btn:active { transform: translateY(.2rem); }
.icon-btn.ghost { background: rgba(255, 255, 255, .55); box-shadow: none; width: 3.25rem; height: 3.25rem; font-size: 1.6rem; }

/* ---------- start screen ---------- */
.start { align-items: center; justify-content: center; text-align: center; }
.start h1 { font-size: 4rem; margin: 0 0 .25rem; color: var(--pink); text-shadow: 0 .25rem 0 #fff; line-height: 1; }
.start .sub { font-size: 1.5rem; color: var(--ink-soft); margin-bottom: 1rem; }
.start .princess-big { width: 16rem; height: 18.75rem; animation: bob 2.4s ease-in-out infinite; }
.start .princess-big svg { width: 100%; height: 100%; }
.start .btn { margin-top: 1.1rem; font-size: 2.5rem; min-height: 6rem; padding: 0 3.5rem; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.6rem); } }

/* ---------- home / castle ---------- */
.home-top { display: flex; align-items: center; gap: .75rem; flex: none; }
.home-top .title { flex: 1; font-size: 2.5rem; font-weight: 800; color: var(--pink); text-shadow: 0 .2rem 0 #fff; line-height: 1; }
.home-body { flex: 1; display: flex; align-items: center; gap: 1rem; min-height: 0; }
.home-princess { width: 12.5rem; flex: none; display: flex; flex-direction: column; align-items: center; }
.home-princess svg { width: 11.9rem; height: 14.4rem; }
.home-princess .hello { font-size: 1.4rem; font-weight: 700; text-align: center; color: var(--ink); background: #fff; border-radius: 1.25rem; padding: .4rem .9rem; box-shadow: var(--shadow); margin-bottom: .4rem; }
.tiles { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; align-content: center; }
.tile {
  position: relative; background: #fff; border-radius: 1.9rem; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: .9rem .4rem .75rem; min-height: 10rem;
}
.tile:active { transform: translateY(.25rem); }
.tile .ico { font-size: 4rem; width: 6rem; height: 6rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.tile .name { font-size: 1.3rem; font-weight: 800; margin-top: .4rem; text-align: center; line-height: 1.05; }
.tile .lvl { width: 70%; height: .5rem; border-radius: .25rem; background: #f3ecfa; margin-top: .45rem; overflow: hidden; }
.tile .lvl i { display: block; height: 100%; background: var(--gold); border-radius: .25rem; }

@media (orientation: portrait) {
  .home-top .title { font-size: 2rem; }
  .home-body { flex-direction: column; justify-content: center; }
  .home-princess { width: auto; flex-direction: row; gap: .6rem; }
  .home-princess svg { width: 8rem; height: 10rem; }
  .tiles { grid-template-columns: repeat(3, 1fr); width: 100%; flex: none; }
}

/* ---------- game screen ---------- */
.topbar { display: flex; align-items: center; gap: .75rem; flex: none; }
.topbar .spacer { flex: 1; }
.game-title { font-size: 1.6rem; font-weight: 800; color: var(--ink); white-space: nowrap; }
.progress { flex: 1; height: 1.4rem; border-radius: .7rem; background: rgba(255, 255, 255, .7); border: .2rem solid #fff; position: relative; max-width: 30rem; margin-left: auto; }
.progress i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: .7rem; background: linear-gradient(90deg, #ffd96b, var(--gold)); transition: width .4s; }
.progress b { position: absolute; top: 50%; font-size: 1.9rem; transform: translate(-50%, -52%); transition: left .4s; font-weight: 400; }
@media (orientation: portrait) { .game-title { display: none; } }

.play { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4rem; min-height: 0; position: relative; }
.fitbox { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4rem; width: 100%; flex: none; transform-origin: 50% 50%; }
.stage { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: .9rem; max-width: 100%; }
.choices { display: flex; align-items: stretch; justify-content: center; flex-wrap: wrap; gap: 1.4rem; }
.banner { position: absolute; top: 0; left: 50%; transform: translateX(-50%); background: var(--gold); color: #6b4700; font-weight: 800; font-size: 1.3rem; padding: .2rem 1.1rem; border-radius: 1rem; box-shadow: var(--shadow); white-space: nowrap; z-index: 2; }

.card {
  background: var(--card); border-radius: 1.9rem; box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center; flex-direction: column;
}
.choice {
  width: 10.6rem; height: 10.6rem; font-size: 6rem;
  transition: transform .12s, opacity .2s;
}
.choice:active { transform: scale(.95); }
.choice .lbl { font-size: 1.15rem; font-weight: 700; margin-top: .3rem; font-family: var(--ui-font); line-height: 1.1; padding: 0 .4rem; text-align: center; }
.choice.num { font-size: 6.5rem; font-weight: 800; font-family: var(--letter-font); color: var(--purple); }
.choice.letter { font-size: 7.5rem; font-family: var(--letter-font); color: var(--pink); font-weight: 700; }
.choice.word { width: 13rem; height: 7.5rem; font-size: 3.8rem; font-family: var(--letter-font); color: var(--purple); font-weight: 700; }
.choice.act { width: 12rem; height: 12rem; font-size: 4.5rem; }
.choice.wide { width: auto; min-width: 14rem; height: auto; min-height: 10.6rem; padding: .9rem; font-size: 2.6rem; }
.choice.wrong { opacity: .35; animation: shake .35s; pointer-events: none; }
.choice.hint { animation: glow 1s ease-in-out infinite; }
.choice.right { animation: pop .45s; box-shadow: 0 0 0 .5rem var(--mint), var(--shadow); }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-.6rem); } 75% { transform: translateX(.6rem); } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 .25rem var(--gold), var(--shadow); } 50% { box-shadow: 0 0 0 .9rem var(--gold), var(--shadow); } }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

.prompt-card { padding: .9rem 1.6rem; font-size: 6.9rem; min-width: 10.6rem; min-height: 10rem; }
.prompt-card .lbl { font-size: 1.6rem; font-weight: 700; font-family: var(--ui-font); }
.prompt-card.letter { font-family: var(--letter-font); color: var(--pink); font-size: 8.75rem; font-weight: 700; line-height: 1; }
.prompt-card.word { font-family: var(--letter-font); color: var(--purple); font-size: 6rem; font-weight: 700; line-height: 1.1; letter-spacing: .3rem; }

.guide { position: absolute; left: 0; bottom: 0; width: 7.5rem; height: 9rem; pointer-events: none; }
.guide svg { width: 100%; height: 100%; }
.guide.cheer { animation: jump .5s; }
@keyframes jump { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-1.6rem); } }

@media (orientation: portrait) {
  .guide { width: 5.5rem; height: 6.6rem; }
  .choice { width: 9.5rem; height: 9.5rem; font-size: 5.4rem; }
  .choice.act { width: 10.5rem; height: 11rem; font-size: 4rem; }
  .choice.word { width: 11rem; }
}

/* ---------- overlay (questions on top of a board) ---------- */
.overlay { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(74, 43, 94, .35); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; z-index: 5; border-radius: 1.9rem; animation: fadeIn .2s; }

/* ---------- counting ---------- */
.gems { display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: .6rem; padding: 1.1rem 1.4rem; max-width: 35rem; }
.gem { width: 4.75rem; height: 4.75rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3.4rem; position: relative; transition: opacity .4s, transform .4s; }
.gem.sm { width: 3rem; height: 3rem; font-size: 2.2rem; }
.gem.counted { background: var(--pink-soft); }
.gem.counted::after { content: attr(data-n); position: absolute; right: -.25rem; top: -.4rem; background: var(--purple); color: #fff; font-size: 1.1rem; font-weight: 800; border-radius: .75rem; min-width: 1.6rem; height: 1.6rem; display: flex; align-items: center; justify-content: center; font-family: var(--ui-font); }
.gem.eaten { opacity: .2; transform: scale(.7) rotate(-20deg); }
.gem.arrive { animation: arrive .7s ease-out; }
.gem.hidden-gem { background: #eef6ff; outline: .15rem dashed #9cc7ff; }
@keyframes arrive { 0% { transform: translateY(-4rem) scale(.2); opacity: 0; } 100% { transform: none; opacity: 1; } }
.tenframe { display: grid; grid-template-columns: repeat(5, 4.75rem); gap: .5rem; padding: 1rem; }
.tenframe .slot { width: 4.75rem; height: 4.75rem; border-radius: 1.1rem; background: #f4ecff; display: flex; align-items: center; justify-content: center; }
.dice { position: relative; width: 15rem; height: 15rem; }
.dice .gem { position: absolute; transform: translate(-50%, -50%); }
.flash-cover { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 1.9rem; background: linear-gradient(135deg, #fff 0%, #f1e8ff 100%); display: flex; align-items: center; justify-content: center; font-size: 6.9rem; }
.cloud { font-size: 6rem; padding: 0 .5rem; position: relative; }
.plus { font-size: 3.5rem; font-weight: 800; color: var(--purple); }
.story-line { font-size: 1.6rem; font-weight: 700; color: var(--ink); text-align: center; max-width: 40rem; }

.crown-zone { min-width: 32rem; max-width: 100%; min-height: 7.5rem; padding: .9rem 1.25rem; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: .4rem; border: .25rem dashed var(--pink); background: rgba(255, 255, 255, .7); }
.crown-zone .gem { width: 4.1rem; height: 4.1rem; font-size: 3rem; }
.pile { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; max-width: 39rem; }
.pile .gem { background: #fff; box-shadow: var(--shadow); }
.pile .gem.gone { visibility: hidden; }
.give-big { font-family: var(--letter-font); font-size: 4rem; font-weight: 700; color: var(--purple); line-height: 1; }
@media (orientation: portrait) { .crown-zone { min-width: 0; width: 100%; } }

/* ---------- castle path ---------- */
.board-wrap { display: flex; align-items: flex-start; gap: .4rem; }
.board { display: grid; grid-template-columns: repeat(10, var(--sq)); grid-auto-rows: var(--sq); gap: .4rem; --sq: 5.2rem; }
.board-wrap .start-sq { width: var(--sq); height: var(--sq); --sq: 5.2rem; }
@media (orientation: portrait) {
  .board-wrap { flex-direction: column; align-items: center; }
  .board { grid-template-columns: repeat(5, var(--sq)); --sq: 5.6rem; }
  .board.thirty { --sq: 4.6rem; }
  .board-wrap .start-sq { --sq: 4.6rem; }
}
.sq {
  position: relative; border-radius: 1rem; background: #fff; box-shadow: 0 .25rem 0 rgba(90, 40, 120, .15);
  display: flex; align-items: flex-end; justify-content: center; font-family: var(--letter-font); font-weight: 700; color: var(--purple);
}
.sq .n { font-size: 1.6rem; padding-bottom: .1rem; }
.sq.next { animation: glow 1s ease-in-out infinite; }
.sq.castle { background: #fff5c7; }
.sq.star { background: #fff0fa; }
.sq .star-ic { position: absolute; top: .2rem; font-size: 1.4rem; opacity: .7; }
.sq .tok { position: absolute; top: .15rem; width: 48%; height: 48%; display: flex; align-items: center; justify-content: center; transition: transform .2s; }
.sq .tok svg { width: 100%; height: 100%; }
.sq .tok.me { left: .15rem; }
.sq .tok.uni { right: .15rem; font-size: 2.1rem; }
.sq .tok.me.solo, .sq .tok.uni.solo { left: 26%; right: auto; }
.start-sq { background: rgba(255, 255, 255, .5); }
.path-ctl { display: flex; align-items: center; gap: 1.5rem; }
.spinner { width: 9.4rem; height: 9.4rem; border-radius: 1.9rem; background: #fff; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.spinner .face { font-family: var(--letter-font); font-size: 4.75rem; font-weight: 700; color: var(--pink); line-height: 1; }
.spinner.spin { animation: spin .7s ease-out; }
@keyframes spin { from { transform: rotate(0); } to { transform: rotate(720deg); } }
.spinner .num-under { font-family: var(--letter-font); font-size: 1.6rem; font-weight: 700; color: var(--purple); }
.pips { display: grid; grid-template-columns: repeat(3, 1.6rem); grid-template-rows: repeat(3, 1.6rem); gap: .3rem; }
.pips span { border-radius: 50%; }
.pips span.on { background: var(--pink); }
.turn-lbl { font-size: 1.75rem; font-weight: 800; min-width: 12rem; text-align: center; }

/* ---------- letters & words ---------- */
.slots { display: flex; gap: .75rem; }
.slots .slot { width: 6.5rem; height: 7.5rem; border-radius: 1.25rem; background: rgba(255, 255, 255, .7); border: .25rem dashed var(--pink); display: flex; align-items: center; justify-content: center; font-family: var(--letter-font); font-size: 5rem; font-weight: 700; color: var(--pink); }
.slots .slot.filled { background: #fff; border-style: solid; animation: pop .35s; }
.slots .slot.next { animation: glow 1s ease-in-out infinite; }
.tiles-row { display: flex; gap: .9rem; flex-wrap: wrap; justify-content: center; }
.ltile { width: 6.5rem; height: 6.5rem; font-family: var(--letter-font); font-size: 4.4rem; font-weight: 700; color: var(--purple); }
.ltile.used { visibility: hidden; }

/* ---------- rhymes & claps ---------- */
.drum { width: 12rem; height: 12rem; font-size: 7.5rem; border-radius: 50%; }
.drum:active, .drum.hit { transform: scale(.92); }
.clap-dots { display: flex; gap: .6rem; min-height: 2.6rem; align-items: center; }
.clap-dots span { width: 2.2rem; height: 2.2rem; border-radius: 50%; background: var(--pink); animation: pop .3s; }
.memory { display: grid; grid-template-columns: repeat(var(--cols), 8.6rem); gap: .9rem; }
.mcard { width: 8.6rem; height: 8.6rem; border-radius: 1.4rem; font-size: 4.9rem; background: linear-gradient(135deg, #ff9fcd, #b78bff); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; transition: transform .2s; }
.mcard.up { background: #fff; }
.mcard.matched { background: #eafff6; box-shadow: 0 0 0 .35rem var(--mint), var(--shadow); }
.mcard .back { font-size: 3rem; opacity: .8; }
@media (orientation: portrait) {
  .memory { grid-template-columns: repeat(var(--pcols), 8rem); }
  .mcard { width: 8rem; height: 8rem; }
}

/* ---------- patterns ---------- */
.necklace { display: flex; flex-direction: row; align-items: center; gap: .5rem; padding: 1.1rem 1.5rem; flex-wrap: wrap; justify-content: center; max-width: 100%; }
.bead { width: 5.2rem; height: 5.2rem; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 3.7rem; box-shadow: 0 .25rem 0 rgba(90, 40, 120, .12); }
.bead.blank { border: .3rem dashed var(--pink); background: #fff7fb; font-size: 3.1rem; color: var(--pink); font-family: var(--ui-font); font-weight: 800; }
.bead.filled { animation: pop .45s; }
.bead.next { animation: glow 1s ease-in-out infinite; }
.group { display: flex; flex-wrap: wrap; gap: .1rem; justify-content: center; align-content: center; max-width: 7rem; font-size: 1.9rem; }
.group-card { padding: .9rem; min-width: 7.5rem; min-height: 8.5rem; }
.palette { display: flex; gap: 1.1rem; }
.palette .bead { width: 6.5rem; height: 6.5rem; font-size: 4.6rem; box-shadow: var(--shadow); }

/* ---------- shapes ---------- */
.shape-field { position: relative; width: 52rem; max-width: 100%; height: 27.5rem; }
.shape-field .shp { position: absolute; display: flex; align-items: center; justify-content: center; }
.shape-field .shp svg { width: 88%; height: 88%; overflow: visible; }
.shape-field .shp.found svg { filter: drop-shadow(0 0 .5rem #4ad79d); }
.shape-field .shp.found::after { content: '\2714'; position: absolute; top: 0; right: 8%; width: 2.25rem; height: 2.25rem; border-radius: 50%; background: var(--mint); color: #fff; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; }
.shape-field .shp.nope { animation: shake .35s; opacity: .4; }
.shape-field .shp.hint svg { animation: pop 1s infinite; }
.found-count { font-size: 1.75rem; font-weight: 800; }
.corner-shape { width: 19rem; height: 19rem; padding: 1rem; }
.corner-shape svg { width: 100%; height: 100%; overflow: visible; }
.corner-shape .corner { cursor: pointer; }
.build { width: 30rem; height: 24rem; padding: .8rem; }
.build svg { width: 100%; height: 100%; overflow: visible; }
.shape-ic svg { width: 6.5rem; height: 6.5rem; overflow: visible; }
@media (orientation: portrait) {
  .shape-field { width: 100%; height: auto; aspect-ratio: 1 / 1.05; }
  .build { width: 100%; max-width: 30rem; height: auto; aspect-ratio: 5 / 4; }
}

/* ---------- reward / rest ---------- */
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1rem; }
.reward-sticker { font-size: 9.4rem; animation: pop .6s, bob 2.4s ease-in-out .6s infinite; }
.big-msg { font-size: 2.75rem; font-weight: 800; color: var(--pink); line-height: 1.1; }
.mid-msg { font-size: 1.6rem; font-weight: 700; color: var(--ink-soft); }
.tip { font-size: 1.15rem; max-width: 40rem; color: var(--ink-soft); }
.row { display: flex; gap: 1.25rem; align-items: center; justify-content: center; flex-wrap: wrap; }
.confetti { position: absolute; top: -2.5rem; font-size: 2.1rem; animation: fall 2.4s linear forwards; pointer-events: none; }
@keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

/* ---------- stickers ---------- */
.sticker-book { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.5rem, 1fr)); gap: .9rem; padding: 1.1rem 0; }
.sticker-book .st { aspect-ratio: 1; border-radius: 1.5rem; background: #fff; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; font-size: 4rem; }
.sticker-book .st.empty { background: rgba(255, 255, 255, .45); box-shadow: none; border: .2rem dashed rgba(138, 92, 246, .35); }

/* ---------- princess maker ---------- */
.maker { flex: 1; display: flex; align-items: center; justify-content: center; gap: 1.9rem; min-height: 0; }
.maker svg.pr { width: 18.75rem; height: 22.5rem; flex: none; }
.maker .opts { display: flex; flex-direction: column; gap: 1.1rem; }
.opt-row { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
.opt-row .lab { font-size: 2.6rem; width: 3.75rem; text-align: center; }
.swatch { width: 4.1rem; height: 4.1rem; border-radius: 50%; border: .3rem solid #fff; box-shadow: var(--shadow); }
.swatch.on { border-color: var(--ink); transform: scale(1.1); }
@media (orientation: portrait) { .maker { flex-direction: column; } .maker svg.pr { width: 14.4rem; height: 17rem; } }

/* ---------- grown-ups (kept at readable fixed sizes) ---------- */
.gate { max-width: 460px; margin: 0 auto; text-align: center; padding-top: 20px; }
.gate .q { font-size: 28px; font-weight: 800; margin: 10px 0; }
.gate .mid-msg { font-size: 22px; }
.gate .entry { font-size: 44px; font-weight: 800; min-height: 60px; letter-spacing: 6px; color: var(--purple); }
.keypad { display: grid; grid-template-columns: repeat(3, 84px); gap: 12px; justify-content: center; }
.keypad button { height: 68px; border-radius: 20px; background: #fff; box-shadow: 0 5px 0 rgba(90, 40, 120, .16); font-size: 30px; font-weight: 800; }
.parent { max-width: 900px; margin: 0 auto; padding-bottom: 40px; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 1.45; }
.parent .game-title { display: block; font-size: 26px; }
.parent .icon-btn { width: 56px; height: 56px; font-size: 28px; }
.parent h3 { margin: 14px 0 4px; font-size: 18px; }
.parent .panel { background: #fff; border-radius: 18px; padding: 14px 18px; box-shadow: 0 4px 16px rgba(90, 40, 120, .1); margin: 12px 0; }
.parent label { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #f0e8f7; flex-wrap: wrap; }
.parent label:last-child { border-bottom: 0; }
.parent input[type=text], .parent select { font-size: 16px; padding: 8px 10px; border-radius: 10px; border: 1px solid #d9c9ea; background: #fff; min-width: 170px; }
.parent table { width: 100%; border-collapse: collapse; }
.parent td, .parent th { text-align: left; padding: 7px 6px; border-bottom: 1px solid #f0e8f7; vertical-align: top; }
.parent th { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
.bar { height: 10px; border-radius: 5px; background: #f0e8f7; overflow: hidden; min-width: 70px; }
.bar i { display: block; height: 100%; background: var(--mint); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--letter-font); font-size: 17px; font-weight: 700; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; background: #f0e8f7; color: var(--ink-soft); }
.chip.ok { background: #d5f5e8; color: #1f7a56; }
.chip.learning { background: #fff1c7; color: #8a6400; }
.parent .muted { color: var(--ink-soft); font-size: 14px; }
.parent ul, .parent ol { margin: 6px 0; padding-left: 20px; }
.parent li { margin: 3px 0; }
.danger { background: #fff; color: #c23b6d; border: 2px solid #f3b6cd; border-radius: 14px; padding: 10px 16px; font-weight: 700; font-family: system-ui, sans-serif; font-size: 15px; }
@media (max-width: 600px) { .parent table .hide-sm { display: none; } }

/* ---------- the button to press next glows (a soft gold ring that breathes) ---------- */
.btn.go, .spinner.go { position: relative; }
.btn.go::after, .spinner.go::after {
  content: ''; position: absolute; top: -.45rem; right: -.45rem; bottom: -.45rem; left: -.45rem; border-radius: inherit; pointer-events: none;
  box-shadow: 0 0 0 .3rem var(--gold), 0 0 1.4rem .5rem rgba(255, 201, 60, .75);
  animation: goRing 1.3s ease-in-out infinite;
}
@keyframes goRing { 0%, 100% { opacity: .35; transform: scale(.98); } 50% { opacity: 1; transform: scale(1.03); } }
.btn:active, .spinner:active, .icon-btn:active { filter: brightness(1.1) drop-shadow(0 0 .7rem rgba(255, 201, 60, .95)); }
.spinner:disabled, .btn:disabled { filter: grayscale(.4); opacity: .7; }

/* ---------- light up what the voice is naming ---------- */
@keyframes sayFlash {
  0% { transform: scale(1); filter: none; }
  35% { transform: scale(1.17); filter: brightness(1.12) drop-shadow(0 0 .6rem #ffc93c) drop-shadow(0 0 .25rem #ffc93c); }
  100% { transform: scale(1); filter: none; }
}
.say-flash { animation: sayFlash .7s ease-out !important; transform-origin: center; transform-box: fill-box; z-index: 1; }
@keyframes talk { from { box-shadow: 0 0 0 0 rgba(255, 201, 60, 0), var(--shadow); } to { box-shadow: 0 0 0 .45rem rgba(255, 201, 60, .9), var(--shadow); } }
.speaking .say-btn { animation: talk .45s ease-in-out infinite alternate; }

/* ---------- counting past ten ---------- */
.frames { display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: 1rem; }
.gem.ghost { opacity: .22; }
.gem.ghost.counted { opacity: 1; }
.track { display: flex; flex-direction: row; gap: .5rem; padding: 1rem 1.2rem; flex-wrap: wrap; justify-content: center; }
.tsq { width: 5.8rem; height: 5.8rem; border-radius: 1.1rem; background: #f6f0ff; display: flex; align-items: center; justify-content: center; font-family: var(--letter-font); font-size: 3rem; font-weight: 700; color: var(--purple); }
.tsq.blank { background: #fff0fa; border: .22rem dashed var(--pink); color: var(--pink); }
.tsq.filled { background: #eafff6; animation: pop .4s; }
.chest { padding: .7rem 1.4rem; flex-direction: row; gap: .6rem; }
.chest .emoji { font-size: 5rem; }
.chest .give-big { font-size: 4.4rem; }
.sticks { display: flex; flex-direction: row; gap: .55rem; align-items: flex-end; padding: 1rem 1.2rem; flex-wrap: wrap; justify-content: center; max-width: 48rem; }
.stick { position: relative; display: flex; flex-direction: column; gap: .05rem; background: #f4ecff; border-radius: 1rem; padding: .35rem .3rem; }
.stick span { font-size: 1.55rem; line-height: 1.08; }
.stick.counted { background: var(--pink-soft); }
.stick.counted::after, .one.counted::after { content: attr(data-n); position: absolute; left: 50%; top: -1.2rem; transform: translateX(-50%); background: var(--purple); color: #fff; font-size: 1.05rem; font-weight: 800; border-radius: .75rem; padding: 0 .4rem; min-width: 1.6rem; height: 1.6rem; display: flex; align-items: center; justify-content: center; font-family: var(--ui-font); }
.ones { display: grid; grid-template-columns: repeat(2, 2.4rem); gap: .3rem; align-self: flex-end; }
.one { position: relative; font-size: 1.9rem; width: 2.4rem; height: 2.4rem; border-radius: .6rem; display: flex; align-items: center; justify-content: center; }
.one.counted { background: var(--pink-soft); }
.choice.num.long { font-size: 4.6rem; }
.parent .lvl-set { display: block; border: 0; padding: 6px 0 0; }
.parent .lvl-set select { min-width: 0; max-width: 100%; font-size: 14px; padding: 5px 6px; margin-top: 3px; display: block; }

.parent .row-btns .btn { text-decoration: none; color: #fff; font-family: system-ui, sans-serif; font-size: 16px; min-height: 44px; padding: 0 18px; }

<script>/* js/audio.js */
'use strict';
// Voice + sound effects. Pre-readers get every instruction spoken (Web Speech API, built into iPadOS Safari),
// and every question has a repeat button. Sound effects are synthesized with Web Audio, so there are no files.
// iOS only allows audio after a tap, so app.js calls PA.audio.unlock() from the first "Play" tap.
window.PA = window.PA || {};
(function () {
  const A = PA.audio = {};
  let ctx = null;
  let voice = null;
  let token = 0;          // bumps on every say()/stop(), so stale promises resolve quietly
  A.rate = 0.9;
  A.sfxOn = true;

  // Voice choice matters more than anything else for how natural it sounds. Devices ship small "compact" voices
  // by default; the downloadable Enhanced / Premium (Apple) and Natural / Neural (Microsoft, Google) voices are far
  // smoother. Score every English voice and take the best; a grown-up can override it in Grown-ups.
  A.voiceURI = '';  // grown-up's pick ('' = automatic)
  const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|pipe organ|fred|junior|ralph|kathy|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley/i;
  const FAVOURITES = ['Ava', 'Samantha', 'Zoe', 'Allison', 'Susan', 'Nicky', 'Serena', 'Karen', 'Moira', 'Tessa', 'Kate', 'Martha',
    'Microsoft Jenny', 'Microsoft Aria', 'Microsoft Ava', 'Microsoft Emma', 'Microsoft Sonia', 'Microsoft Libby', 'Google US English', 'Google UK English Female',
    'Microsoft Zira', 'Microsoft Hazel', 'Microsoft Susan', 'Microsoft Catherine'];
  // the guide is a princess, so lean toward a female voice when nothing better is installed
  const MALE = /\b(david|mark|guy|daniel|alex|tom|aaron|arthur|rishi|oliver|george|james|ryan|christopher|eric|andrew|brian|roger|steffan|male)\b/i;
  A.scoreVoice = function (v) {
    if (!/^en[-_]/i.test(v.lang) || NOVELTY.test(v.name)) return -1000;
    const id = v.name + ' ' + (v.voiceURI || '');
    let s = 10;
    if (/premium/i.test(id)) s += 60;
    if (/enhanced|natural|neural|online/i.test(id)) s += 45;
    if (/compact/i.test(id)) s -= 15;
    const fav = FAVOURITES.findIndex(n => v.name.indexOf(n) === 0);
    if (fav >= 0) s += 30 - fav;
    if (/en[-_]US/i.test(v.lang)) s += 4; else if (/en[-_](GB|AU|IE|NZ)/i.test(v.lang)) s += 2;
    if (MALE.test(v.name) && !/female/i.test(v.name)) s -= 8;
    return s;
  };
  // iPhone / iPad (iPadOS reports itself as a Mac, so also check for touch). Safari on iOS lists every installed
  // voice, but a web page can only really use ONE voice per accent: asking for any other US voice (Ava, Allison...)
  // quietly plays Samantha. So on iOS only the voices that actually work are offered, one per accent.
  A.isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const IOS_OK = /^(Samantha|Karen|Daniel|Moira|Tessa|Rishi)\b/;
  const ACCENT = { US: 'American', GB: 'British', AU: 'Australian', IE: 'Irish', ZA: 'South African', IN: 'Indian', NZ: 'New Zealand', CA: 'Canadian', SC: 'Scottish' };
  A.accent = v => ACCENT[(v.lang.split(/[-_]/)[1] || '').toUpperCase()] || v.lang;
  A.voiceKey = v => (v.voiceURI || '') + '|' + v.name + '|' + v.lang;
  A.voices = function () {
    if (!window.speechSynthesis) return [];
    let list = (speechSynthesis.getVoices() || []).filter(v => A.scoreVoice(v) > -1000).sort((a, b) => A.scoreVoice(b) - A.scoreVoice(a));
    if (A.isIOS) {
      const ok = list.filter(v => IOS_OK.test(v.name));
      if (ok.length) list = ok;
      const seen = {};
      list = list.filter(v => { const k = v.lang.replace('_', '-'); if (seen[k]) return false; seen[k] = 1; return true; });
    }
    return list;
  };
  function pickVoice() {
    if (voice || !window.speechSynthesis) return voice;
    const list = A.voices();
    if (!list.length) return null;
    voice = (A.voiceURI && (list.find(v => A.voiceKey(v) === A.voiceURI) || list.find(v => v.voiceURI === A.voiceURI))) || list[0];
    return voice;
  }
  A.setVoice = function (uri) { A.voiceURI = uri || ''; voice = null; pickVoice(); };
  A.currentVoice = () => { voice = null; return pickVoice(); };
  if (window.speechSynthesis && 'onvoiceschanged' in speechSynthesis) {
    speechSynthesis.onvoiceschanged = () => { voice = null; pickVoice(); if (A.onVoices) A.onVoices(); };
  }

  A.unlock = function () {
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
      }
      if (ctx && ctx.state === 'suspended') ctx.resume();
      if (ctx) { // a silent blip finishes the iOS unlock
        const b = ctx.createBuffer(1, 1, 22050); const s = ctx.createBufferSource();
        s.buffer = b; s.connect(ctx.destination); s.start(0);
      }
    } catch (e) { /* audio is a nicety; the app still works silently */ }
    try {
      if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }
    } catch (e) { }
  };

  // Word-by-word hooks so the screen can light up whatever is being named ("one... two... three" flashes each gem).
  // A.onWord(word) fires as each word is spoken; A.onSpeak(true/false) fires when talking starts and stops.
  A.onWord = null;
  A.onSpeak = null;
  let timers = [];
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
  const speaking = on => { if (A.onSpeak) try { A.onSpeak(on); } catch (e) { } };

  A.stop = function () {
    token++;
    clearTimers();
    speaking(false);
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) { }
  };

  // Pauses. iPad voices barely pause at commas or question marks, so the instruction runs straight into the options
  // ("which one rhymes with cat hat sun or dog"). Instead each sentence, and each item of a list, is spoken as its own
  // little utterance with a real silence after it:
  //   "Which one rhymes with cat?" [pause] "hat" [short pause] "sun" [short pause] "or dog?"
  A.PAUSE_SENTENCE = 450;   // ms after a sentence or a "Look at this:" lead-in
  A.PAUSE_ITEM = 320;       // ms between the things in a list (options, beads, numbers being counted)
  const words = s => s.replace(/^(or|and)\s+/i, '').split(/\s+/).filter(Boolean).length;
  A.segments = function (raw) {
    const t = String(raw).replace(/\s+/g, ' ').trim();
    const out = [];
    const push = (text, pause) => { text = text.trim(); if (text && /[A-Za-z0-9]/.test(text)) out.push({ text, pause }); else if (out.length && pause > out[out.length - 1].pause) out[out.length - 1].pause = pause; };
    // a sentence-sized piece: a comma list of 3+ short items ("red heart, star, red heart") is split into items too
    const sentence = (s, pause) => {
      const items = s.split(/\s*,\s*/);
      if (items.length >= 3 && items.every(x => words(x) <= 3)) items.forEach((x, i) => push(x, i === items.length - 1 ? pause : A.PAUSE_ITEM));
      else push(s, pause);
    };
    const re = /(\.{3,}|[.!?:](?=\s|$))\s*/g;
    let last = 0, m;
    while ((m = re.exec(t))) {
      const ellipsis = m[1].charAt(0) === '.' && m[1].length >= 3;
      const piece = t.slice(last, m.index) + (ellipsis || m[1] === ':' ? '' : m[1]);
      sentence(piece, ellipsis ? A.PAUSE_ITEM : A.PAUSE_SENTENCE);
      last = m.index + m[0].length;
    }
    if (last < t.length) sentence(t.slice(last), 0);
    if (out.length) out[out.length - 1].pause = 0;
    return out;
  };

  // Speak text; resolves when finished.
  A.say = function (raw) {
    const SS = window.speechSynthesis;
    const busy = !!(SS && (SS.speaking || SS.pending));
    A.stop();
    const my = token;
    if (!raw) return Promise.resolve();
    const parts = A.segments(raw);
    if (!parts.length) return Promise.resolve();
    speaking(true);
    return (async () => {
      // a breath between one instruction and the next (e.g. the game intro, then the question). Single words like
      // the numbers said while she taps to count go out straight away.
      const since = Date.now() - lastEnd;
      const oneWord = parts.length === 1 && !/\s/.test(parts[0].text.trim());
      if (since < A.PAUSE_SENTENCE && !oneWord) await new Promise(r => setTimeout(r, A.PAUSE_SENTENCE - since));
      for (let i = 0; i < parts.length; i++) {
        if (my !== token) return false;
        await speakPart(parts[i].text, my, i === 0 && busy);
        if (my !== token) return false;
        if (parts[i].pause) await new Promise(r => setTimeout(r, parts[i].pause));
      }
      if (my === token) { clearTimers(); speaking(false); lastEnd = Date.now(); }
      return my === token;
    })();
  };
  let lastEnd = 0;

  // One utterance. Resolves when it ends (or after a length-based safety net, because iOS sometimes drops onend).
  function speakPart(text, my, afterCancel) {
    const SS = window.speechSynthesis;
    return new Promise(resolve => {
      let done = false, poll = null;
      const finish = () => { if (!done) { done = true; clearInterval(poll); clearTimeout(fallback); clearTimers(); resolve(); } };
      const fallback = setTimeout(finish, 1500 + text.length * 65 / A.rate);
      // words with their positions, for boundary events and for the timing estimate
      const words = []; const re = /[A-Za-z0-9']+/g; let m;
      while ((m = re.exec(text))) words.push({ w: m[0].toLowerCase(), at: m.index, end: m.index + m[0].length });
      const emit = i => { if (my === token && A.onWord && words[i]) try { A.onWord(words[i].w); } catch (e) { } };
      // Real word-boundary events where the voice provides them (Safari does); otherwise an estimate from the text.
      let gotBoundary = false, timeline = false, lastEmitted = -1;
      const startTimeline = () => {
        if (gotBoundary || timeline || my !== token || done) return;
        timeline = true;
        let t = 0;
        words.forEach((x, i) => {
          timers.push(setTimeout(() => { if (!gotBoundary && i > lastEmitted) { lastEmitted = i; emit(i); } }, t * 1000));
          const after = text.slice(x.end, (words[i + 1] || { at: text.length }).at);
          t += (0.13 + 0.058 * x.w.length) / A.rate;
          if (/[.!?]/.test(after)) t += 0.38 / A.rate; else if (/[,;:]/.test(after)) t += 0.2 / A.rate;
        });
      };
      if (!SS) { startTimeline(); return; }
      try {
        const u = new SpeechSynthesisUtterance(text);
        // re-check every time: iPads don't announce newly downloaded voices, and a home-screen app can stay open for days
        voice = null;
        const v = pickVoice();
        if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
        u.rate = A.rate; u.pitch = 1.04; // a high pitch exaggerates the synthetic edge
        u.onstart = () => { timers.push(setTimeout(startTimeline, 160)); };
        u.onboundary = e => {
          if (e.name && e.name !== 'word') return;
          if (!gotBoundary) { gotBoundary = true; clearTimers(); }
          let i = words.findIndex(x => e.charIndex >= x.at && e.charIndex < x.end);
          if (i < 0) i = words.findIndex(x => x.at >= e.charIndex);
          if (i > lastEmitted) { lastEmitted = i; emit(i); }
        };
        u.onend = () => setTimeout(finish, 20);
        u.onerror = () => finish();
        A._u = u; // keep a reference: Safari can garbage-collect an utterance mid-sentence and skip its onend
        // iOS: a cancel() immediately followed by speak() is sometimes swallowed; a tick of delay fixes it.
        setTimeout(() => {
          if (my !== token) return finish();
          SS.speak(u);
          // iOS sometimes never fires onend; watch the engine instead: once it has spoken and gone quiet, carry on.
          let heard = false; const t0 = Date.now();
          poll = setInterval(() => {
            if (my !== token) return finish();
            if (SS.speaking) heard = true;
            else if ((heard || Date.now() - t0 > 2500) && !SS.pending) finish();
          }, 100);
        }, afterCancel ? 60 : 0);
        // no voice at all (or onstart never fires): still light things up on the estimated timing
        timers.push(setTimeout(startTimeline, 900));
      } catch (e) { finish(); }
    });
  }

  function tone(freq, start, dur, type, vol) {
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    const t = ctx.currentTime + start;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.05);
  }

  A.sfx = function (name) {
    if (!A.sfxOn || !ctx) return;
    try {
      if (ctx.state === 'suspended') ctx.resume();
      if (name === 'right') { tone(784, 0, 0.18, 'triangle'); tone(1175, 0.1, 0.3, 'triangle'); }
      else if (name === 'wrong') { tone(330, 0, 0.22, 'sine', 0.12); tone(277, 0.12, 0.28, 'sine', 0.1); }
      else if (name === 'tap') { tone(660, 0, 0.08, 'sine', 0.1); }
      else if (name === 'drum') { tone(150, 0, 0.22, 'sine', 0.4); tone(95, 0.01, 0.3, 'sine', 0.3); }
      else if (name === 'step') { tone(523, 0, 0.1, 'triangle', 0.12); }
      else if (name === 'sparkle') { [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, i * 0.08, 0.25, 'triangle', 0.1)); }
      else if (name === 'fanfare') { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.3, 'triangle', 0.14)); }
    } catch (e) { }
  };
})();

</script>
<script>/* js/store.js */
'use strict';
// Progress + adaptive difficulty, saved on the device (localStorage).
// Adaptivity keeps the child near ~80% first-try success: two good rounds in a row (or one perfect round) move a game
// up a level; a hard round (40% or less) moves it down. Inside a level, items she gets wrong come back more often
// (spaced, interleaved review) instead of being drilled in a block.
window.PA = window.PA || {};
(function () {
  const KEY = 'princess-academy.v2';
  const S = PA.store = {};

  const blank = () => ({
    profile: { made: false, skin: 1, hair: 0, dress: 0, name: '' },
    settings: { limitMin: 20, rate: 0.9, sfx: true, roundLen: 10, voice: '' },
    games: {},
    stickers: [],
    play: { windowStart: 0, ms: 0, last: 0 }
  });

  let state;
  try { state = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { state = null; }
  if (!state || typeof state !== 'object') state = blank();
  const b = blank();
  for (const k in b) if (!(k in state)) state[k] = b[k];
  for (const k in b.settings) if (!(k in state.settings)) state.settings[k] = b.settings[k];

  S.state = state;
  S.save = function () { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { } };
  S.reset = function () { const keep = state.settings; state = S.state = blank(); state.settings = keep; S.save(); };

  S.game = function (id) {
    if (!state.games[id]) state.games[id] = { level: 1, rounds: 0, good: 0, items: {}, recent: [], extra: {} };
    return state.games[id];
  };

  // Per-item record for spaced review: [seen, firstTryCorrect, lastRoundSeen]
  S.recordItem = function (id, key, correct) {
    const g = S.game(id);
    const r = g.items[key] || (g.items[key] = [0, 0, 0]);
    r[0]++; if (correct) r[1]++; r[2] = g.rounds;
    S.save();
  };
  S.itemScore = function (id, key) {
    const r = S.game(id).items[key];
    if (!r) return 0.5;
    return (r[1] + 1) / (r[0] + 2);
  };

  // Weighted pick without replacement: weaker items and items not seen lately come up more.
  S.pick = function (id, pool, n, keyOf) {
    const g = S.game(id);
    const items = pool.slice();
    const out = [];
    while (out.length < n && items.length) {
      const w = items.map(it => {
        const k = keyOf(it); const r = g.items[k];
        const weak = 1 - S.itemScore(id, k);
        const stale = r ? Math.min(3, g.rounds - r[2]) * 0.1 : 0.3;
        return 0.15 + weak + stale;
      });
      let total = w.reduce((a, x) => a + x, 0), x = Math.random() * total, i = 0;
      while (i < w.length - 1 && x > w[i]) { x -= w[i]; i++; }
      out.push(items.splice(i, 1)[0]);
    }
    return out;
  };

  // Called at the end of a round. Returns {up, down, level}.
  S.endRound = function (id, correct, total, maxLevel) {
    const g = S.game(id);
    g.rounds++;
    const acc = total ? correct / total : 0;
    g.recent.push(Math.round(acc * 100)); if (g.recent.length > 10) g.recent.shift();
    let up = false, down = false;
    if (acc >= 0.8) g.good++; else g.good = 0;
    if ((acc === 1 || g.good >= 2) && g.level < maxLevel) { g.level++; g.good = 0; up = true; }
    else if (acc <= 0.4 && g.level > 1) { g.level--; g.good = 0; down = true; }
    // Steady ramp on top of the levels: every round played makes that game 2.5% harder (up to +100%).
    // A hard round (40% or less) holds the ramp where it is instead of pushing on.
    if (acc > 0.4) g.boost = (g.boost || 0) + 1;
    S.save();
    return { up, down, level: g.level };
  };
  // 0 .. 1: how far along the 2.5%-per-round ramp this game is
  S.challenge = id => Math.min(1, (S.game(id).boost || 0) * 0.025);
  // grown-up override: jump a game to a level (e.g. she can already count to 10)
  S.setLevel = function (id, level) { const g = S.game(id); g.level = level; g.good = 0; S.save(); };
  S.resetBoost = function (id) { S.game(id).boost = 0; S.save(); };

  S.addSticker = function (s) { state.stickers.push(s); S.save(); };

  // Play-time limit. A "day" of play resets after 60 quiet minutes or a new calendar day.
  S.tickPlay = function (ms) {
    const p = state.play, now = Date.now();
    const newDay = new Date(p.windowStart).toDateString() !== new Date(now).toDateString();
    if (!p.windowStart || newDay || now - p.last > 60 * 60 * 1000) { p.windowStart = now; p.ms = 0; }
    p.ms += ms; p.last = now;
    S.save();
  };
  S.timeUp = function () {
    const lim = state.settings.limitMin;
    if (!lim) return false;
    const p = state.play, now = Date.now();
    if (now - p.last > 60 * 60 * 1000 || new Date(p.windowStart).toDateString() !== new Date(now).toDateString()) return false;
    return p.ms >= lim * 60 * 1000;
  };
  S.grantMore = function (min) { state.play.ms = Math.max(0, state.play.ms - min * 60 * 1000); S.save(); };
})();

</script>

<script>/* js/ui.js */
'use strict';
// Shared screen helpers and the round runner every game uses.
// Feedback follows a scaffolding ladder instead of punishment: a wrong tap fades that choice and says "try again";
// a second miss highlights the right answer and explains it, and she taps it herself, so every question ends in
// success. Praise is about effort and strategy ("you counted carefully"), not about being clever.
// Rounds (10 questions by default) mix in review of earlier levels (interleaved, spaced practice), and the last
// question is a "super challenge" from the next level up: a peek at what's coming, with no penalty for missing it.
window.PA = window.PA || {};
(function () {
  const U = PA.ui = {};

  // ---------- fit the whole app to the screen: everything is in rem, so the root font size scales it ----------
  U.fit = function () {
    const W = window.innerWidth, H = window.innerHeight;
    const portrait = H > W;
    const refW = portrait ? 640 : 1024, refH = portrait ? 940 : 730;
    const u = Math.max(0.45, Math.min(1.7, Math.min(W / refW, H / refH)));
    document.documentElement.style.fontSize = (16 * u).toFixed(2) + 'px';
  };
  U.fit();
  window.addEventListener('resize', U.fit);
  window.addEventListener('orientationchange', () => setTimeout(U.fit, 200));

  U.el = function (tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  };
  U.rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  U.pick = arr => arr[Math.floor(Math.random() * arr.length)];
  U.shuffle = function (arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };
  U.wait = ms => new Promise(r => setTimeout(r, ms));
  U.listWords = function (words) {
    if (words.length <= 1) return words.join('');
    return words.slice(0, -1).join('... ') + '... or ' + words[words.length - 1];
  };
  U.NUM_WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve',
    'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen', 'twenty', 'twenty-one', 'twenty-two',
    'twenty-three', 'twenty-four', 'twenty-five', 'twenty-six', 'twenty-seven', 'twenty-eight', 'twenty-nine', 'thirty'];
  const TENS_W = ['', 'ten', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety', 'one hundred'];
  U.numWord = n => n <= 20 ? U.NUM_WORDS[n] : n % 10 === 0 ? TENS_W[n / 10] : TENS_W[Math.floor(n / 10)] + '-' + U.NUM_WORDS[n % 10];
  U.countAloud = (from, to) => { const o = []; for (let k = from; k <= to; k++) o.push(U.numWord(k)); return o.join('... '); };

  // ---------- light up what the voice is naming ----------
  // Any element with data-say="red heart" flashes when the voice says "red heart". Elements that also have
  // data-say-one flash one at a time in order (a necklace read aloud lights each bead in turn). Things are only
  // tagged when flashing can't give the answer away (counted gems, the picture being asked about, choices that
  // the question names out loud anyway).
  const norm = w => {
    w = String(w).toLowerCase().replace(/[^a-z0-9]/g, '');
    if (w.length > 3) {
      if (/ies$/.test(w)) w = w.slice(0, -3) + 'y';
      else if (/(ch|sh|x|ss)es$/.test(w)) w = w.slice(0, -2);
      else if (/[^s]s$/.test(w)) w = w.slice(0, -1);
    }
    return w;
  };
  U.normPhrase = p => String(p).split(/[\s-]+/).map(norm).filter(Boolean).join(' ');
  U.tag = function (el, phrase, one) {
    if (!el || phrase == null) return el;
    el.setAttribute('data-say', U.normPhrase(phrase));
    if (one) el.setAttribute('data-say-one', '');
    return el;
  };
  U.flash = function (el) {
    el.classList.remove('say-flash');
    void el.getBoundingClientRect();
    el.classList.add('say-flash');
    clearTimeout(el._sf);
    el._sf = setTimeout(() => el.classList.remove('say-flash'), 800);
  };
  let heard = [], seqCount = {};
  PA.audio.onSpeak = on => {
    document.body.classList.toggle('speaking', on);
    if (on) { heard = []; seqCount = {}; }
  };
  PA.audio.onWord = function (w) {
    heard.push(norm(w)); if (heard.length > 10) heard.shift();
    const root = U.current; if (!root) return;
    const els = root.querySelectorAll('[data-say]');
    if (!els.length) return;
    const seqs = {};
    for (let i = 0; i < els.length; i++) {
      const el = els[i], p = el.getAttribute('data-say');
      if (!p) continue;
      const toks = p.split(' ');
      if (toks.length > heard.length) continue;
      let ok = true;
      for (let j = 0; j < toks.length; j++) if (toks[toks.length - 1 - j] !== heard[heard.length - 1 - j]) { ok = false; break; }
      if (!ok) continue;
      if (el.hasAttribute('data-say-one')) (seqs[p] = seqs[p] || []).push(el); else U.flash(el);
    }
    for (const p in seqs) { const k = seqCount[p] || 0; seqCount[p] = k + 1; U.flash(seqs[p][k % seqs[p].length]); }
  };

  // the button she should press next glows gently
  U.go = (btn, on) => { if (btn) btn.classList.toggle('go', on !== false); return btn; };

  U.show = function (screen) {
    PA.audio.stop();
    if (U.current && U.current.onLeave) U.current.onLeave();
    const app = document.getElementById('app');
    app.innerHTML = '';
    app.appendChild(screen);
    U.current = screen;
  };

  const name = () => (PA.store.state.profile.name || '').trim();
  const PRAISE = [
    'You listened so carefully!', 'You worked it out!', 'Great thinking!', 'You looked really closely!',
    'You kept trying, and you got it!', 'Super careful work!', 'You figured it out!'
  ];
  U.praise = function () {
    const p = U.pick(PRAISE), n = name();
    return n && Math.random() < 0.3 ? p.replace('!', ', ' + n + '!') : p;
  };
  const RETRY = ['Hmm, not that one. Try again!', 'Almost! Have another look.', 'Oops! Let\'s try again.'];
  U.retry = () => U.pick(RETRY);

  const STICKERS = ['🦄', '🌈', '🌟', '🦋', '🌸', '🍰', '🎀', '👑', '💎', '🐚', '🧁', '🍓', '🐱', '🐰', '🦢', '🍭', '🎠', '🧚', '🌺', '🍩', '🐬', '🦩', '🌙', '🐞', '🐢', '🦊', '🐼', '🌻', '🍦', '🎈'];

  // ---------- the round runner ----------
  U.runGame = function (game) {
    const rec = PA.store.game(game.id);
    const level = Math.min(rec.level, game.maxLevel);
    const screen = U.el('div', 'screen');
    const top = U.el('div', 'topbar');
    const homeBtn = U.el('button', 'icon-btn', '<span class="emoji">🏰</span>');
    homeBtn.setAttribute('aria-label', 'Back to the castle');
    const title = U.el('div', 'game-title', game.name);
    const prog = U.el('div', 'progress', '<i style="width:0%"></i><b class="emoji" style="left:0%">💎</b>');
    const repeat = U.el('button', 'icon-btn say-btn', '<span class="emoji">🔊</span>');
    repeat.setAttribute('aria-label', 'Say it again');
    top.append(homeBtn, title, prog, repeat);
    const play = U.el('div', 'play');
    const stage = U.el('div', 'stage');
    const choices = U.el('div', 'choices');
    const guide = U.el('div', 'guide', PA.art.princess(null, 'happy'));
    // fitbox holds the question; if a question is taller than the screen (e.g. a phone held sideways) it is
    // shrunk to fit, so nothing ever needs scrolling
    const fitbox = U.el('div', 'fitbox');
    fitbox.append(stage, choices);
    play.appendChild(fitbox);
    screen.append(top, play, guide);
    const refit = () => {
      fitbox.style.transform = '';
      const h = fitbox.offsetHeight, w = fitbox.scrollWidth, ph = play.clientHeight, pw = play.clientWidth;
      const s = Math.min(1, ph / Math.max(h, 1), pw / Math.max(w, 1));
      if (s < 0.999) fitbox.style.transform = `scale(${s.toFixed(3)})`;
    };
    if (window.ResizeObserver) { const ro = new ResizeObserver(refit); ro.observe(fitbox); ro.observe(play); }
    else setInterval(refit, 500);

    const started = Date.now();
    let prompt = '';
    const c = PA.store.challenge(game.id);
    const api = {
      game, level, screen, play, stage, choices, alive: true,
      c, // 0..1 from the 2.5%-per-round ramp: games use it for bigger numbers, more choices, shorter peeks
      nOpts: (base, max) => Math.min(max, base + Math.floor(c * (max - base + 0.999))),
      name: name(),
      say: text => api.alive ? PA.audio.say(text) : Promise.resolve(false),
      setPrompt: text => { prompt = text; },
      prompt: text => { prompt = text; return api.say(text); },
      cheer: function () {
        guide.innerHTML = PA.art.princess(null, 'wow');
        guide.classList.remove('cheer'); void guide.offsetWidth; guide.classList.add('cheer');
        setTimeout(() => { if (api.alive) guide.innerHTML = PA.art.princess(null, 'happy'); }, 1100);
      },
      clear: () => {
        stage.innerHTML = ''; choices.innerHTML = '';
        stage.removeAttribute('style'); choices.removeAttribute('style');
        const b = play.querySelector('.banner'); if (b) b.remove();
        const o = play.querySelector('.overlay'); if (o) o.remove();
      },
      banner: text => { play.appendChild(U.el('div', 'banner', text)); },
      setProgress: function (frac) {
        const pct = Math.max(0, Math.min(1, frac)) * 100;
        prog.firstChild.style.width = pct + '%';
        prog.lastChild.style.left = pct + '%';
      },
      askChoice: (q, where) => askChoice(api, q, where),
      overlayChoice: q => {
        const ov = U.el('div', 'overlay');
        const st = U.el('div', 'stage'), ch = U.el('div', 'choices');
        ov.append(st, ch); play.appendChild(ov);
        return askChoice(api, q, { stage: st, choices: ch }).then(r => { ov.remove(); return r; });
      },
      hideGuide: () => { guide.style.display = 'none'; }
    };
    repeat.onclick = () => { PA.audio.sfx('tap'); if (prompt) api.say(prompt); };
    homeBtn.onclick = () => { PA.app.home(); };
    screen.onLeave = () => { api.alive = false; PA.store.tickPlay(Date.now() - started); };
    U.show(screen);

    (async function loop() {
      let correct = 0, total = 0, bonus = false;
      if (game.playRound) {
        const r = await game.playRound(api);
        if (!api.alive || !r) return;
        correct = r.correct; total = r.total; bonus = !!r.bonus;
        api.setProgress(1);
      } else {
        // the ramp also makes rounds longer: up to half as long again at +100%
        const len = Math.round((PA.store.state.settings.roundLen || 10) * (1 + c * 0.5));
        if (game.intro) await api.say(game.intro(level, api));
        let done = 0, qi = 0;
        while (done < len) {
          if (!api.alive) return;
          api.clear();
          guide.style.display = '';
          // pick this question's level: current level, a stretch or review level, or the end-of-round super challenge
          let lvl = level, challenge = false;
          if (len - done <= 1 && level < game.maxLevel && game.challenge !== false && qi > 0) {
            lvl = level + 1; challenge = true;
            api.banner('⭐ Super challenge!');
            await api.say('Super challenge!');
          } else if (level < game.maxLevel && game.challenge !== false && qi > 0 && Math.random() < Math.min(0.5, c)) {
            // ramp: each round played, 2.5% more of the questions come from the next level up (at most half)
            lvl = level + 1;
          } else if (level > 1 && game.review !== false && Math.random() < 0.25) {
            lvl = Math.random() < 0.6 ? level - 1 : U.rand(1, level - 1);
          }
          if (!api.alive) return;
          const q = game.next(api, qi, lvl);
          const first = q.run ? await q.run(api) : await askChoice(api, q);
          if (!api.alive) return;
          if (q.key) PA.store.recordItem(game.id, q.key, first);
          if (lvl === level) { total++; if (first) correct++; }
          if (challenge && first) bonus = true;
          done += q.size || 1; qi++;
          api.setProgress(done / len);
          await U.wait(300);
        }
      }
      if (!api.alive) return;
      const res = PA.store.endRound(game.id, correct, total, game.maxLevel);
      screen.onLeave = null; api.alive = false;
      PA.store.tickPlay(Date.now() - started);
      U.reward(game, res, bonus);
    })();
  };

  function askChoice(api, q, where) {
    const stage = (where && where.stage) || api.stage, box = (where && where.choices) || api.choices;
    if (q.build) q.build(stage, api);
    const btns = q.choices.map(c => {
      const b = U.el('button', 'card choice ' + (c.cls || ''), c.html);
      if (c.aria) b.setAttribute('aria-label', c.aria);
      box.appendChild(b);
      return b;
    });
    // When the question reads every choice out loud ("hat... sun... or dog?"), each one lights up as it's named.
    // Never when only the answer is named, so the flash can't give it away.
    if (q.flashChoices !== false) {
      const spoken = ' ' + U.normPhrase((q.prompt || '').replace(/[^A-Za-z0-9' ]+/g, ' ')) + ' ';
      const named = q.choices.every(c => c.aria && !/^\d/.test(c.aria) && spoken.indexOf(' ' + U.normPhrase(c.aria) + ' ') >= 0);
      if (named && q.choices.length > 1) btns.forEach((b, i) => U.tag(b, q.choices[i].aria));
    }
    api.setPrompt(q.prompt);
    api.say(q.prompt);
    return new Promise(resolve => {
      let misses = 0, locked = false;
      const idle = setTimeout(() => { if (api.alive && !locked) api.say(q.prompt); }, 18000);
      const rightIdx = q.choices.findIndex(c => c.correct);
      btns.forEach((b, i) => {
        b.onclick = async () => {
          if (locked || !api.alive) return;
          clearTimeout(idle);
          if (q.choices[i].correct) {
            locked = true;
            b.classList.remove('hint'); b.classList.add('right');
            PA.audio.sfx('right'); api.cheer();
            if (q.onRight) q.onRight();
            await api.say(q.praise || U.praise());
            resolve(misses === 0);
          } else {
            misses++;
            b.classList.add('wrong');
            PA.audio.sfx('wrong');
            const left = btns.filter((x, j) => j !== rightIdx && !x.classList.contains('wrong')).length;
            if (misses >= 2 || left === 0) {
              btns[rightIdx].classList.add('hint');
              if (q.onHint) q.onHint();
              api.say(q.hint || 'This one! Tap it.');
            } else {
              api.say((q.wrong && q.wrong(q.choices[i])) || (U.retry() + (q.retry ? ' ' + q.retry : '')));
            }
          }
        };
      });
    });
  }

  // ---------- end of round ----------
  U.reward = function (game, res, bonus) {
    const got = [U.pick(STICKERS)];
    if (bonus) got.push(U.pick(STICKERS));
    got.forEach(s => PA.store.addSticker(s));
    const screen = U.el('div', 'screen');
    const c = U.el('div', 'center');
    const n = name();
    const head = res.up ? 'New level unlocked!' : bonus ? 'Super challenge star!' : 'You did it' + (n ? ', ' + n : '') + '!';
    c.innerHTML = `<div class="reward-sticker emoji">${got.join(' ')}</div>
      <div class="big-msg">${head}</div>
      <div class="mid-msg">${got.length > 1 ? 'Two new stickers' : 'A new sticker'} for your book</div>`;
    const row = U.el('div', 'row');
    const again = U.go(U.el('button', 'btn', '<span class="emoji">▶️</span> Again'));
    const home = U.el('button', 'btn purple', '<span class="emoji">🏰</span> Castle');
    row.append(again, home);
    c.appendChild(row);
    if (game.tryAtHome) c.appendChild(U.el('div', 'tip', 'Grown-up idea: ' + U.pick(game.tryAtHome)));
    screen.appendChild(c);
    for (let i = 0; i < 14; i++) {
      const f = U.el('div', 'confetti emoji', U.pick(['✨', '💖', '⭐', '🌸', '💎']));
      f.style.left = Math.random() * 100 + '%'; f.style.animationDelay = (Math.random() * 0.8) + 's';
      screen.appendChild(f);
    }
    U.show(screen);
    PA.audio.sfx('fanfare');
    const timeUp = PA.store.timeUp();
    let msg = res.up ? 'Wow! You unlocked a new level! ' : 'You finished the round! ';
    if (bonus) msg += 'And you beat the super challenge! Two stickers for you!'; else msg += 'Here is a sticker for your book.';
    PA.audio.say(msg).then(() => { if (timeUp && PA.ui.current === screen) U.rest(); });
    again.onclick = () => { PA.audio.sfx('tap'); if (PA.store.timeUp()) U.rest(); else U.runGame(game); };
    home.onclick = () => { PA.audio.sfx('tap'); PA.app.home(); };
  };

  // Gentle stop when the grown-up's daily limit is reached.
  U.rest = function () {
    const screen = U.el('div', 'screen');
    const c = U.el('div', 'center');
    c.innerHTML = `<div style="width:15rem;height:18rem">${PA.art.princess(null, 'sleep')}</div>
      <div class="big-msg">Time to rest!</div>
      <div class="mid-msg">The princess is sleepy. Let's play again later.</div>`;
    const more = U.el('button', 'btn small purple', 'Grown-ups');
    c.appendChild(more);
    screen.appendChild(c);
    U.show(screen);
    PA.audio.say('Great playing today! The princess is sleepy now. Let\'s play again later. Night night!');
    more.onclick = () => PA.app.gate(() => { PA.store.grantMore(10); PA.app.home(); }, () => U.rest());
  };

  // little dice face (pips in a 3x3 grid) for 1-6
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  U.pips = n => '<div class="pips">' + Array.from({ length: 9 }, (_, i) => `<span class="${PIPS[n].indexOf(i) >= 0 ? 'on' : ''}"></span>`).join('') + '</div>';
})();

</script>
<script>/* js/games/count.js */
'use strict';
// GEM COUNTING: number sense along the counting, subitizing, comparing and adding learning trajectories from
// Building Blocks (Clements & Sarama), a preschool maths programme with strong results in large randomised trials.
//   1 count 1-5 by tapping each one (one-to-one), then pick the numeral
//   2 "Give me N" 1-5: put exactly N jewels on the crown (the give-a-number task, Wynn 1990: cardinality)
//   3 quick look 1-5: dots flash, say how many without counting (subitizing)
//   4 count 1-10 in a ten-frame (5-and-10 structure)
//   5 which chest has more / fewer?
//   6 give me N up to 10
//   7 one more / one less
//   8 hiding gems: 7 in all, I see 4, how many hiding? (part-whole, number bonds)
//   9 adding two groups (to 10)
//  10 taking away (from 10)
// Past ten (for children who already count to 10 well):
//  11 teen numbers: a full ten-frame and some more ("ten and three is thirteen"): the teen names are irregular in
//     English, so seeing 13 as 10 + 3 matters (place-value groundwork)
//  12 the number path: what number is missing? Counting sequence into the 20s, and later up to 100
//  13 make ten: how many more fill the ten-frame? (pairs that make 10 are the key to adding within 20)
//  14 counting on: 8 are in the chest, here are 3 more; start at 8 instead of counting from 1
//  15 adding within 20 with two ten-frames, shown the "make ten" way (8 + 5 = 10 + 3)
//  16 counting by tens: sticks of ten (unitizing), then sticks and loose ones up to 99
// Feedback models the strategy: count every one, "the last number tells how many", count on from the bigger part.
// The 2.5%-per-round ramp (api.c, 0..1) grows the numbers, adds answer choices (3 up to 5) and shortens peeks.
window.PA = window.PA || {};
PA.games = PA.games || [];
(function () {
  const U = PA.ui;
  const W = n => U.numWord(n);
  const THINGS = [
    { e: '💎', p: 'gems' }, { e: '🍓', p: 'strawberries' }, { e: '🌸', p: 'flowers' }, { e: '⭐', p: 'stars' },
    { e: '🧁', p: 'cupcakes' }, { e: '🦋', p: 'butterflies' }, { e: '🐚', p: 'shells' }, { e: '🍎', p: 'apples' }
  ];
  const FOOD = [{ e: '🧁', p: 'cupcakes' }, { e: '🍓', p: 'strawberries' }, { e: '🍪', p: 'cookies' }, { e: '🍎', p: 'apples' }, { e: '🍩', p: 'doughnuts' }];
  // dice-pattern centres as % of the box
  const DICE = {
    1: [[50, 50]], 2: [[25, 25], [75, 75]], 3: [[21, 21], [50, 50], [79, 79]],
    4: [[25, 25], [75, 25], [25, 75], [75, 75]], 5: [[21, 21], [79, 21], [50, 50], [21, 79], [79, 79]],
    6: [[25, 19], [75, 19], [25, 50], [75, 50], [25, 81], [75, 81]]
  };

  // k numeral choices around n (the answer lands in a random position, never always in the middle)
  function numberChoices(n, lo, hi, k, step) {
    k = k || 3; step = step || 1;
    const near = [];
    for (let d = 1; d <= Math.max(2, k - 1); d++) near.push(n - d * step, n + d * step);
    const set = new Set([n]);
    for (const x of U.shuffle(near)) if (set.size < k && x >= lo && x <= hi) set.add(x);
    return Array.from(set).sort((a, b) => a - b).map(x => ({ html: String(x), cls: 'num', correct: x === n, aria: String(x) }));
  }
  function gemBox(t, n, cls) {
    const box = U.el('div', 'card gems');
    const gems = [];
    for (let i = 0; i < n; i++) { const g = U.el('button', 'gem emoji' + (cls ? ' ' + cls : ''), t.e); box.appendChild(g); gems.push(g); }
    return { box, gems };
  }
  // number label on a counted thing; it also lights up whenever the voice says that number
  const label = (g, n) => { g.dataset.n = n; g.classList.add('counted'); U.tag(g, W(n)); };
  // tap each one to count it; numbering continues across groups (from `start`, for counting on).
  // Returns a "count them all" helper for hints.
  function tapToCount(gems, start) {
    start = start || 0;
    let k = start;
    const live = () => gems.filter(g => !g.classList.contains('eaten'));
    gems.forEach(g => {
      g.onclick = () => {
        if (g.classList.contains('counted') || g.classList.contains('eaten')) return;
        k++; label(g, k);
        PA.audio.sfx('tap'); PA.audio.say(W(k));
      };
    });
    return () => { live().forEach((g, i) => label(g, start + i + 1)); k = start + live().length; };
  }
  const pickKey = (prefix, lo, hi) => {
    const pool = []; for (let x = lo; x <= hi; x++) pool.push(x);
    return PA.store.pick('count', pool, 1, x => prefix + x)[0];
  };
  function tenFrame(t, n, ghosts) {
    const box = U.el('div', 'card tenframe');
    const gems = [], empty = [], slots = [];
    for (let i = 0; i < 10; i++) {
      const s = U.el('div', 'slot');
      if (i < n) { const g = U.el('button', 'gem emoji', t.e); s.appendChild(g); gems.push(g); }
      else if (ghosts) { const g = U.el('button', 'gem emoji ghost', t.e); s.appendChild(g); empty.push(g); }
      box.appendChild(s); slots.push(s);
    }
    return { box, gems, empty, slots };
  }

  // 1, 4: count
  function countQ(lo, hi, layout, k) {
    const n = pickKey('count:', lo, hi), t = U.pick(THINGS);
    let countAll;
    return {
      key: 'count:' + n,
      prompt: `How many ${t.p}? Tap each one to count.`,
      build(stage) {
        let box, gems = [];
        if (layout === 'ten' && n <= 10) ({ box, gems } = tenFrame(t, n));
        else ({ box, gems } = gemBox(t, n));
        stage.appendChild(box);
        countAll = tapToCount(gems);
      },
      choices: numberChoices(n, 1, hi + 1, k),
      onHint: () => countAll && countAll(),
      hint: `Let's count together. ${U.countAloud(1, n)}. The last number we say tells how many: ${W(n)}! Tap ${W(n)}.`,
      praise: U.pick([`Yes! ${W(n)} ${t.p}!`, `${W(n)}! You counted every one.`, `That's right, ${W(n)}! The last number tells how many.`])
    };
  }

  // 3: quick look
  function quickQ(c, k) {
    const n = pickKey('look:', 1, c >= 0.5 ? 6 : 5), t = U.pick(THINGS);
    let cover;
    return {
      key: 'look:' + n,
      prompt: 'Quick look! How many did you see?',
      build(stage) {
        const box = U.el('div', 'card dice');
        DICE[n].forEach(([x, y]) => {
          const g = U.el('div', 'gem emoji', t.e);
          g.style.left = x + '%'; g.style.top = y + '%';
          box.appendChild(g);
        });
        cover = U.el('div', 'flash-cover emoji', '☁️');
        cover.style.display = 'none';
        box.appendChild(cover);
        stage.appendChild(box);
        setTimeout(() => { cover.style.display = ''; }, Math.round(1500 * (1 - 0.45 * c)));
      },
      choices: numberChoices(n, 1, 7, k),
      onHint: () => { if (cover) cover.style.display = 'none'; },
      hint: `Let's look again. ${U.countAloud(1, n)}. ${W(n)}! Tap ${W(n)}.`,
      praise: U.pick([`Yes! ${W(n)}! You saw it so fast!`, `${W(n)}! Great quick looking!`])
    };
  }

  // 2, 6: give me N
  function giveQ(lo, hi, pileSize) {
    const n = pickKey('give:', lo, hi), t = U.pick(THINGS);
    return {
      key: 'give:' + n,
      run: api => new Promise(resolve => {
        const head = U.tag(U.el('div', 'give-big', String(n)), W(n));
        const zone = U.el('div', 'card crown-zone');
        const ph = U.el('span', 'emoji', '👑'); ph.style.fontSize = '3.4rem'; ph.style.opacity = '.35';
        zone.appendChild(ph);
        const pile = U.el('div', 'pile');
        const items = [];
        for (let i = 0; i < pileSize; i++) { const g = U.el('button', 'gem emoji', t.e); pile.appendChild(g); items.push(g); }
        api.stage.style.flexDirection = 'column';
        api.stage.append(head, zone, pile);
        const done = U.el('button', 'btn mint', '<span class="emoji">✅</span> Done');
        api.choices.appendChild(done);
        const inCrown = () => zone.querySelectorAll('.gem');
        // number the crown jewels so "one... two... three" lights each in turn; Done glows once there's something to check
        const refresh = () => {
          const list = inCrown();
          ph.style.display = list.length ? 'none' : '';
          for (let i = 0; i < list.length; i++) U.tag(list[i], W(i + 1));
          U.go(done, list.length > 0 && !done.disabled);
        };
        items.forEach(g => {
          g.onclick = () => {
            if (g.classList.contains('gone')) return;
            g.classList.add('gone');
            const c = U.el('button', 'gem emoji', t.e);
            c.onclick = () => { c.remove(); g.classList.remove('gone'); PA.audio.sfx('tap'); refresh(); PA.audio.say(W(inCrown().length)); };
            zone.appendChild(c); refresh();
            PA.audio.sfx('step'); PA.audio.say(W(inCrown().length));
          };
        });
        api.prompt(`Put ${W(n)} ${t.p} on the princess's crown. Then tap done.`);
        let misses = 0, finished = false;
        done.onclick = async () => {
          if (finished) return;
          const k = inCrown().length;
          if (k === n) {
            finished = true; done.disabled = true; U.go(done, false);
            PA.audio.sfx('right'); api.cheer();
            await api.say(U.pick([`Yes! ${W(n)} ${t.p}! Perfect!`, `${W(n)}! You counted out exactly ${W(n)}!`]));
            return resolve(misses === 0);
          }
          misses++; PA.audio.sfx('wrong');
          const counted = k ? U.countAloud(1, k) + '. That\'s ' + W(k) + '.' : 'The crown is empty.';
          if (misses < 2) {
            api.say(`Let's check. ${counted} We need ${W(n)}. ${k > n ? 'Take some off.' : 'Add some more.'}`);
          } else {
            done.disabled = true; U.go(done, false);
            while (inCrown().length > n) inCrown()[inCrown().length - 1].click();
            while (inCrown().length < n) { const free = items.find(g => !g.classList.contains('gone')); if (!free) break; free.click(); }
            PA.audio.sfx('sparkle');
            await api.say(`Let's do it together. ${U.countAloud(1, n)}. Now there are ${W(n)}!`);
            resolve(false);
          }
        };
      })
    };
  }

  // 5: more or fewer
  function compareQ(c) {
    const d = pickKey('cmp:', 1, 4);
    const top = 10 + Math.round(c * 8);
    const lo = U.rand(1, top - d), hi = lo + d;
    const askMore = Math.random() < 0.6;
    const t = U.pick(THINGS);
    const left = Math.random() < 0.5 ? lo : hi, right = left === lo ? hi : lo;
    const ans = askMore ? hi : lo;
    const card = n => {
      let h = ''; for (let i = 0; i < n; i++) h += `<span class="gem sm emoji">${t.e}</span>`;
      return `<div class="gems" style="padding:0;max-width:16rem;gap:.3rem">${h}</div>`;
    };
    const word = askMore ? 'more' : 'fewer';
    return {
      key: 'cmp:' + d,
      prompt: `Which treasure chest has ${word} ${t.p}?`,
      choices: [left, right].map(n => ({ html: card(n), cls: 'wide', correct: n === ans, aria: n + ' ' + t.p })),
      hint: `This chest has ${W(hi)}, and that one has ${W(lo)}. ${W(hi)} is more than ${W(lo)}. So ${W(ans)} is ${word}. Tap it.`,
      praise: `Yes! ${W(ans)} is ${word} than ${W(ans === hi ? lo : hi)}!`
    };
  }

  // 7: one more / one less
  function moreLessQ(c, k) {
    const top = 10 + Math.round(c * 8);
    const more = Math.random() < 0.55;
    const n = more ? pickKey('more:', 1, top - 1) : pickKey('less:', 2, top);
    const t = U.pick(THINGS);
    const ans = more ? n + 1 : n - 1;
    let countAll;
    return {
      key: (more ? 'more:' : 'less:') + n,
      prompt: more ? `The fairy has ${W(n)} ${t.p}. Watch! She magics one more. How many now?`
        : `The fairy has ${W(n)} ${t.p}. Oh no! The dragon takes one away. How many now?`,
      build(stage) {
        const { box, gems } = gemBox(t, n);
        stage.appendChild(box);
        setTimeout(() => {
          if (more) {
            const g = U.el('button', 'gem emoji arrive', t.e); box.appendChild(g); gems.push(g); PA.audio.sfx('sparkle');
          } else { gems[gems.length - 1].classList.add('eaten'); PA.audio.sfx('wrong'); }
          countAll = tapToCount(gems);
        }, 2600);
        countAll = tapToCount(gems);
      },
      choices: numberChoices(ans, 1, top, k),
      onHint: () => countAll && countAll(),
      hint: more ? `There were ${W(n)}. One more makes ${W(ans)}. Tap ${W(ans)}.` : `There were ${W(n)}. One less makes ${W(ans)}. Tap ${W(ans)}.`,
      praise: more ? `Yes! ${W(n)}, and one more is ${W(ans)}!` : `Yes! One less than ${W(n)} is ${W(ans)}!`
    };
  }

  // 8: hiding (part-whole)
  function hidingQ(c, k) {
    const top = 10 + Math.round(c * 5);
    const T = pickKey('hide:', 3, top), v = U.rand(1, T - 1), h = T - v;
    const t = U.pick(THINGS);
    let cloud, box;
    return {
      key: 'hide:' + T,
      prompt: `There are ${W(T)} ${t.p} in all. I can see ${W(v)}. How many are hiding under the cloud?`,
      build(stage) {
        stage.appendChild(U.el('div', 'card prompt-card', `<span class="give-big">${T}</span><span class="lbl">in all</span>`));
        const g = gemBox(t, v);
        box = g.box;
        cloud = U.el('div', 'cloud emoji', '☁️');
        box.appendChild(cloud);
        tapToCount(g.gems);
        stage.appendChild(box);
      },
      choices: numberChoices(h, 1, top - 1, k),
      onHint: () => {
        if (!cloud) return;
        const frag = []; for (let i = 0; i < h; i++) frag.push(U.tag(U.el('span', 'gem emoji hidden-gem', t.e), W(v + i + 1)));
        cloud.replaceWith.apply(cloud, frag);
      },
      hint: `Let's count on from ${W(v)}: ${U.countAloud(v, T)}. That's ${W(h)} more hiding! Tap ${W(h)}.`,
      praise: `Yes! ${W(v)} and ${W(h)} make ${W(T)}!`
    };
  }

  // 9: add two groups
  function addQ(c, k) {
    const top = 10 + Math.round(c * 5);
    const S = pickKey('add:', 2, top), a = U.rand(1, S - 1), b = S - a;
    const t = U.pick(THINGS);
    let countAll;
    return {
      key: 'add:' + S,
      prompt: `The princess has ${W(a)} ${t.p} in this box, and ${W(b)} in that box. How many ${t.p} altogether?`,
      build(stage) {
        const A = gemBox(t, a), B = gemBox(t, b);
        A.box.style.maxWidth = B.box.style.maxWidth = '17rem';
        stage.append(A.box, U.el('div', 'plus', '+'), B.box);
        countAll = tapToCount(A.gems.concat(B.gems));
      },
      choices: numberChoices(S, 1, top + 2, k),
      onHint: () => countAll && countAll(),
      hint: `Let's count them all: ${U.countAloud(1, S)}. ${W(a)} and ${W(b)} make ${W(S)}! Tap ${W(S)}.`,
      praise: U.pick([`Yes! ${W(a)} and ${W(b)} make ${W(S)}!`, `${W(S)} altogether! Great adding!`])
    };
  }

  // 10: take away
  function takeQ(c, k) {
    const top = 10 + Math.round(c * 5);
    const s = pickKey('take:', 3, top), tk = U.rand(1, s - 1), left = s - tk;
    const t = U.pick(FOOD);
    let countAll;
    return {
      key: 'take:' + s,
      prompt: `There are ${W(s)} ${t.p}. The hungry dragon eats ${W(tk)}! How many are left?`,
      build(stage) {
        const g = gemBox(t, s);
        stage.append(g.box, U.el('div', 'cloud emoji', '🐉'));
        countAll = tapToCount(g.gems);
        setTimeout(() => { g.gems.slice(s - tk).forEach(x => x.classList.add('eaten')); PA.audio.sfx('wrong'); }, 2400);
      },
      choices: numberChoices(left, 1, top, k),
      onHint: () => countAll && countAll(),
      hint: `Count the ones that are left: ${U.countAloud(1, left)}. ${W(s)} take away ${W(tk)} is ${W(left)}. Tap ${W(left)}.`,
      praise: `Yes! ${W(s)} take away ${W(tk)} leaves ${W(left)}!`
    };
  }

  // 11: teen numbers = ten and some more
  function teenQ(c, k) {
    const n = pickKey('teen:', 11, c >= 0.5 ? 20 : 19), t = U.pick(THINGS);
    let countAll;
    return {
      key: 'teen:' + n,
      prompt: c >= 0.5 ? `How many ${t.p}?` : `How many ${t.p}? This frame is full: that's ten. Then count on.`,
      build(stage) {
        const wrap = U.el('div', 'frames');
        const A = tenFrame(t, 10), B = tenFrame(t, n - 10);
